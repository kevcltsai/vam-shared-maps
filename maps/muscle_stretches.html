<style>/* Share viewer styles. Order: tokens and base (this part), the card, canvas and inspector rules extracted from styles.css, then the viewer-only parts below the marker. */

  --text-error: #d1243c;

  --radius-m: 8px;
  --font-semibold: 600;
  --font-ui-smaller: 12px;
  --font-ui-small: 13px;
  --font-ui-medium: 15px;
  --font-ui-large: 20px;
  --input-height: 30px;
  --size-4-3: 12px;
  --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", Roboto, sans-serif;

}

<script type="application/json" id="vam-map">{"format":"vam-share","version":1,"title":"背部伸展","language":"zh-TW","exportedAt":"2026-11-24T16:56:23.190Z","source":{"vamVersion":"0.34.0","mapId":"71af2c84-88ab-4813-bc97-63fcd4003f23"},"viewport":{"x":-1338.7168272234217,"y":245.4765676338725,"zoom":0.8164266663337072},"nodes":[{"id":"55aa73cd-fa9c-4ad8-9ec5-97d5614e060d","parentId":null,"x":339,"y":31,"collapsed":false,"status":"completed","title":"斜方肌","summary":"斜方肌分上、中、下三部，副神經（CN XI）負責運動；伸展以30秒為單一試驗結果，系統性回顧仍缺，且單做伸展效果弱。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">斜方肌三部的起止點與副神經支配在各來源一致，差異只在胸椎節數。伸展部分，目前只找到一項 100 人的隨機試驗支持 30 秒，並沒有專門針對斜方肌伸展時間的系統性回顧。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖：三部各自的位置與功能\u003c/h3>\n\u003cp dir=\"auto\">想像從後方看一個人的上背：一塊菱形的薄肌從後腦勺一路鋪到第十二節胸椎，兩側合起來像一張斜放的方桌，「trapezius」之名即由此而來。下圖是 Wikimedia Commons 上的斜方肌示意圖。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Trapezius.png/1280px-Trapezius.png\" alt=\"斜方肌示意圖。Trapezius.png，Chrizz 原作，2005 年 5 月 27 日，Wikimedia Commons，GFDL／CC BY-SA 3.0\">\u003c/p>\n\u003cp dir=\"auto\">圖：Trapezius.png，作者 Chrizz（瑞典語維基百科使用者），2005 年；來源頁：\u003ca href=\"https://commons.wikimedia.org/wiki/File:Trapezius.png\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://commons.wikimedia.org/wiki/File:Trapezius.png\" target=\"_blank\">Wikimedia Commons\u003c/a>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>部位\u003c/th>\n\u003cth>起點\u003c/th>\n\u003cth>止點\u003c/th>\n\u003cth>主要動作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>上部\u003c/td>\n\u003ctd>枕外隆凸、上項線內側 1/3、項韌帶、C7 棘突\u003c/td>\n\u003ctd>鎖骨外側 1/3、肩峰\u003c/td>\n\u003ctd>抬高肩胛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中部\u003c/td>\n\u003ctd>T1–T4 棘突（有來源寫 T1–T5，也有寫 C7–T3）\u003c/td>\n\u003ctd>肩峰內側緣、肩胛棘上唇\u003c/td>\n\u003ctd>肩胛後縮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下部\u003c/td>\n\u003ctd>T6–T12 棘突（有來源寫 T4–T12）\u003c/td>\n\u003ctd>肩胛棘根部的結節\u003c/td>\n\u003ctd>肩胛下壓\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">上部與下部合作時，使肩胛向上旋轉。運動由副神經（第 XI 對腦神經）支配；感覺與本體感覺由 C3、C4 腹側支提供。中、下部胸椎節數各來源不一，本頁保留範圍而不擇一。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 711 252\" width=\"711\" height=\"252\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;? pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,-66 -93.81,-66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,-66C-179.56,-66 -179.56,-94 -197.56,-94\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,-66C-179.56,-66 -179.56,-38 -197.56,-38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-127.69,-66)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">中部\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-255.87,-94)\">\u003crect x=\"-58.31\" y=\"-24\" width=\"116.62\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">T1–T4 棘突\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-247.32,-38)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛後縮\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,66 -93.81,66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,38 -197.56,38\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,94 -197.56,94\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-127.69,66)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下部\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-260.8,38)\">\u003crect x=\"-63.24\" y=\"-24\" width=\"126.48\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">T6–T12 棘突\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-247.32,94)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛下壓\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">斜方肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">資料來源：\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK518994/\" rel=\"noopener nofollow\" target=\"_blank\">StatPearls（NCBI）\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/trapezius-muscle\" rel=\"noopener nofollow\" target=\"_blank\">Kenhub\u003c/a>、\u003ca href=\"https://radiopaedia.org/articles/41023\" rel=\"noopener nofollow\" target=\"_blank\">Radiopaedia\u003c/a>。\u003c/p>\n\u003ch3 dir=\"auto\">各部伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">這一節的限制要先講：我只在搜尋結果裡確認了標題，並實際打開了下列影片頁面，但頁面文字大多是 YouTube 導覽列，\u003cstrong>無法確認影片裡的操作細節與停留秒數\u003c/strong>。每個動作的「示範圖片」我也沒有查到可驗證的圖檔，只有上面的解剖圖。\u003c/p>\n\u003ch4 dir=\"auto\">上部：耳朵靠肩的側彎\u003c/h4>\n\u003cp dir=\"auto\">坐姿或站姿、肩膀放鬆，頭向一側傾，耳朵朝肩膀靠近。Physitrack 頁面寫保持 10–15 秒，Well+Good 引述物理治療師 Kelly Pearce Baez 的版本是 30 秒、每天一至兩次，兩者不一致。有影片版本會用同側手抓住椅子底部，再側彎。\u003ca href=\"https://www.physitrack.com/da/exercise-library/how-to-perform-the-upper-trap-stretch-exercise\" rel=\"noopener nofollow\" target=\"_blank\">Physitrack\u003c/a>、\u003ca href=\"https://wellandgood.com/?p=1187016\" rel=\"noopener nofollow\" target=\"_blank\">Well+Good\u003c/a>。\u003c/p>\n\u003cp dir=\"auto\">影片（已打開，Ask Doctor Jo，標題 Upper Trapezius Stretch，內文未顯示秒數）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=-r0eoFS7_5Q\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=-r0eoFS7_5Q\" target=\"_blank\">▶ https://www.youtube.com/watch?v=-r0eoFS7_5Q\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">提肩胛肌（鄰近肌肉，非斜方肌）\u003c/h4>\n\u003cp dir=\"auto\">搜尋結果中常與上斜方肌並列。它從頸部延伸到肩胛骨上角，伸展時頭轉向、低頭，常配合手加壓。這部分我沒有取得解剖來源，僅以影片簡介為據。\u003c/p>\n\u003cp dir=\"auto\">影片（已打開，Ask Doctor Jo，標題 Levator Scapula Stretch）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=GSoXPJRnR6E\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=GSoXPJRnR6E\" target=\"_blank\">▶ https://www.youtube.com/watch?v=GSoXPJRnR6E\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">中部：菱形肌／中斜方肌伸展\u003c/h4>\n\u003cp dir=\"auto\">一支影片簡介描述：拇指朝下，抓住門框或深蹲架低處，臀部往後坐；另一種是坐姿雙臂交叉、抓大腿外側，往前圓背，拉感在兩肩胛骨之間。我沒有找到單獨針對中斜方肌的橫向交叉手臂伸展影片。\u003c/p>\n\u003cp dir=\"auto\">影片（已打開，標題 Rhomboid/Middle Trapezius Stretch，頻道名頁面未顯示）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=OlcSj5J01mk\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=OlcSj5J01mk\" target=\"_blank\">▶ https://www.youtube.com/watch?v=OlcSj5J01mk\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">下部：中下斜方肌伸展\u003c/h4>\n\u003cp dir=\"auto\">只找到標題為「Stretching the Middle and Lower Trapezius」的影片，簡介僅說由一位 Wendell 示範，動作內容我未能確認。另有「Lower Trapezius &amp; Rhomboid Stretch」（\u003ccode>eeDMqwyHMs0\u003c/code>），我沒有打開，所以不作為推薦。\u003c/p>\n\u003cp dir=\"auto\">影片（已打開，頻道名頁面未顯示）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=Haoh1p__y90\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=Haoh1p__y90\" target=\"_blank\">▶ https://www.youtube.com/watch?v=Haoh1p__y90\u003c/a>\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">以上影片多為物理治療師、整脊師或健身創作者所作，不是同儕審查資料；動作細節請以臨床來源核對，疼痛時應停止並諮詢專業人員。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">伸展的證據強度\u003c/h3>\n\u003cp dir=\"auto\">搜尋摘要指出：一項隨機試驗納入 100 位慢性肌筋膜性頸肩痛者，比較 15、30、60 秒；30 與 60 秒在疼痛強度與壓痛閾值上優於 15 秒與不伸展，作者認為 30 秒最合適。但這只是單一試驗，我沒能確認它的完整書目，搜尋結果中有數篇候選（如 \u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8772376\" rel=\"noopener nofollow\" target=\"_blank\">PMC8772376\u003c/a>、\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/36305079/\" rel=\"noopener nofollow\" target=\"_blank\">PubMed 36305079\u003c/a>），未逐篇核對。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">Cochrane 的頸痛運動回顧指出，只做伸展時預期不會有益；針對頸、肩、肩胛區的肌力訓練對慢性頸痛看來有用。\u003ca href=\"https://www.cochrane.org/CD004250\" rel=\"noopener nofollow\" target=\"_blank\">Cochrane CD004250\u003c/a>。另有登記中的試驗在比較 15、30、60 秒（\u003ca href=\"https://clinicaltrials.gov/study/NCT04190784\" rel=\"noopener nofollow\" target=\"_blank\">NCT04190784\u003c/a>）。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">中、下斜方肌起點的胸椎節數，哪個版本較通行？\u003c/li>\n\u003cli dir=\"auto\">30 秒的單一試驗能否被重複？有沒有系統性回顧？\u003c/li>\n\u003cli dir=\"auto\">各動作對「斜方肌某一部」是否真的有選擇性拉伸？現有資料不足。\u003c/li>\n\u003cli dir=\"auto\">每個伸展動作的可驗證示範圖片與影片內容，需要真人看完影片後確認。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>斜方肌示意圖（Trapezius.png）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://commons.wikimedia.org/wiki/File:Trapezius.png\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://commons.wikimedia.org/wiki/File:Trapezius.png\u003c/a>\u003cbr>\n用途：Chrizz 於 2005 年製作的斜方肌位置圖，Wikimedia Commons，GFDL／CC BY-SA 3.0。\u003cbr>\n配色：red / gray / white\u003cbr>\n可套用公式：解剖示意圖，標出斜方肌範圍，用來對照上、中、下三部\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK518994/\" rel=\"noopener nofollow\" target=\"_blank\">StatPearls 斜方肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/trapezius-muscle\" rel=\"noopener nofollow\" target=\"_blank\">Kenhub 斜方肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://radiopaedia.org/articles/41023\" rel=\"noopener nofollow\" target=\"_blank\">Radiopaedia 斜方肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://commons.wikimedia.org/wiki/File:Trapezius.png\" rel=\"noopener nofollow\" target=\"_blank\">Wikimedia Commons Trapezius.png\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.cochrane.org/CD004250\" rel=\"noopener nofollow\" target=\"_blank\">Cochrane CD004250\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://clinicaltrials.gov/study/NCT04190784\" rel=\"noopener nofollow\" target=\"_blank\">ClinicalTrials.gov NCT04190784\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physitrack.com/da/exercise-library/how-to-perform-the-upper-trap-stretch-exercise\" rel=\"noopener nofollow\" target=\"_blank\">Physitrack\u003c/a>、\u003ca href=\"https://wellandgood.com/?p=1187016\" rel=\"noopener nofollow\" target=\"_blank\">Well+Good\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">YouTube：-r0eoFS7_5Q、GSoXPJRnR6E、OlcSj5J01mk、Haoh1p__y90（皆已開啟頁面，僅確認標題）\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=2uI_adZ1png\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=2uI_adZ1png\" target=\"_blank\">▶ https://www.youtube.com/watch?v=2uI_adZ1png\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=qfYcLXhCjWw\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=qfYcLXhCjWw\" target=\"_blank\">▶ https://www.youtube.com/watch?v=qfYcLXhCjWw\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=M850sCj9LHQ\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=M850sCj9LHQ\" target=\"_blank\">▶ https://www.youtube.com/watch?v=M850sCj9LHQ\u003c/a>\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理，補入解剖分部、四個伸展動作與已開啟的 YouTube 影片頁。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入起止點與神經支配的來源差異、30 秒伸展的單一試驗證據；與先前結論不一致：先前寫「秒數沒有共識」，現查到單一試驗支持 30 秒，目前判斷仍屬證據有限；未新增影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補查物理治療師來源（Hinge Health 每側 30 秒、The Healthy 提肩胛肌每日 2–3 次），保留既有影片與解剖資料；本次未新開 YouTube 影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：補查伸展時間證據，未找到系統性回顧，30 秒仍僅單一試驗支持；新增上斜方肌僵硬與頸痛的統合分析；未新開 YouTube 影片。\u003c/li>\n\u003c/ul>"},{"id":"c810cba4-2ac7-4e2e-b058-0a551f98bf9e","parentId":null,"x":35,"y":31,"collapsed":false,"status":"completed","title":"頸夾肌","summary":"頸夾肌（T3–T6→C1–C3）是頸伸肌；伸展為前屈加對側側屈旋轉，單獨伸展證據薄弱，各來源起止點層級略有出入。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">夾肌分頭夾肌與頸夾肌兩塊，同屬背部固有肌淺層。頸夾肌兩側同時收縮伸頸，單側收縮使頸同側側屈與旋轉；伸展則是方向相反的組合動作。起止點的節數各來源略有不同。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">你標在後頸的那一點，指的就是這一帶：一條斜向走的肌肉帶，從上胸椎棘突往上外側拉到頸椎與頭骨。這一章要回答的是：這塊肌肉到底接在哪裡，要怎麼拉到它？\u003c/p>\n\u003ch3 dir=\"auto\">解剖\u003c/h3>\n\u003ch4 dir=\"auto\">頸夾肌\u003c/h4>\n\u003cp dir=\"auto\">起於 T3–T6 棘突，止於 C1–C3 橫突；由下位頸神經後支外側支支配，單側作用為同側側屈與旋轉，雙側為伸頸（\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/splenius-capitis-muscle/24194\" rel=\"noopener nofollow\" target=\"_blank\">Elsevier 解剖資源\u003c/a>與 \u003ca href=\"https://www.kenhub.com/en/library/anatomy/splenius-cervicis-muscle\" rel=\"noopener nofollow\" target=\"_blank\">Kenhub\u003c/a> 搜尋摘要）。有來源把神經寫成 C5–C6，與前者不同。\u003c/p>\n\u003ch4 dir=\"auto\">頭夾肌\u003c/h4>\n\u003cp dir=\"auto\">依 \u003ca href=\"https://en.wikipedia.org/wiki/Splenius_capitis_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Wikipedia\u003c/a>：起於項韌帶、C7 與上兩節胸椎棘突；止於顳骨乳突與枕骨上項線外側三分之一下方；神經為 C3、C4 後支；作用為伸頭、旋轉、側屈。其他來源把起點寫成 C7–T3 或 T1–T3，層級不一。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Musculus_splenius_capitis_marked.png/330px-Musculus_splenius_capitis_marked.png\" alt=\"頭夾肌與頸夾肌標示圖（Musculus splenius capitis marked，Wikimedia Commons）\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>頭夾肌與頸夾肌標示圖\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Splenius_capitis_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Splenius_capitis_muscle\u003c/a>\u003cbr>\n用途：背部肌肉圖中標示頭夾肌與頸夾肌位置\u003cbr>\n配色：red / gray\u003cbr>\n可套用公式：標示肌肉輪廓加解剖底圖\u003c/p>\n\u003cp dir=\"auto\">圖：頭夾肌與頸夾肌標示圖，Wikimedia Commons，來源頁 \u003ca href=\"https://en.wikipedia.org/wiki/Splenius_capitis_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Wikipedia\u003c/a>；作者與年份來源未載明。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/DeepNapeMuscles.jpg/330px-DeepNapeMuscles.jpg\" alt=\"深層項部肌肉（DeepNapeMuscles，依 Testut 解剖學）\">\u003c/p>\n\u003cp dir=\"auto\">圖：深層項部肌肉，Wikimedia Commons，依 Testut 解剖學繪製；年份未載明。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">三種動作都是搜尋與頁面摘要得到的描述，我沒有逐一確認動作細節。影片只有標題確認為真（網頁無法讀到頻道與內容）。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>動作\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>圖片\u003c/th>\n\u003cth>影片\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>前屈＋對側側屈＋對側旋轉\u003c/td>\n\u003ctd>低頭、頭偏離該側、轉向對側（解剖來源描述）\u003c/td>\n\u003ctd>現有資料不足，未取得可用圖\u003c/td>\n\u003ctd>\u003ca href=\"https://www.youtube.com/watch?v=t-en4bmbSTM\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=t-en4bmbSTM\" target=\"_blank\">▶ https://www.youtube.com/watch?v=t-en4bmbSTM\u003c/a>（標題為「Splenius Capitis and Cervicis Self Stretch Exercise - Using your hand」，搜尋摘要稱先收下巴再用手輔助前屈與側彎，約 30 秒；我只確認標題）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>單純前屈（下巴靠向胸口）\u003c/td>\n\u003ctd>站直，讓頭重量自然下垂，不要用力壓（\u003ca href=\"https://www.nielasher.com/blogs/exercises-and-stretches/forward-flexion-neck-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Niel Asher\u003c/a>）\u003c/td>\n\u003ctd>\u003cimg src=\"https://cdn.shopify.com/s/files/1/0761/9521/files/LevatorScap_Stretching1_480x480.jpg?v=1646397827\" alt=\"前屈頸部伸展照片\">\u003c/td>\n\u003ctd>\u003ca href=\"https://www.youtube.com/watch?v=TlQ-cJFaR-A\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=TlQ-cJFaR-A\" target=\"_blank\">▶ https://www.youtube.com/watch?v=TlQ-cJFaR-A\u003c/a>（標題為「Splenius Capitis Muscle Stretch」；內容我未能確認，只能當作該肌肉的一般伸展示範）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>頭前伸（凸下巴）伸展頸夾肌\u003c/td>\n\u003ctd>保持頭部水平、視線向前，下巴前推，不要讓下巴下垂（\u003ca href=\"https://www.nielasher.com/blogs/video-blog/stretching-for-pain-relief-and-rehabilitation-splenius-cervicis\" rel=\"noopener nofollow\" target=\"_blank\">Niel Asher\u003c/a>）\u003c/td>\n\u003ctd>\u003cimg src=\"https://cdn.shopify.com/s/files/1/0761/9521/files/4691_Trunk_and_Spine_-_Stretching_for_Pain_Relief_and_Rehabilitation__page_16_of_28_large.jpg\" alt=\"頸夾肌伸展插圖\">\u003c/td>\n\u003ctd>該頁面無嵌入 YouTube 影片；現有資料不足\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">Niel Asher 的前屈伸展頁同時列出多塊頸椎伸肌（半棘肌、最長肌、夾肌等）為主要目標，所以這個動作不是頸夾肌專屬。YouTube 頁面讀取時看不到頻道與影片內容，內容僅依標題與搜尋摘要。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">證據與限制\u003c/h3>\n\u003cp dir=\"auto\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3435917/\" rel=\"noopener nofollow\" target=\"_blank\">PMC 的文獻回顧\u003c/a>經搜尋摘要顯示，自我伸展可能減輕頸痛，至少短期有效；我沒有打開全文，因此無法確認它是否專指頸夾肌。你原本記的「單獨伸展證據薄弱，搭配肌力訓練較有支持」，這次沒有找到可驗證的來源，維持待查。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">待確認：（1）頸夾肌專屬伸展的對照研究；（2）頭夾肌起點的標準節數；（3）神經支配 C5–C6 的說法出處。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/splenius-capitis-muscle/24194\" rel=\"noopener nofollow\" target=\"_blank\">Elsevier 解剖資源\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/splenius-cervicis-muscle\" rel=\"noopener nofollow\" target=\"_blank\">Kenhub：頸夾肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Splenius_capitis_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Wikipedia：頭夾肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nielasher.com/blogs/exercises-and-stretches/forward-flexion-neck-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Niel Asher：前屈頸部伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nielasher.com/blogs/video-blog/stretching-for-pain-relief-and-rehabilitation-splenius-cervicis\" rel=\"noopener nofollow\" target=\"_blank\">Niel Asher：頸夾肌伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3435917/\" rel=\"noopener nofollow\" target=\"_blank\">PMC3435917\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=PB_AzgEOGWI\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=PB_AzgEOGWI\" target=\"_blank\">▶ https://www.youtube.com/watch?v=PB_AzgEOGWI\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=r0HxS0ymbt8\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=r0HxS0ymbt8\" target=\"_blank\">▶ https://www.youtube.com/watch?v=r0HxS0ymbt8\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://www.rehabmypatient.com/media/uploads/articles/Splenius-capitis-exercises-2.jpg\" alt=\"側頸屈曲伸展示意圖（Rehab My Patient，頭夾肌運動頁面）\">\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://www.rehabmypatient.com/media/uploads/articles/Splenius-capitis-exercises-1.jpg\" alt=\"彈力帶頸後伸示意圖（Rehab My Patient，頭夾肌運動頁面）\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理。補上解剖資料、四個伸展動作、四部已開啟的 YouTube 影片頁與兩張動作圖；標註來源間的不一致與未驗證處。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上頸夾肌起止點與神經支配（來源間有不一致處）、Cochrane 對單獨伸展證據較弱的結論；影片頻道與新增影片仍未解決。與先前結論不一致：先前引 PMC 回顧稱自我伸展可能短期減痛，Cochrane 則認為單獨伸展效果很小，目前判斷以 Cochrane 較強，並已列入待確認。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：首次整理解剖與四個伸展動作、影片、動作圖。；補頸夾肌起止點與 Cochrane 結論。與先前結論不一致：PMC 回顧稱自我伸展可能短期減痛，Cochrane 認為單獨伸展效果很小，以 Cochrane 較強。；重新開啟三部影片頁確認標題，合併去重；頻道仍未知，第四部影片本次未重開。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：重新搜尋確認起止點（T3–T6／C1–C3）與動作，重開第四部影片確認標題，補 LearnMuscles 伸展提示，合併重複內容；頻道仍未知，其他肌肉議題未在本頁處理。\u003c/li>\n\u003c/ul>"},{"id":"0186336e-868f-4e41-a2c8-a2b4bbef9e8f","parentId":null,"x":-417,"y":247,"collapsed":false,"status":"completed","title":"提肩胛肌","summary":"提肩胛肌起於 C1–C4 橫突後結節、止於肩胛骨內側緣上部，上提並下旋肩胛；伸展動作有教學資料，但單獨療效證據仍弱。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">提肩胛肌是頸側連到肩胛骨上角附近的帶狀肌，主要作用是上提肩胛並使肩胛盂朝下。伸展動作的做法在物理治療教材中很一致，但「停 30–60 秒」的療效，本次沒有查到可直接引用的單獨試驗，現有資料不足。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖\u003c/h3>\n\u003cp dir=\"auto\">想像你從背後看一個人低頭滑手機：頸子兩側各有一條斜線，從脖子往肩胛骨的內上角拉下來。那就是提肩胛肌。圖例見下（Wikipedia 收錄的「連接上肢與脊柱的肌肉」圖，提肩胛肌在右上頸側）：\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Levator_scapulae.png/1280px-Levator_scapulae.png\" alt=\"提肩胛肌位置示意：Levator scapulae.png，Wikimedia Commons，Gray's Anatomy 系列圖\">\u003c/p>\n\u003cp dir=\"auto\">來源頁：\u003ca href=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" target=\"_blank\">Wikipedia: Levator scapulae muscle\u003c/a>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>C1–C4 橫突後結節\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>肩胛骨內側緣上部（Radiopaedia 寫為肩胛骨上角，來源說法略有差異）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>作用\u003c/td>\n\u003ctd>上提肩胛骨，並使肩胛盂朝下（下旋）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>C3、C4 頸神經；常合併肩胛背神經（C5）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 dir=\"auto\">放大看一個細節：神經支配\u003c/h4>\n\u003cp dir=\"auto\">各來源對 C5 是否算在這條肌肉本身的支配上說法不同：StatPearls 的摘要寫 C3、C4 與肩胛背神經；另一處寫 C3、C4 與肩胛背神經（C5）。StatPearls 也提到神經支配缺如與起止點變異曾有個案報告，臨床意義不明。我只讀到搜尋摘要，沒能開啟 StatPearls 全文。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">本次只查到提肩胛肌這一塊；你要求的「每塊肌肉」，其他肌肉本次未研究。\u003c/p>\n\u003ch4 dir=\"auto\">動作一：坐姿、手放背後的提肩胛肌伸展\u003c/h4>\n\u003cp dir=\"auto\">坐在椅子上，欲伸展側的手伸到背後，另一手把頭往前、往對側斜拉，感覺從頭骨底部到肩胛骨處被拉長，然後停住（步驟來自 \u003ca href=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" target=\"_blank\">Physitrack\u003c/a>）。圖片：該頁沒有動作圖，只有商標，所以此動作的圖查不到；可參考上方解剖圖確認伸展位置。\u003cbr>\n影片（已開啟頁面，確認標題為「Levator Scapula Stretch」，頻道名稱頁面未明示，依標題推測為 Ask Doctor Jo；影片內容與長度我無法確認）：\u003cbr>\n\u003ca href=\"https://www.youtube.com/watch?v=GSoXPJRnR6E\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=GSoXPJRnR6E\" target=\"_blank\">▶ https://www.youtube.com/watch?v=GSoXPJRnR6E\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">動作二：靜態伸展\u003c/h4>\n\u003cp dir=\"auto\">標題為「How to do a Static Levator Scapulae Stretch」。搜尋摘要提到的提示是肩膀向後下沉、下巴微收、只伸到第一個緊繃點，但我只確認了標題，這些提示沒有在影片頁面獲得驗證。圖片：本次沒找到可靠的單獨動作圖。\u003cbr>\n\u003ca href=\"https://www.youtube.com/watch?v=U-rAhZajTLs\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=U-rAhZajTLs\" target=\"_blank\">▶ https://www.youtube.com/watch?v=U-rAhZajTLs\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">動作三：肌筋膜伸展加 PNF（收縮—放鬆）\u003c/h4>\n\u003cp dir=\"auto\">標題為「Levator Scapulae Myofascial Stretch and PNF Technique」。Human Kinetics 的輔助伸展節錄描述：對抗自己的阻力抬頭 6 秒，再於吐氣時加深伸展（出自搜尋摘要，未開啟全文）。圖片：未找到可引用的圖片。\u003cbr>\n\u003ca href=\"https://www.youtube.com/watch?v=t3SZI_80BZI\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=t3SZI_80BZI\" target=\"_blank\">▶ https://www.youtube.com/watch?v=t3SZI_80BZI\u003c/a>\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">三部影片我只確認頁面可開啟與標題，頁面內容被截斷，沒有確認動作細節、長度或講者資格。圖片部分，只有解剖圖有查證；三個伸展動作都沒有可靠的動作圖，不補假圖。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">證據與待確認\u003c/h3>\n\u003cp dir=\"auto\">現有筆記寫「坐姿伸展停 30–60 秒有小型試驗支持，但多為合併療法」，本次搜尋沒有找到該試驗，無法重新驗證，也無法確認 30–60 秒這個數字的出處。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">該小型試驗的出處與樣本數。\u003c/li>\n\u003cli dir=\"auto\">單獨伸展（不合併其他療法）對頸痛的效果。\u003c/li>\n\u003cli dir=\"auto\">肩胛背神經 C5 是否算入此肌本身的支配。\u003c/li>\n\u003cli dir=\"auto\">各伸展動作的可靠動作圖與實際影片內容。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>提肩胛肌位置圖（Levator scapulae）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Levator_scapulae_muscle\u003c/a>\u003cbr>\n用途：連接上肢與脊柱的肌肉圖，提肩胛肌位於右上頸側。\u003cbr>\n配色：white / red / gray\u003cbr>\n可套用公式：頸側斜線＋肩胛骨上內角＝提肩胛肌\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" target=\"_blank\">Wikipedia: Levator scapulae muscle\u003c/a>（起止點、神經、作用，已開啟）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/31971759/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/31971759/\" target=\"_blank\">StatPearls: Anatomy, Head and Neck, Levator Scapulae Muscles（PubMed）\u003c/a>（僅讀搜尋摘要）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" target=\"_blank\">Physitrack 坐姿提肩胛肌伸展\u003c/a>（已開啟）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://us.humankinetics.com/blogs/excerpt/levator-scapulae-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.humankinetics.com/blogs/excerpt/levator-scapulae-stretch\" target=\"_blank\">Human Kinetics 提肩胛肌伸展節錄\u003c/a>（僅搜尋摘要）\u003c/li>\n\u003cli dir=\"auto\">YouTube：\u003ca href=\"https://www.youtube.com/watch?v=GSoXPJRnR6E\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=GSoXPJRnR6E\" target=\"_blank\">GSoXPJRnR6E\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=U-rAhZajTLs\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=U-rAhZajTLs\" target=\"_blank\">U-rAhZajTLs\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=t3SZI_80BZI\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=t3SZI_80BZI\" target=\"_blank\">t3SZI_80BZI\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=RQZ2kEiKm3c\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=RQZ2kEiKm3c\" target=\"_blank\">▶ https://www.youtube.com/watch?v=RQZ2kEiKm3c\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://res.cloudinary.com/da1molee1/image/upload/c_fill,g_center,h_439,w_780/q_auto:eco/exercise-backpain-levatorscapulae.png?_a=BAAAV6H8\" alt=\"提肩胛肌伸展示意圖：Spine-health\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理，查了衛教與物理治療頁面，未取得可驗證的 YouTube 影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上起止點、神經支配與動作並附圖；神經根標示不一已列入待確認；仍未取得可驗證的 YouTube 影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上起止點、神經支配與動作並附圖；神經根標示不一已列入待確認。；依各伸展附影片：打開並嵌入兩部 YouTube 影片（Ott PT、PNF 技術），移除「無影片」舊說法；影片內容細節未核對。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：補入伸展療效的試驗證據（肌肉能量技術、停留 30–60 秒，皆依搜尋摘要）與其限制，並註明其他肌肉不在本議題範圍；影片維持前次已打開的兩部。\u003c/li>\n\u003c/ul>"},{"id":"e7b10223-e9a2-4366-8af0-b39cd8fc48ee","parentId":null,"x":-417,"y":458,"collapsed":false,"status":"completed","title":"菱形肌","summary":"菱形肌分大、小兩塊，經肩胛背神經支配、負責肩胛後縮；伸展影片已查到並開啟，但伸展圖片與療效試驗仍缺。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">菱形肌由小菱形肌與大菱形肌組成，都接在肩胛骨內緣，由肩胛背神經支配，主要動作是讓肩胛後縮並貼住胸壁。各來源對神經根節的標示不一（C4–C5 或 C5），伸展動作的療效仍沒有直接試驗。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">兩塊肌肉的解剖\u003c/h3>\n\u003cp dir=\"auto\">站在背後看，兩塊肌肉像一對斜向的帶子，從脊柱一路拉向肩胛骨內側緣。上方較細的是小菱形肌，下方較寬的是大菱形肌。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 864 176\" width=\"864\" height=\"176\" style=\"max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); - nchor=\"middle\">大菱形肌\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-279.07,-56)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下方較寬\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-307.05,0)\">\u003crect x=\"-77.74\" y=\"-24\" width=\"155.48\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">起點 T2–T5 棘突\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-313.24,56)\">\u003crect x=\"-83.92\" y=\"-24\" width=\"167.85\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛背神經（C5）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">菱形肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>小菱形肌\u003c/th>\n\u003cth>大菱形肌\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>項韌帶與 C7–T1 棘突\u003c/td>\n\u003ctd>T2–T5 棘突（含棘上韌帶）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>肩胛骨內緣，位置在大菱形肌止點之上\u003c/td>\n\u003ctd>肩胛骨內緣，約從肩胛棘水平到下角\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>肩胛背神經，多為 C5，部分來源加 C4 或 C6\u003c/td>\n\u003ctd>肩胛背神經（C5）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>肩胛後縮、固定於胸壁\u003c/td>\n\u003ctd>後縮、使關節盂朝下旋轉、固定於胸壁\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">放大看一個細節：神經根節的寫法。Kenhub 寫 C4–C5，Wikipedia 的大菱形肌條目寫 C5。這是來源間的差異，我沒有查到更權威的解剖學原典去裁決。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Rhomboideus_major.png/1280px-Rhomboideus_major.png\" alt=\"大菱形肌（紅色標示），Wikimedia Commons 圖片，「Muscles connecting the upper extremity to the vertebral column」\">\u003c/p>\n\u003cp dir=\"auto\">圖說：連接上肢與脊柱的肌肉，大菱形肌以紅色標示（Wikimedia Commons，檔名 Rhomboideus_major.png，取自 Gray's Anatomy 系列）。圖片網址由 Wikipedia 頁面的縮圖連結推得，我沒有另外開啟原檔。\u003c/p>\n\u003cp dir=\"auto\">臨床上，肩胛背神經受傷可造成菱形肌無力，出現翼狀肩胛（NCBI Bookshelf）。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">這一段說明我實際做到什麼：我用搜尋找到下列影片，並逐支開啟頁面。但頁面文字只讀到標題，有的讀不到頻道名，動作細節與保持時間我沒有看到，所以只能確認「影片存在、標題如下」，不能保證內容細節。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">沒有任何一個伸展動作找到可靠的示範圖片。我只找到解剖圖。下表「圖片」欄寫「查不到」，不補假圖。保持秒數、次數也沒有查到。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>伸展動作\u003c/th>\n\u003cth>影片（已開啟頁面）\u003c/th>\n\u003cth>圖片\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>手臂橫過胸前的菱形肌伸展\u003c/td>\n\u003ctd>Ask Doctor Jo「Rhomboid Stretch Across Arm」\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>長坐姿菱形肌伸展\u003c/td>\n\u003ctd>Ask Doctor Jo「Rhomboid Stretch in Long Sitting」\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上背與中斜方肌活動度伸展\u003c/td>\n\u003ctd>「Stretch upper back - rhomboid and middle trapezius mobility」（頻道未讀到）\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>胸椎屈曲訓練式伸展\u003c/td>\n\u003ctd>「How to Stretch Rhomboids Correctly (Thoracic Flexion Drill)」（頻道未讀到）\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=rXrTcTBbBrc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=rXrTcTBbBrc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=rXrTcTBbBrc\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=EX79wuWLcZc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=EX79wuWLcZc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=EX79wuWLcZc\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=FjdHsL7XFGY\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=FjdHsL7XFGY\" target=\"_blank\">▶ https://www.youtube.com/watch?v=FjdHsL7XFGY\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=4OnVN_qc_JQ\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=4OnVN_qc_JQ\" target=\"_blank\">▶ https://www.youtube.com/watch?v=4OnVN_qc_JQ\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">另外搜尋到「Thread the Needle」與嬰兒式屬於上背伸展，但搜尋結果沒有把它們歸為菱形肌專用，也沒有為它們找到已開啟的 YouTube 影片，所以不列為菱形肌伸展。\u003c/p>\n\u003ch3 dir=\"auto\">不確定處\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">伸展與肌力訓練對肩胛間痠痛的相對療效：沒有查到直接試驗。\u003c/li>\n\u003cli dir=\"auto\">四支影片的實際動作、保持時間與講者資歷：頁面只讀到標題，未能確認。\u003c/li>\n\u003cli dir=\"auto\">神經根節 C4–C5 與 C5 哪個較準確：來源不一致。\u003c/li>\n\u003cli dir=\"auto\">這些伸展究竟伸展到菱形肌多少：本次沒有肌電圖或影像證據。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>大菱形肌位置（紅色標示）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_major_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Rhomboid_major_muscle\u003c/a>\u003cbr>\n用途：連接上肢與脊柱的肌肉圖，大菱形肌以紅色標示。\u003cbr>\n配色：red / white / gray\u003cbr>\n可套用公式：解剖示意圖加紅色標示目標肌肉\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/30521277/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/30521277/\" target=\"_blank\">StatPearls：Anatomy, Back, Rhomboid Muscles（PubMed）\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK534856/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK534856/\" target=\"_blank\">NCBI Bookshelf NBK534856\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_major_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Rhomboid_major_muscle\" target=\"_blank\">Wikipedia：Rhomboid major muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_minor_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Rhomboid_minor_muscle\" target=\"_blank\">Wikipedia：Rhomboid minor muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/rhomboid-muscles\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/rhomboid-muscles\" target=\"_blank\">Kenhub：Rhomboid muscles\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://images.radiopaedia.org/articles/rhomboid-major?lang=us\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://images.radiopaedia.org/articles/rhomboid-major?lang=us\" target=\"_blank\">Radiopaedia：Rhomboid major\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=rXrTcTBbBrc\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=rXrTcTBbBrc\" target=\"_blank\">YouTube：Rhomboid Stretch Across Arm\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=EX79wuWLcZc\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=EX79wuWLcZc\" target=\"_blank\">YouTube：Rhomboid Stretch in Long Sitting\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=FjdHsL7XFGY\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=FjdHsL7XFGY\" target=\"_blank\">YouTube：Stretch upper back - rhomboid and middle trapezius mobility\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=4OnVN_qc_JQ\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=4OnVN_qc_JQ\" target=\"_blank\">YouTube：How to Stretch Rhomboids Correctly\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">Physiopedia 的 Rhomboids 頁面回傳 403，未能讀取。\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=0LamiLdn1V0\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=0LamiLdn1V0\" target=\"_blank\">▶ https://www.youtube.com/watch?v=0LamiLdn1V0\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=t6IvpE23bRQ\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=t6IvpE23bRQ\" target=\"_blank\">▶ https://www.youtube.com/watch?v=t6IvpE23bRQ\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Rhomboidei.PNG/1280px-Rhomboidei.PNG\" alt=\"菱形肌與連接上肢與脊柱的肌肉，Rhomboidei.PNG，維基共享資源\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整合。補上解剖、三個伸展動作與影片、限制與待確認事項。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上大、小菱形肌各自起止點與神經支配，新增提肩胛肌與兒童式側伸說明；兩者沒有找到 YouTube 影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：首次整合解剖、伸展與限制。；補大小菱形肌起止點與神經，新增提肩胛肌與兒童式側伸說明。；重新打開三部 YouTube 影片確認標題，精簡重複內容。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：搜尋療效證據，補上間接試驗與神經卡壓研究，合併重複來源；仍無直接比較伸展與肌力訓練的試驗，其他優先議題未處理。\u003c/li>\n\u003c/ul>"},{"id":"1cc3164f-bd45-45b8-9174-e371df460710","parentId":null,"x":791,"y":458,"collapsed":false,"status":"completed","title":"棘下肌","summary":"棘下肌是起於棘下窩、止於大結節中段、由肩胛上神經支配的肩外旋肌；橫胸伸展有對照證據，睡姿伸展有撞擊疑慮，痠痛療效無直接證據。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">棘下肌是旋轉袖四塊肌肉之一，主要做肩外旋並穩定肩關節。兩種常見伸展（睡姿、橫胸）都有影片可看，但「改善痠痛」目前沒有查到直接證據。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖\u003c/h3>\n\u003cp dir=\"auto\">站在解剖圖前看肩胛骨後方，棘下肌是填滿棘下窩的厚三角形肌肉。這是你標註的位置。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Infraspinatus.png/1280px-Infraspinatus.png\" alt=\"棘下肌示意圖（Engusz 上傳，2007，Wikimedia Commons，CC BY-SA 3.0）\">\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>肩胛骨棘下窩（有來源寫內側三分之二與棘下筋膜）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>肱骨大結節中段，並連到肩關節囊\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>肩外旋、穩定盂肱關節、把肱骨頭固定在關節盂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>肩胛上神經（C5、C6，源自臂神經叢上幹）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>血液\u003c/td>\n\u003ctd>肩胛上動脈、旋肩胛動脈\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">它常與小圓肌融合。協同肌是小圓肌與三角肌。止點比棘上肌大，旋轉袖撕裂的頻率與棘上肌相當。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 690 328\" width=\"690\" height=\" 45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">神經\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-255.25,0)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛上神經\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-4\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-5,#72b7b2)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,104 -93.81,104\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,104C-179.56,104 -179.56,76 -197.56,76\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,104C-179.56,104 -179.56,132 -197.56,132\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-127.69,104)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-5,#72b7b2)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-5,#72b7b2)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">血液\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-255.25,76)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-5,#72b7b2)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-5,#72b7b2)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛上動脈\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-255.25,132)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-5,#72b7b2)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-5,#72b7b2)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">旋肩胛動脈\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">棘下肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003ch4 dir=\"auto\">橫胸（交叉手臂）伸展\u003c/h4>\n\u003cp dir=\"auto\">做法：手臂在肩高橫過胸前，固定肩胛骨，軀幹不扭轉。HealthLinkBC 建議每次維持至少 15 到 30 秒，重複 2 到 4 次。\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">圖片：\u003ca href=\"https://library.theprehabguys.com/vimeo-video/standing-shoulder-cross-body-stretch-posterior-cuff-2/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://library.theprehabguys.com/vimeo-video/standing-shoulder-cross-body-stretch-posterior-cuff-2/\" target=\"_blank\">Prehab Guys 圖文示範\u003c/a>。我沒有取得可直接嵌入的圖檔網址，所以只附來源頁。\u003c/li>\n\u003cli dir=\"auto\">影片（已打開確認標題為「Cross Body Stretch - Beginner Shoulder IR and Posterior Capsule Stretch」；頻道名稱頁面未顯示，搜尋結果標示為 Dr. Jonathan Harned, PT, DPT）：\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=JhO7xUeKJTc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=JhO7xUeKJTc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=JhO7xUeKJTc\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">睡姿伸展\u003c/h4>\n\u003cp dir=\"auto\">側躺、肩胛骨固定，由內旋方向施力。Mike Reinold 自己不常用，理由是這個姿勢內旋時會讓旋轉袖與肱二頭肌腱在喙肩弓下受擠壓。他引用 JOSPT 研究，認為橫胸伸展比睡姿更好。\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">圖片：\u003ca href=\"https://mikereinold.com/the-correct-way-to-perform-the-sleeper-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://mikereinold.com/the-correct-way-to-perform-the-sleeper-stretch/\" target=\"_blank\">Reinold 文章頁\u003c/a>。圖檔網址未取得，只附來源頁。\u003c/li>\n\u003cli dir=\"auto\">影片（已打開確認標題為「The Correct Way to Perform the Sleeper Stretch」，頻道 Mike Reinold）：\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=fCVIDYlRnDw\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=fCVIDYlRnDw\" target=\"_blank\">▶ https://www.youtube.com/watch?v=fCVIDYlRnDw\u003c/a>\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">一項針對無症狀成人的隨機試驗發現，單做橫胸伸展，或加上後關節囊鬆動術，內旋角度都沒有顯著改變。作者仍認為對內旋受限者可能有益。這項證據不能直接套用到有症狀的人，也不能說明痠痛能否改善。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">橫胸伸展與睡姿伸展的 JOSPT 原研究，我只透過 Reinold 的轉述得知，尚未讀原文。\u003c/li>\n\u003cli dir=\"auto\">兩部影片我只確認了標題，沒有逐秒檢查動作細節。\u003c/li>\n\u003cli dir=\"auto\">其他肩部肌肉（小圓肌、棘上肌、肩胛下肌等）的伸展，這次沒有研究。「每塊肌肉」的需求只完成棘下肌。\u003c/li>\n\u003cli dir=\"auto\">兩種伸展針對的是棘下肌、小圓肌或後關節囊，來源說法不一。Healthline 稱睡姿伸展針對棘下肌與小圓肌，影片標題則強調後關節囊。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>棘下肌解剖圖\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://commons.wikimedia.org/wiki/File:Infraspinatus.png\u003c/a>\u003cbr>\n用途：Engusz 上傳（2007），Wikimedia Commons，標示棘下肌位置。\u003cbr>\n配色：gray / red\u003cbr>\n可套用公式：解剖標示圖加肌肉紅色強調\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK513255/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK513255/\" target=\"_blank\">StatPearls 棘下肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.com/wiki/Infraspinatus\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.com/wiki/Infraspinatus\" target=\"_blank\">Wikipedia 棘下肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" target=\"_blank\">Wikimedia Commons 圖檔\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://mikereinold.com/the-correct-way-to-perform-the-sleeper-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://mikereinold.com/the-correct-way-to-perform-the-sleeper-stretch/\" target=\"_blank\">Reinold：睡姿伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/sleeper-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/sleeper-stretch\" target=\"_blank\">Healthline 睡姿伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthlinkbc.ca/healthwise/posterior-stretching-exercise-shoulder\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthlinkbc.ca/healthwise/posterior-stretching-exercise-shoulder\" target=\"_blank\">HealthLinkBC 後側伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3445079\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3445079\" target=\"_blank\">橫胸伸展隨機試驗（PMC3445079）\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=xGS4fxnYtXA\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=xGS4fxnYtXA\" target=\"_blank\">▶ https://www.youtube.com/watch?v=xGS4fxnYtXA\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=CPhX9Sp9eHI\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=CPhX9Sp9eHI\" target=\"_blank\">▶ https://www.youtube.com/watch?v=CPhX9Sp9eHI\u003c/a>\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。補入解剖資料、兩種主要伸展與三部影片；影片內容與動作圖片仍待核實。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入 McClure 2007 具體數據、停留時間慣例與較新試驗；刪除重複的圖片備註；仍待核實影片內容與痠痛療效。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：重新讀取三個影片頁；與先前結論不一致：第二部標題為「Infraspinatus Stretch」，非先前所稱的睡姿示範；並說明無法播放影片，影片內容仍待核實。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：打開 Reinold 睡姿伸展影片頁並補入三個做法重點；與先前結論不一致：xGS4fxnYtXA 為通用棘下肌伸展而非睡姿；移除未重新開啟的 CPhX9Sp9eHI；其他肌肉議題未處理。\u003c/li>\n\u003c/ul>"},{"id":"e3cafd1e-f493-4b09-93fc-d6002971c3ca","parentId":null,"x":791,"y":669,"collapsed":false,"status":"completed","title":"背闊肌","summary":"背闊肌起於下胸椎、腰背筋膜、髂嵴與下位肋骨，止於肱骨結節間溝，受胸背神經支配；伸展以舒適為限，專屬療效與停留時間證據不足。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">背闊肌是跨越背、骨盆與上臂的大塊淺層肌，各來源的起點細節略有出入，止點與神經支配一致。伸展動作的停留時間（約 15–30 秒）主要來自一般靜態伸展研究，沒有找到背闊肌專屬的劑量證據。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖\u003c/h3>\n\u003cp dir=\"auto\">想像你站在解剖圖前，從腰側往上看：一片寬扇形肌肉從骨盆邊緣鋪開，往腋下收束，最後鑽到手臂骨頭的前側。這就是背闊肌。\u003c/p>\n\u003cp dir=\"auto\">放大看的細節是\u003cmark>起點的說法不一\u003c/mark>。University of Washington 肌肉圖譜寫的是下 6 節胸椎棘突、腰背筋膜、髂嵴與下 3–4 條肋骨；Radiopaedia 則寫 T7–T12 棘突、髂嵴後 1/3、第 9–12 肋，並加上肩胛下角。所以「下胸椎、腰背筋膜、髂嵴」是共通部分，肋骨與肩胛下角是部分來源才有的補充。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 926 308\" width=\"926\" height=\"308\" style=\"max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8
