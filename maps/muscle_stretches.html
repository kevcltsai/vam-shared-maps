 fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">直頭：髂前下棘\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(279.07,28)\">\u003crect x=\"-81.5\" y=\"-24\" width=\"163\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">反折頭：髖臼上緣\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,-66 -93.81,-66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,-66C-179.56,-66 -179.56,-94 -197.56,-94\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,-66C-179.56,-66 -179.56,-38 -197.56,-38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-127.69,-66)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">止點\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-287,-94)\">\u003crect x=\"-89.44\" y=\"-24\" width=\"178.88\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髕骨底／股四頭肌腱\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-287,-38)\">\u003crect x=\"-89.44\" y=\"-24\" width=\"178.88\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">經髕韌帶至脛骨粗隆\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,66 -93.81,66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,38 -197.56,38\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,94 -197.56,94\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-127.69,66)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">動作\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-231.44,38)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">屈髖\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-231.44,94)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">伸膝\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">股直肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">臨床上，運動員的髂前下棘撕脫性骨折與股直肌拉力有關（\u003ca href=\"https://Www.wikipedia.org/wiki/Rectus_femoris\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://Www.wikipedia.org/wiki/Rectus_femoris\" target=\"_blank\">Wikipedia\u003c/a>）。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003ch4 dir=\"auto\">沙發伸展（couch stretch）\u003c/h4>\n\u003cp dir=\"auto\">後腳靠在沙發或牆上、膝彎曲，前腳跨步呈半跪，骨盆保持內收再往前移（\u003ca href=\"https://library.theprehabguys.com/vimeo-tag/rectus-femoris/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://library.theprehabguys.com/vimeo-tag/rectus-femoris/\" target=\"_blank\">Prehab Guys\u003c/a>、\u003ca href=\"https://www.wellandgood.com/?p=390168\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.wellandgood.com/?p=390168\" target=\"_blank\">Well+Good\u003c/a>）。Precision Movement 稱它是經典的股直肌伸展，但提醒不宜只靠被動靜態伸展，並認為過度被動伸展可能與腿後肌拉傷有關（\u003ca href=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" target=\"_blank\">來源\u003c/a>，這是該文作者的看法，我未找到對照研究）。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://www.precisionmovement.coach/wp-content/uploads/2018/05/rectus-femoris-stretch-couch-stretch.jpg\" alt=\"沙發伸展，Precision Movement Coach 網站，2018 年上傳\">\u003c/p>\n\u003cp dir=\"auto\">影片（已開啟頁面，確認標題為「Fix Your Squat - Couch Stretch (quads, rectus femoris, hip flexor)」；頻道與內容細節因頁面截斷未能確認）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=4KJrM6-5T38\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=4KJrM6-5T38\" target=\"_blank\">▶ https://www.youtube.com/watch?v=4KJrM6-5T38\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">半跪＋骨盆後傾\u003c/h4>\n\u003cp dir=\"auto\">跪姿從後傾開始，夾臀、收尾骨，再微微前移。2024 年 BMC Musculoskeletal Disorders 的研究指出，半跪髖伸展加上骨盆後傾，比傳統版本更能降低髖屈肌的反應力（\u003ca href=\"https://link.springer.com/article/10.1186/s12891-024-07988-9\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://link.springer.com/article/10.1186/s12891-024-07988-9\" target=\"_blank\">BMC\u003c/a>）。Mike Reinold 的版本強調後傾而非腰椎伸展，但他的版本為膝伸直、針對腰大肌，並非股直肌，若要針對股直肌需再加後腳屈膝（\u003ca href=\"https://mikereinold.com/true-hip-flexor-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://mikereinold.com/true-hip-flexor-stretch/\" target=\"_blank\">Reinold\u003c/a>）。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 164 256\" width=\"164\" height=\"256\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M81.56,56L81.56,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M81.56,104L78.2,96L84.92,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M81.56,152L81.56,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M81.56,200L78.2,192L84.92,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,32)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">跪姿從後傾開始\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,128)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">夾臀、收尾骨\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,224)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">再微微前移\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">這一動作我沒有找到可驗證的獨立圖片；Precision Movement 的半跪貼牆動作圖如下（為「端點activation」變化版，非單純伸展）：\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.giphy.com/media/oFRn6jAuoVSLXqzzbL/giphy.gif\" alt=\"半跪股直肌 ERA 序列，Precision Movement Coach，GIF\">\u003c/p>\n\u003cp dir=\"auto\">影片（已開啟，標題為「How to Stretch Your Quads Must include pelvic tilt」；頻道、具體做法因頁面截斷未能確認）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=Pk_2ZrX5pxk\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=Pk_2ZrX5pxk\" target=\"_blank\">▶ https://www.youtube.com/watch?v=Pk_2ZrX5pxk\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">仰臥股直肌伸展（Thomas 姿勢）\u003c/h4>\n\u003cp dir=\"auto\">PT 常用此姿勢評估髖屈肌與股直肌柔軟度，搜尋摘要提及 2–4 次、每次 15–30 秒（出自影片摘要，未能核對原影片）。\u003c/p>\n\u003cp dir=\"auto\">圖片：未找到可靠圖片。\u003c/p>\n\u003cp dir=\"auto\">影片（已開啟，標題為「Rectus Femoris Stretch (Supine)」；內容細節未能確認）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=Ctt9hmS66lk\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=Ctt9hmS66lk\" target=\"_blank\">▶ https://www.youtube.com/watch?v=Ctt9hmS66lk\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">俯臥股直肌伸展\u003c/h4>\n\u003cp dir=\"auto\">臨床試驗紀錄描述：治療師將膝彎曲至張力點，做短暫等長收縮，再於終點維持約 30 秒（\u003ca href=\"https://clinicaltrials.gov/study/NCT04344691\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://clinicaltrials.gov/study/NCT04344691\" target=\"_blank\">ClinicalTrials.gov\u003c/a>）。\u003c/p>\n\u003cp dir=\"auto\">圖片：未找到可靠圖片。\u003c/p>\n\u003cp dir=\"auto\">影片（已開啟，標題為「Flexibility Exercise for ACL: Prone Rectus Femoris」；內容細節未能確認）：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=ekfcGguCcy8\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=ekfcGguCcy8\" target=\"_blank\">▶ https://www.youtube.com/watch?v=ekfcGguCcy8\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">BJJ 股四頭肌伸展\u003c/h4>\n\u003cp dir=\"auto\">坐姿橋式，把髖推向伸展，用臀肌帶動通過股四頭肌伸展，每側 6–10 次（\u003ca href=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" target=\"_blank\">Precision Movement\u003c/a>）。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.giphy.com/media/tIiEgYYTRtdFKbY1Ft/giphy.gif\" alt=\"BJJ 股四頭肌伸展，Precision Movement Coach，GIF\">\u003c/p>\n\u003cp dir=\"auto\">影片：未找到對應此動作且已開啟驗證的 YouTube 影片。\u003c/p>\n\u003ch3 dir=\"auto\">限制與待確認\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">我開啟的 YouTube 頁面只讀得到標題，看不到頻道、說明或逐字稿，所以無法確認影片動作是否符合上述文字描述。使用前請自行觀看。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">現有資料不足：沒有找到比較各種伸展動作對股直肌拉伸程度的研究；「沙發伸展」與「過度被動伸展增加腿後肌拉傷」的說法只有單一教練網站來源；止點寫法的差異也未查出原因。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>沙發伸展（couch stretch）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.precisionmovement.coach/rectus-femoris-stretch\u003c/a>\u003cbr>\n用途：Precision Movement Coach 文章中的沙發伸展示範圖。\u003cbr>\n配色：white / gray\u003cbr>\n可套用公式：後腳屈膝靠牆＋髖伸直＋骨盆後傾\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://radiopaedia.org/articles/44281\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://radiopaedia.org/articles/44281\" target=\"_blank\">Radiopaedia：Rectus femoris muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://Www.wikipedia.org/wiki/Rectus_femoris\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://Www.wikipedia.org/wiki/Rectus_femoris\" target=\"_blank\">Wikipedia：Rectus femoris muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/rectus-femoris-muscle/17868\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/rectus-femoris-muscle/17868\" target=\"_blank\">Elsevier 解剖資源\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://rad.washington.edu/muscle-atlas/rectus-femoris\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://rad.washington.edu/muscle-atlas/rectus-femoris\" target=\"_blank\">UW 肌肉圖譜\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://link.springer.com/article/10.1186/s12891-024-07988-9\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://link.springer.com/article/10.1186/s12891-024-07988-9\" target=\"_blank\">BMC Musculoskelet Disord 2024\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.precisionmovement.coach/rectus-femoris-stretch\" target=\"_blank\">Precision Movement：股直肌伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://mikereinold.com/true-hip-flexor-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://mikereinold.com/true-hip-flexor-stretch/\" target=\"_blank\">Mike Reinold：True Hip Flexor Stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://clinicaltrials.gov/study/NCT04344691\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://clinicaltrials.gov/study/NCT04344691\" target=\"_blank\">ClinicalTrials.gov NCT04344691\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=9jAdDN88y10\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=9jAdDN88y10\" target=\"_blank\">▶ https://www.youtube.com/watch?v=9jAdDN88y10\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Rectus_femoris.png/1280px-Rectus_femoris.png\" alt=\"股直肌所在的髂部與大腿前側肌群插圖\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-25：首次建立。補入解剖、伸展做法、一支影片與一張圖；影片內容未能驗證。\u003c/li>\n\u003c/ul>"},{"id":"533e4185-b2c8-4d02-bdbd-9eb6bb20ddcb","parentId":null,"x":2308,"y":306,"collapsed":false,"status":"completed","title":"闊筋膜張肌","summary":"闊筋膜張肌起於髂前上棘與髂嵴前段，經髂脛束止於脛骨外側，臀上神經支配；牽拉以髖內收、伸展為主，各伸展動作的專屬圖片仍查無。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">闊筋膜張肌（TFL）是一塊小肌肉，不直接附著在骨頭上，而是把力量送進髂脛束。各來源對起點與神經的說法一致，對脛骨上的終點與神經節段略有出入。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">打開 Gray 解剖圖（Gray430），在骨盆外側會看到一條細長的肌腹，從髖骨前緣斜向下，消失在大腿外側一條白色的筋膜帶裡。這一章要回答的是：這塊肌肉從哪裡來、往哪裡去，以及要怎麼拉到它。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Gray430_with_TensorFasciaLata-en.svg/330px-Gray430_with_TensorFasciaLata-en.svg.png\" alt=\"闊筋膜張肌與鄰近肌肉（Gray430 加註版，Wikimedia Commons，來自 Gray's Anatomy）\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>闊筋膜張肌與鄰近肌肉\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Tensor_fasciae_latae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Tensor_fasciae_latae_muscle\u003c/a>\u003cbr>\n用途：Gray's Anatomy 骨盆與大腿肌肉圖，標出闊筋膜張肌位置。\u003cbr>\n配色：white / red / gray\u003cbr>\n可套用公式：解剖線圖加單一肌肉標色\u003c/p>\n\u003ch3 dir=\"auto\">解剖構造\u003c/h3>\n\u003cp dir=\"auto\">放大看一個細節：終點。Wikipedia 寫它進入髂脛束兩層之間，位置在大腿中、上三分之一交界附近，最終抵達脛骨外側髁。Elsevier 解剖資源則把脛骨上的附著點寫成 Gerdy 結節。兩種說法在來源間並存，本頁不判定何者較準。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 478 370\" width=\"478\" height=\"370\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M242.4,74L242.4,115\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M242.4,122L239.04,114L245.76,114Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M242.4,170L242.4,211\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M242.4,218L239.04,210L245.76,210Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M220.84,266C220.84,283.5 116.95,283.5 116.95,301L116.95,307\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M116.95,314L113.59,306L120.31,306Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M263.97,266C263.97,283.5 367.85,283.5 367.85,301L367.85,307\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M367.85,314L364.49,306L371.21,306Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(242.4,41)\">\u003crect x=\"-113.25\" y=\"-33\" width=\"226.51\" height=\"66\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" text-anchor=\"middle\" xml:space=\"preserve\">\u003ctspan x=\"0\" y=\"-4.9\">起點：髂前上棘、髂嵴外唇\u003c/tspan>\u003ctspan x=\"0\" y=\"16.1\">前 1/3\u003c/tspan>\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(242.4,146)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">闊筋膜張肌\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(242.4,242)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髂脛束兩層之間\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(116.95,338)\">\u003crect x=\"-108.95\" y=\"-24\" width=\"217.91\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">脛骨外側髁（Wikipedia）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(367.85,338)\">\u003crect x=\"-101.94\" y=\"-24\" width=\"203.88\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">Gerdy 結節（Elsevier）\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003cth>來源差異\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>髂前上棘、髂嵴外唇前 1/3、鄰近闊筋膜深面\u003c/td>\n\u003ctd>來源一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>經髂脛束至脛骨外側\u003c/td>\n\u003ctd>外側髁或 Gerdy 結節，說法不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>臀上神經\u003c/td>\n\u003ctd>內文寫 L5、S1，資訊框寫 L4、L5、S1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>血管\u003c/td>\n\u003ctd>臀上動脈，另有旋股外側動脈升支參與\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>作用\u003c/td>\n\u003ctd>髖外展為主，輔助內旋與屈曲，繃緊髂脛束\u003c/td>\n\u003ctd>膝部作用在膝屈曲超過 30 度才出現\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">一個細節：Wikipedia 提醒，靠牆交叉腿的站姿伸展時，要避免腰椎側彎，否則拉到的是下背，不是這塊肌肉。基本原理是讓膝蓋往身體中線內收。NWHSU 診所講義建議每次維持 30 秒、重複 4 到 6 次、每日一次；PMC 的一張表列出仰臥髖屈肌伸展，每次 10 到 15 秒，做 3 到 5 次，每日 2 到 3 次。\u003c/p>\n\u003cp dir=\"auto\">FitnessVolt 列出十種動作，停留 30 到 60 秒，但這是品質較低的健身網站，僅供動作名稱參考：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>動作\u003c/th>\n\u003cth>做法摘要\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>站姿交叉腿\u003c/td>\n\u003ctd>一腿交叉在後，髖部推向後腿側\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>鐵十字\u003c/td>\n\u003ctd>仰臥、雙臂側平舉，一腿越過身體\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>坐姿半脊椎扭轉\u003c/td>\n\u003ctd>彎膝跨過伸直腿，往彎膝側扭轉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仰臥外展肌伸展\u003c/td>\n\u003ctd>一腿屈 90 度，往對側放下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>側臥懸腿\u003c/td>\n\u003ctd>側臥長椅，上方腿垂到邊緣外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>靠牆側推\u003c/td>\n\u003ctd>站在牆邊，重心推向外側髖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>髖部繞圈\u003c/td>\n\u003ctd>手扠腰，3 組、每方向 10 次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>四足跪姿主動伸展\u003c/td>\n\u003ctd>一腿後伸、腳尖外轉約 45 度後內收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>泡沫軸\u003c/td>\n\u003ctd>側臥，軸放在髂嵴與大轉子之間，每側 2 到 3 次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>單腳站立側傾\u003c/td>\n\u003ctd>單腳站，抓起另一腳，往抬腿側傾\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 dir=\"auto\">影片\u003c/h4>\n\u003cp dir=\"auto\">以下兩部影片的頁面我實際打開過，但擷取到的內容只有標題與頁尾，沒有看到動作演示，因此無法確認它示範的細節。其餘影片只出現在搜尋結果，未打開，不列入。\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">「3 Unique Tensor Fasciae Latae (TFL) Stretches」\u003cbr>\n\u003ca href=\"https://www.youtube.com/watch?v=RQscqJLyTZY\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=RQscqJLyTZY\" target=\"_blank\">▶ https://www.youtube.com/watch?v=RQscqJLyTZY\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">「TFL Stretch For Hip Pain Relief (Quick &amp; Effective!)」（站姿，依標題與搜尋摘要判斷）\u003cbr>\n\u003ca href=\"https://www.youtube.com/watch?v=2BX4scLVIxY\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=2BX4scLVIxY\" target=\"_blank\">▶ https://www.youtube.com/watch?v=2BX4scLVIxY\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">目前查不到每個伸展動作各自的合授權圖片，也沒有為每個動作逐一對應的影片。FitnessVolt 頁面只有一張標頭圖，沒有逐動作圖片；上述兩部影片的內容也未能看過。這部分現有資料不足。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">CU Anschutz 的文章指出，髂脛束是結締組織，柔軟度幾乎不會改善，建議改為處理 TFL 本身，例如用泡沫軸或按摩球壓 30 秒，最多重複五次。Human Kinetics 摘錄則說，手臂過頭的側彎姿勢最能增加髂脛束長度，這是針對髂脛束的結論，不等於針對 TFL。\u003c/p>\n\u003cp dir=\"auto\">你原本寫的「髖伸直、內收並避免外展」與 Wikipedia 的內收原理一致；「髖伸直」在我查到的來源中只有屈髖伸展（髖屈肌）的間接支持，未見直接說明。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003col>\n\u003cli dir=\"auto\">脛骨終點是外側髁還是 Gerdy 結節？\u003c/li>\n\u003cli dir=\"auto\">臀上神經節段究竟是 L4–S1 還是 L5–S1？\u003c/li>\n\u003cli dir=\"auto\">哪些影片真正示範了上列動作？需要逐部看完。\u003c/li>\n\u003c/ol>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Tensor_fasciae_latae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Tensor_fasciae_latae_muscle\" target=\"_blank\">Wikipedia：Tensor fasciae latae muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/tensor-fasciae-latae/22392\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/tensor-fasciae-latae/22392\" target=\"_blank\">Elsevier 解剖資源\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK499870/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK499870/\" target=\"_blank\">StatPearls（NCBI）\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.lumen.luc.edu/lumen/meded/grossanatomy/dissector/mml/tfl.htm\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.lumen.luc.edu/lumen/meded/grossanatomy/dissector/mml/tfl.htm\" target=\"_blank\">Loyola Lumen：TFL\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nwhealth.edu/wp-content/uploads/2019/04/NWHSU-clinic-stretching-handouts-TFL.pdf\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nwhealth.edu/wp-content/uploads/2019/04/NWHSU-clinic-stretching-handouts-TFL.pdf\" target=\"_blank\">NWHSU TFL 伸展講義\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3961060/table/T3\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3961060/table/T3\" target=\"_blank\">PMC 表格\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://medschool.cuanschutz.edu/fitness/blog/blog-article/blogs-show-some-tlc-to-your-tfl--tensor-fasciae-latae-\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://medschool.cuanschutz.edu/fitness/blog/blog-article/blogs-show-some-tlc-to-your-tfl--tensor-fasciae-latae-\" target=\"_blank\">CU Anschutz：Show Some TLC to Your TFL\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://us.humankinetics.com/blogs/excerpt/stretching-the-tensor-fasciae-latae-and-the-iliotibial-band\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.humankinetics.com/blogs/excerpt/stretching-the-tensor-fasciae-latae-and-the-iliotibial-band\" target=\"_blank\">Human Kinetics 摘錄\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://fitnessvolt.com/tensor-fasciae-latae-stretches/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://fitnessvolt.com/tensor-fasciae-latae-stretches/\" target=\"_blank\">FitnessVolt\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=RQscqJLyTZY\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=RQscqJLyTZY\" target=\"_blank\">YouTube RQscqJLyTZY\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=2BX4scLVIxY\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=2BX4scLVIxY\" target=\"_blank\">YouTube 2BX4scLVIxY\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Gray430_with_TensorFasciaLata-en.svg/330px-Gray430_with_TensorFasciaLata-en.svg.png\" alt=\"闊筋膜張肌與鄰近肌肉（Gray430 圖，Gray's Anatomy 1918，經 Wikimedia Commons 重製）\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-25：首次建立。整合解剖、三種牽拉做法、一部影片與一張圖；標註各來源對旋轉作用與止點的差異。\u003c/li>\n\u003c/ul>"},{"id":"c8a45afa-a336-447c-bb89-c5c47d48c8e7","parentId":null,"x":1207,"y":306,"collapsed":false,"status":"completed","title":"髂腰肌","summary":"髂腰肌由腰大肌與髂肌合成，止於小轉子，是最強的屈髖肌；半跪姿加骨盆後傾是常見伸展，已確認三支影片可開，圖片僅有解剖圖。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">髂腰肌是腰大肌與髂肌共用一條肌腱、止於股骨小轉子的屈髖肌群。伸展時，骨盆後傾加上臀肌收縮，比單純把髖往前推更能針對腰大肌（Reinold 的說法，屬單一來源的臨床建議）。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">本次要求「每塊肌肉、每個伸展動作都附一張圖片與一部打開過的影片」，我只做到一部分。伸展動作的示範圖我沒有找到可確認的真實圖片網址，所以下面的伸展動作沒有附圖。影片有三支，我用 WebFetch 打開過，只確認得到標題，看不到頻道名稱與內容。\u003c/p>\n\u003ch3 dir=\"auto\">解剖：三塊肌肉\u003c/h3>\n\u003cp dir=\"auto\">先看這塊肌肉的樣子：腰大肌從脊柱側面往下，髂肌從骨盆內側的髂窩往上，兩者在腹股溝韌帶深處會合，經由一條堅韌的肌腱接到大腿骨內側的小轉子。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Gerrish%27s_Text-book_of_Anatomy_%281902%29_-_Fig._346.png/1280px-Gerrish%27s_Text-book_of_Anatomy_%281902%29_-_Fig._346.png\" alt=\"腰大肌附著點，Gerrish's Text-book of Anatomy，1902，維基共享資源\">\u003c/p>\n\u003cp dir=\"auto\">\u003cem>圖：腰大肌的起止點。《Gerrish's Text-book of Anatomy》Fig. 346，1902，收錄於維基共享資源。\u003c/em>\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>腰大肌的起止點\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Iliopsoas\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Iliopsoas\u003c/a>\u003cbr>\n用途：Gerrish's Text-book of Anatomy（1902）Fig. 346，顯示腰大肌的起點與附著。網址是從維基縮圖路徑推得，我沒有直接打開原圖確認。\u003cbr>\n配色：white / gray\u003cbr>\n可套用公式：解剖圖：腰大肌從腰椎到小轉子\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>肌肉\u003c/th>\n\u003cth>起點\u003c/th>\n\u003cth>止點\u003c/th>\n\u003cth>神經\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>腰大肌\u003c/td>\n\u003ctd>T12、L1–L3 椎體外側面與椎間盤\u003c/td>\n\u003ctd>股骨小轉子\u003c/td>\n\u003ctd>腰神經叢前支，L1–L3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>髂肌\u003c/td>\n\u003ctd>髂窩\u003c/td>\n\u003ctd>與腰大肌共用肌腱，止於小轉子\u003c/td>\n\u003ctd>股神經，L2–L4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>腰小肌\u003c/td>\n\u003ctd>現有資料不足\u003c/td>\n\u003ctd>現有資料不足\u003c/td>\n\u003ctd>現有資料不足\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">以上依據維基百科的 \u003ca href=\"https://en.wikipedia.org/wiki/Iliopsoas\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Iliopsoas\" target=\"_blank\">Iliopsoas\u003c/a> 條目。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">各來源的範圍不一致。\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK531508/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK531508/\" target=\"_blank\">StatPearls\u003c/a> 的整理指出，Elsevier 把腰大肌起點寫到 T12–L5，髂肌起點寫成髂嵴與髂窩上三分之二，股神經為 L2–L3。要用在考試或臨床時，請查 Gray's 或 Thieme 等現行教科書。StatPearls 另引一項研究，在單側病例中約 26% 有雙分叉的髂腰肌腱。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003ch4 dir=\"auto\">半跪姿伸展（骨盆後傾版）\u003c/h4>\n\u003cp dir=\"auto\">Reinold 在〈\u003ca href=\"https://mikereinold.com/true-hip-flexor-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://mikereinold.com/true-hip-flexor-stretch/\" target=\"_blank\">The True Hip Flexor Stretch\u003c/a>〉裡拆成四個步驟：半跪，欲伸展側的膝蓋著地；夾緊臀肌，讓尾骨往下，做出骨盆後傾；雙手壓前膝，幫腹肌維持這個姿勢；需要更多伸展時，身體只往前傾約 2–3 英寸，並避免腰椎過度反弓。放大看這一個細節：他把重點從「髖伸展」換成「骨盆後傾」。這篇文章提到有影片，但我拿到的頁面沒有內嵌影片的網址，所以找不到他的影片。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 243 502\" width=\"243\" height=\"502\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, hape-rect\" transform=\"translate(121.25,137)\">\u003crect x=\"-113.25\" y=\"-33\" width=\"226.51\" height=\"66\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" text-anchor=\"middle\" xml:space=\"preserve\">\u003ctspan x=\"0\" y=\"-4.9\">夾緊臀肌，尾骨往下，骨盆\u003c/tspan>\u003ctspan x=\"0\" y=\"16.1\">後傾\u003c/tspan>\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,251)\">\u003crect x=\"-113.25\" y=\"-33\" width=\"226.51\" height=\"66\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" text-anchor=\"middle\" xml:space=\"preserve\">\u003ctspan x=\"0\" y=\"-4.9\">雙手壓前膝，幫腹肌維持姿\u003c/tspan>\u003ctspan x=\"0\" y=\"16.1\">勢\u003c/tspan>\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,365)\">\u003crect x=\"-113.25\" y=\"-33\" width=\"226.51\" height=\"66\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" text-anchor=\"middle\" xml:space=\"preserve\">\u003ctspan x=\"0\" y=\"-4.9\">需要更多伸展時，身體只往\u003c/tspan>\u003ctspan x=\"0\" y=\"16.1\">前傾約 2–3 英寸\u003c/tspan>\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,470)\">\u003crect x=\"-81.5\" y=\"-24\" width=\"163\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">避免腰椎過度反弓\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">這個伸展動作我沒有取得可確認的圖片網址。\u003c/p>\n\u003cp dir=\"auto\">以下兩支影片我打開過，確認標題存在，頻道與內容沒有看到：\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=KiTGo4L4Bgg\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=KiTGo4L4Bgg\" target=\"_blank\">▶ https://www.youtube.com/watch?v=KiTGo4L4Bgg\u003c/a>\u003cbr>\n標題為「Half Kneeling Hip Flexor Stretch with Posterior Pelvic Tilt」。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=1KBNyAVARzc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=1KBNyAVARzc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=1KBNyAVARzc\u003c/a>\u003cbr>\n標題為「Hip - Psoas Stretching in Half Kneeling (beginner)」。\u003c/p>\n\u003cp dir=\"auto\">一般的衛教建議可參考 \u003ca href=\"https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.hip-flexor-stretch-kneeling.hw208017\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.hip-flexor-stretch-kneeling.hw208017\" target=\"_blank\">Kaiser Permanente\u003c/a>：每次至少停留 15–30 秒，重複 2–4 次。膝蓋不舒服時，\u003ca href=\"https://www.nyp.org/healthlibrary/symptoms/document/hw208017\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nyp.org/healthlibrary/symptoms/document/hw208017\" target=\"_blank\">NYP\u003c/a> 建議墊毛巾。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">TODAY 引述 APTA 發言人的說法，標準的半跪姿伸展只伸到髖關節處的部分，並提出三段式變化。我沒有讀到完整內容，是否真能伸到整條肌肉，現有資料不足。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch4 dir=\"auto\">後腳抓踝版（加股四頭肌）\u003c/h4>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.physitrack.com/exercise-library/how-to-perform-the-kneeling-hip-flexor-stretch-exercise\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physitrack.com/exercise-library/how-to-perform-the-kneeling-hip-flexor-stretch-exercise\" target=\"_blank\">Physitrack\u003c/a> 的做法是半跪，抓住後腳腳踝，骨盆維持中立，把腳踝拉向臀部，直到大腿與髖前側有伸展感。這個版本會加入股四頭肌（Reinold 提醒膝蓋彎曲會讓股四頭肌介入），不只是髂腰肌。這個動作沒有取得可驗證的圖片與影片。\u003c/p>\n\u003ch4 dir=\"auto\">Thomas test 姿勢\u003c/h4>\n\u003cp dir=\"auto\">仰躺在床緣，把非測試側的膝蓋抱向胸口，看測試側的大腿能不能平放。\u003ca href=\"https://www.wikipedia.org/wiki/Thomas_test\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.wikipedia.org/wiki/Thomas_test\" target=\"_blank\">維基百科\u003c/a>寫的是髖屈曲攣縮與腰大肌問題的檢查；\u003ca href=\"https://www.physiotutors.com/wiki/thomas-test/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physiotutors.com/wiki/thomas-test/\" target=\"_blank\">Physiotutors\u003c/a> 指出，髂腰肌縮短無法只靠目測或量角器可靠判斷。它主要是評估，不是首選的伸展，但 \u003ca href=\"https://www.physitrack.com/exercise-library/how-to-perform-thomas-test-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physitrack.com/exercise-library/how-to-perform-thomas-test-stretch\" target=\"_blank\">Physitrack\u003c/a> 也把這個姿勢當伸展教。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=NMDd-4NspHs\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=NMDd-4NspHs\" target=\"_blank\">▶ https://www.youtube.com/watch?v=NMDd-4NspHs\u003c/a>\u003cbr>\n標題為「Thomas Test | Iliopsoas Tightness」，我打開確認標題，頻道與內容沒看到。這個影片網址來自 Carepatron 的講義，我沒有看過影片內容。\u003c/p>\n\u003ch3 dir=\"auto\">不足與待確認\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">每個伸展動作的示範圖片：現有資料不足，沒有找到可靠的圖片網址。\u003c/li>\n\u003cli dir=\"auto\">三支影片的頻道名稱與實際動作內容：沒有驗證，建議自己播放確認。\u003c/li>\n\u003cli dir=\"auto\">腰小肌的起止點與神經：現有資料不足。\u003c/li>\n\u003cli dir=\"auto\">髂肌的獨立止點：維基頁面沒有分開寫。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Iliopsoas\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Iliopsoas\" target=\"_blank\">Iliopsoas — Wikipedia\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK531508/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK531508/\" target=\"_blank\">StatPearls: Iliopsoas Muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://mikereinold.com/true-hip-flexor-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://mikereinold.com/true-hip-flexor-stretch/\" target=\"_blank\">Mike Reinold: The True Hip Flexor Stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physitrack.com/exercise-library/how-to-perform-the-kneeling-hip-flexor-stretch-exercise\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physitrack.com/exercise-library/how-to-perform-the-kneeling-hip-flexor-stretch-exercise\" target=\"_blank\">Physitrack：kneeling hip flexor stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physitrack.com/exercise-library/how-to-perform-thomas-test-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physitrack.com/exercise-library/how-to-perform-thomas-test-stretch\" target=\"_blank\">Physitrack：Thomas test stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.wikipedia.org/wiki/Thomas_test\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.wikipedia.org/wiki/Thomas_test\" target=\"_blank\">Wikipedia：Thomas test\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physiotutors.com/wiki/thomas-test/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physiotutors.com/wiki/thomas-test/\" target=\"_blank\">Physiotutors：Thomas test\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.hip-flexor-stretch-kneeling.hw208017\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.hip-flexor-stretch-kneeling.hw208017\" target=\"_blank\">Kaiser Permanente：Hip flexor stretch (kneeling)\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nyp.org/healthlibrary/symptoms/document/hw208017\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nyp.org/healthlibrary/symptoms/document/hw208017\" target=\"_blank\">NYP：Hip flexor stretch (kneeling)\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-25：首次建立。補上解剖、半跪姿伸展與一部已開啟的影片；圖片尚缺。\u003c/li>\n\u003c/ul>"},{"id":"d47f7911-6d58-4523-a173-0f695084f5d3","parentId":null,"x":1207,"y":531,"collapsed":false,"status":"completed","title":"縫匠肌","summary":"縫匠肌是人體最長肌肉，起自髂前上棘、止於脛骨近端內側鵝足，屈髖屈膝；伸展動作的圖片與可開啟影片均未查證到。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">縫匠肌是大腿前方淺層的細長肌肉，\u003cmark>跨髖與膝兩個關節\u003c/mark>，動作都偏弱，多作協同肌。解剖資料已有多個來源互相印證；伸展動作的圖片與影片本次沒查到，不在此編造。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖構造\u003c/h3>\n\u003cp dir=\"auto\">想像一個人盤腿坐下：髖部屈曲、外展、外旋，膝蓋彎起，小腿向內轉。這正是縫匠肌（sartorius）同時參與的動作組合。來源指出它是人體最長的肌肉，從骨盆斜斜跨過大腿前方，走向膝內側。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 595 176\" width=\"595\" height=\"176\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"mindmap\">\u003cg transform=\"translate(313,88)\">\u003cg class=\"pele-branch pele-section-0\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-1,#4c78a8)\" str width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-65.63,0C-91.63,0 -91.63,0 -117.63,0\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,0C-187.5,0 -187.5,-28 -205.5,-28\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,0C-187.5,0 -187.5,28 -205.5,28\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-143.56,0)\">\u003crect x=\"-25.94\" y=\"-24\" width=\"51.88\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">膝\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-247.32,-28)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">膝屈曲\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-255.25,28)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">小腿內旋\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">縫匠肌的動作\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003cth>來源差異\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>髂前上棘\u003c/td>\n\u003ctd>Kenhub 補充含其下切跡上半；StatPearls 指出與闊筋膜張肌共用起點\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>脛骨近端內側，屬鵝足（pes anserinus）\u003c/td>\n\u003ctd>Radiopaedia 描述在脛骨粗隆下方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>股神經前支\u003c/td>\n\u003ctd>節段為 L2–L3（Kenhub、Elsevier）或 L2–L4（Radiopaedia）；StatPearls 提到屍體研究顯示閉孔神經可能也有貢獻；Wikipedia 提到可能有大腿中間皮神經的貢獻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>髖屈曲、外展、外旋；膝屈曲與小腿內旋\u003c/td>\n\u003ctd>Radiopaedia 認為髖、膝屈曲為主要動作，單獨作用時髖部動作較弱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>血液供應\u003c/td>\n\u003ctd>股動脈分支\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Sartorius.png/1280px-Sartorius.png\" alt=\"縫匠肌所在的右下肢前面觀（已移除股直肌以顯露股中間肌）\">\u003cbr>\n圖：右下肢肌肉前面觀，Wikimedia Commons 的 Sartorius.png，取自 \u003ca href=\"https://en.wikipedia.org/wiki/Sartorius_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Sartorius_muscle\" target=\"_blank\">Wikipedia 縫匠肌條目\u003c/a>；作者與年份本次未查證。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">本次搜尋未找到任何已實際開啟、確認內容的縫匠肌伸展 YouTube 影片，因此不提供影片網址，避免憑印象寫出錯誤連結。搜尋結果中只看到某影音聚合站列出「sartorius stretch sidelying」的標題，沒有 YouTube 網址。搜尋「sartorius」也容易被同名的實驗設備公司結果淹沒。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">伸展動作的圖片同樣沒有查到可靠來源，現有資料不足。從解剖動作反推，伸展應涉及髖伸直、內收、內旋與膝伸直的組合，但這是推論，來源沒有提供具體的伸展做法，需要另找物理治療資料確認。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">待確認：(1) 縫匠肌伸展的具體姿勢、圖片與可開啟的影片；(2) 閉孔神經貢獻的臨床意義；(3) 神經節段 L2–L3 與 L2–L4 的差異以教科書為準。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">另外，任務提到「每塊肌肉」，但本次只收到縫匠肌一個議題，其他髖部肌肉未研究。\u003c/p>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>右下肢肌肉前面觀（含縫匠肌）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Sartorius_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Sartorius_muscle\u003c/a>\u003cbr>\n用途：Wikipedia 縫匠肌條目的主圖，顯示右下肢前面觀，已移除股直肌。\u003cbr>\n配色：red / white\u003cbr>\n可套用公式：解剖圖：肌肉走向由髂前上棘斜向脛骨內側\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Sartorius_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Sartorius_muscle\"
