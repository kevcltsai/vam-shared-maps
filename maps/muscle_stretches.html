rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髂嵴\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(263.19,56)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">腹股溝韌帶\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-49.75,0C-75.75,0 -75.75,-82.25 -101.75,-82.25\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,-82.25C-187.5,-82.25 -187.5,-138.25 -205.5,-138.25\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,-82.25C-187.5,-82.25 -187.5,-82.25 -205.5,-82.25\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,-82.25C-187.5,-82.25 -187.5,-26.25 -205.5,-26.25\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-135.63,-82.25)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">止點\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-280.62,-138.25)\">\u003crect x=\"-75.11\" y=\"-24\" width=\"150.23\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">第 10–12 肋下緣\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-239.38,-82.25)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">白線\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-247.32,-26.25)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">恥骨區\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-49.75,0C-75.75,0 -75.75,82.25 -101.75,82.25\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,82.25C-187.5,82.25 -187.5,49.75 -205.5,49.75\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-169.5,82.25C-187.5,82.25 -187.5,114.75 -205.5,114.75\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-135.63,82.25)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">動作\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-302.88,49.75)\">\u003crect x=\"-97.38\" y=\"-24\" width=\"194.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">單側：同側旋轉、側屈\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-318.75,114.75)\">\u003crect x=\"-113.25\" y=\"-33\" width=\"226.51\" height=\"66\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" text-anchor=\"middle\" xml:space=\"preserve\">\u003ctspan x=\"0\" y=\"-4.9\">雙側：屈曲、壓縮腹腔、協\u003c/tspan>\u003ctspan x=\"0\" y=\"16.1\">助吐氣\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">腹內斜肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cdiv class=\"callout\" data-callout=\"info\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-info\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">資訊\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">放大看一個細節：腹內斜肌的起點在髖部（髂嵴），止點在肋骨，與腹外斜肌相反。AthleanX 的文章因此建議側屈時再稍微往下捲，把拉伸焦點放在髖部附著處。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray395.png/330px-Gray395.png\" alt=\"腹內斜肌示意圖（Gray's Anatomy 圖 395，維基共享資源）\">\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">來源是 Hinge Health 物理治療師審閱的文章，列出八個斜肌相關動作。該頁面沒有每個動作的專屬圖片，也沒有 YouTube 影片。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>動作\u003c/th>\n\u003cth>做法摘要\u003c/th>\n\u003cth>圖片\u003c/th>\n\u003cth>YouTube 影片\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>站姿側屈伸手\u003c/td>\n\u003ctd>一手沿腿下滑，另一手上舉越過頭頂，朝正側邊彎\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>膝蓋搖擺\u003c/td>\n\u003ctd>仰躺屈膝，雙膝併攏左右倒，雙肩貼地\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>開書式旋轉\u003c/td>\n\u003ctd>側躺屈膝，上方手臂向上、向後打開並轉向天花板\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仰躺旋轉伸展\u003c/td>\n\u003ctd>仰躺屈膝，一膝拉過身體，另一手向外伸，上背貼地\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>貓牛式\u003c/td>\n\u003ctd>四足跪姿，交替拱背與下凹\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跪姿背闊肌伸展\u003c/td>\n\u003ctd>跪在椅前，手肘放椅面，微圓背、胸口下壓\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>坐姿軀幹旋轉\u003c/td>\n\u003ctd>坐椅、雙臂交叉胸前，從腰部轉向一側\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>穿針式\u003c/td>\n\u003ctd>四足跪姿，一手穿過身下，肩膀降低，胸與頭轉動\u003c/td>\n\u003ctd>查不到專屬圖片\u003c/td>\n\u003ctd>未能查證\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">本次無法提供任何可驗證的 YouTube 網址。搜尋結果與 YouTube 搜尋頁都沒有回傳影片 ID，我不憑印象編寫 ``。每個動作的影片與圖片都需要之後逐一打開確認。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">另外，Peloton 的文章提到，站姿側屈或躺姿變化時，在下方髖部墊毛巾或瑜伽毯可增加伸展感，並指出腹內斜肌位於更深層。這支持「這些動作拉的是斜肌群」，但沒有資料能把腹內斜肌單獨區分出來。\u003c/p>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">哪些動作能專門拉長腹內斜肌，而非整個斜肌群？目前沒有研究或來源回答。\u003c/li>\n\u003cli dir=\"auto\">各動作對應的實際 YouTube 影片（需打開確認）與每個動作的示範圖。\u003c/li>\n\u003cli dir=\"auto\">神經節段的標準寫法，Radiopaedia 與 Kenhub／Wikipedia 並不一致。\u003c/li>\n\u003cli dir=\"auto\">其餘腹壁與背部肌肉（本次只研究腹內斜肌）的解剖與伸展，現有資料不足。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>腹內斜肌示意圖（Gray's Anatomy 圖 395）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Abdominal_internal_oblique_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Abdominal_internal_oblique_muscle\u003c/a>\u003cbr>\n用途：顯示腹內斜肌自髂嵴向上斜行至肋緣與白線的走向。\u003cbr>\n配色：white / gray / red\u003cbr>\n可套用公式：線條解剖圖，標示起止點\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-abdomen/internal-abdominal-oblique-muscle/18607\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-abdomen/internal-abdominal-oblique-muscle/18607\" target=\"_blank\">Elsevier：腹內斜肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://radiopaedia.org/articles/internal-oblique-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://radiopaedia.org/articles/internal-oblique-muscle\" target=\"_blank\">Radiopaedia：腹內斜肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/internal-abdominal-oblique-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/internal-abdominal-oblique-muscle\" target=\"_blank\">Kenhub：腹內斜肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Abdominal_internal_oblique_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Abdominal_internal_oblique_muscle\" target=\"_blank\">Wikipedia：Abdominal internal oblique muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/oblique-stretches-back/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/resources/articles/oblique-stretches-back/\" target=\"_blank\">Hinge Health：8 oblique stretches\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.onepeloton.com/blog/oblique-stretches\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.onepeloton.com/blog/oblique-stretches\" target=\"_blank\">Peloton：oblique stretches\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://learn.athleanx.com/articles/abs-for-men/how-to-stretch-abs\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://learn.athleanx.com/articles/abs-for-men/how-to-stretch-abs\" target=\"_blank\">AthleanX：How To Stretch Abs\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=7Nb1OBpayBw\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=7Nb1OBpayBw\" target=\"_blank\">▶ https://www.youtube.com/watch?v=7Nb1OBpayBw\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=y-obSU1vIUU\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=y-obSU1vIUU\" target=\"_blank\">▶ https://www.youtube.com/watch?v=y-obSU1vIUU\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=OW6YHlxY6JI\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=OW6YHlxY6JI\" target=\"_blank\">▶ https://www.youtube.com/watch?v=OW6YHlxY6JI\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=NTfHfoMg1qA\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=NTfHfoMg1qA\" target=\"_blank\">▶ https://www.youtube.com/watch?v=NTfHfoMg1qA\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray395.png/1280px-Gray395.png\" alt=\"左側腹內斜肌（Gray395，《Gray's Anatomy》第 20 版第 395 圖，Henry Vandyke Carter 繪，1918，Wikimedia Commons，公有領域）\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立，整理位置、起止點、痠痛原因與伸展，附一部已打開的影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：驗證 Gray395 圖檔網址與授權，補 Hinge Health 坐姿側彎與多種伸展的圖文參考；其他伸展影片未找到可驗證者。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：每個伸展補上實際打開的 YouTube 影片（坐姿側彎、開書式、另一站姿側彎），保留圖檔；頻道與資格仍未確認。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：整合重複內容，釐清神經節段只是分組寫法不同（T7–T12 為主、L1 少量），移除舊版殘留段落；影片未重新驗證，其他肌肉議題尚未研究。\u003c/li>\n\u003c/ul>"},{"id":"ee9e5a99-7847-429c-baca-de2f10f2008b","parentId":null,"x":791,"y":261,"collapsed":false,"status":"completed","title":"三角肌","summary":"三角肌分前、中、後三束，皆受腋神經支配；伸展以交叉手臂（後束）、門框（前束）為主，但本次未能查到可驗證的 YouTube 影片。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">三角肌是三角形的大型肩部肌肉，三束共同止於肱骨三角肌粗隆，由腋神經（C5–C6）支配。每一束的功能不同，所以伸展要依束別選動作：\u003cmark>後束\u003c/mark>用交叉手臂或睡姿伸展，前束用門框或靠牆伸展。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">想像你站在診間的解剖圖前：肩膀外側像一塊倒三角形的帽子，從鎖骨外側一路蓋到肩胛棘。這一章要回答兩件事：這塊帽子由哪幾束組成，以及各束該用哪個動作伸展。\u003c/p>\n\u003ch3 dir=\"auto\">解剖與分束\u003c/h3>\n\u003cp dir=\"auto\">三角肌起自鎖骨外側 1/3、肩峰與肩胛棘，止於肱骨的三角肌粗隆。止點傳統上寫成一處，但也有描述把它分成兩到三個區域，對應三個起點。肩胛棘部分的起點，各來源寫法略有出入：有的寫肩胛棘外側 2/3，有的寫肩胛棘下緣。三角肌與旋轉肌袖一起穩定盂肱關節。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>束\u003c/th>\n\u003cth>起點\u003c/th>\n\u003cth>主要動作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>前束（鎖骨部）\u003c/td>\n\u003ctd>鎖骨外側 1/3 前上方\u003c/td>\n\u003ctd>屈曲、內旋，輔助水平內收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中束（肩峰部）\u003c/td>\n\u003ctd>肩峰外側\u003c/td>\n\u003ctd>主要的外展肌；起始外展需棘上肌同時收縮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>後束（肩胛棘部）\u003c/td>\n\u003ctd>肩胛棘下緣\u003c/td>\n\u003ctd>伸展、外旋、水平外展\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 1008 252\" width=\"1008\" height=\"252\" style=\"max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); --_fm: var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace); font-style: normal; font-variant: normal; font-size-adjust: none; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: normal; font-stretch: normal; font-size: 16px; line-height: normal; letter-spacing: normal; word-spacing: normal; text-transform: none; direction: ltr; font-family: var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif); touch-action: pan-y;\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"mindmap\" tabindex=\"0\">\u003cg transform=\"translate(495.57,126)\">\u003cg class=\"pele-branch pele-section-0\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-1,#4c78a8)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M41.81,0C67.81,0 67.81,0 93.81,0\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M240.94,0C258.94,0 258.94,-28 276.94,-28\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M240.94,0C258.94,0 258.94,28 276.94,28\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(167.38,0)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">前束（鎖骨部）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(365.39,-28)\">\u003crect x=\"-88.45\" y=\"-24\" width=\"176.89\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">鎖骨外側 1/3 前上方\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(390.19,28)\">\u003crect x=\"-113.25\" y=\"-24\" width=\"226.51\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">屈曲、內旋，輔助水平內收\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,-66 -93.81,-66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-240.94,-66C-258.94,-66 -258.94,-94 -276.94,-94\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-240.94,-66C-258.94,-66 -258.94,-38 -276.94,-38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-167.38,-66)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">中束（肩峰部）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-326.69,-94)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩峰外側\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-342.57,-38)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">主要的外展肌\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,66 -93.81,66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-256.82,66C-274.82,66 -274.82,38 -292.82,38\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-256.82,66C-274.82,66 -274.82,94 -292.82,94\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-175.32,66)\">\u003crect x=\"-81.5\" y=\"-24\" width=\"163\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">後束（肩胛棘部）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-350.51,38)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛棘下緣\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-390.19,94)\">\u003crect x=\"-97.38\" y=\"-24\" width=\"194.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">伸展、外旋、水平外展\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">三角肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">來源：\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-upper-limb-left/deltoid-muscle-left/19926\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-upper-limb-left/deltoid-muscle-left/19926\" target=\"_blank\">Elsevier 三角肌解剖\u003c/a>、\u003ca href=\"https://www.radiopaedia.org/articles/deltoid-muscle?lang=us\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.radiopaedia.org/articles/deltoid-muscle?lang=us\" target=\"_blank\">Radiopaedia\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/the-deltoid-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/the-deltoid-muscle\" target=\"_blank\">Kenhub\u003c/a>。以上整理自搜尋摘要，我沒有逐頁打開核對原文。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作對照\u003c/h3>\n\u003cp dir=\"auto\">Hinge Health 的文章列出 7 個動作。下表依該文整理；該文多數動作未給停留時間，睡姿伸展只寫「數秒」。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>動作\u003c/th>\n\u003cth>目標\u003c/th>\n\u003cth>做法重點\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>坐姿交叉手臂\u003c/td>\n\u003ctd>後束、旋轉肌袖\u003c/td>\n\u003ctd>坐著抱住對側手肘，推向對側肩；怕痛可只推到胸前一半\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>睡姿伸展\u003c/td>\n\u003ctd>後束與肩後側\u003c/td>\n\u003ctd>側躺，下方手臂上舉，另一手把前臂往下壓到約一半，停數秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>站姿睡姿伸展\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003ctd>側身靠牆，手臂貼牆，另一手往下壓前臂；平衡不佳改躺姿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>站姿胸部伸展\u003c/td>\n\u003ctd>前束\u003c/td>\n\u003ctd>手往後貼牆、掌心向牆，身體轉離手臂，肩不聳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>門框伸展\u003c/td>\n\u003ctd>前束與胸肌\u003c/td>\n\u003ctd>手肘彎約 90 度、前臂貼門框，一腳跨過門，前臂不動；上舉會痛就把手放低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>背後毛巾\u003c/td>\n\u003ctd>前束\u003c/td>\n\u003ctd>一手在腰後、一手在頭後拉毛巾，上方手往天花板拉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>螃蟹推\u003c/td>\n\u003ctd>肩部穩定，順帶伸展前束\u003c/td>\n\u003ctd>坐姿雙手在身後撐地，抬臀成桌面姿勢\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">來源：\u003ca href=\"https://www.hingehealth.com/resources/articles/deltoid-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/resources/articles/deltoid-stretch\" target=\"_blank\">Hinge Health：7 best deltoid stretches\u003c/a>。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://images.ctfassets.net/hjcv6wdwxsdz/7cD7y38e8iD0E7H49fIUIT/aecfe46d004c75b2ff12727018fa9251/woman-performing-deltoid-stretches.png\" alt=\"Hinge Health 文章標題圖：女性示範三角肌伸展\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>女性示範三角肌伸展\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.hingehealth.com/resources/articles/deltoid-stretch\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.hingehealth.com/resources/articles/deltoid-stretch\u003c/a>\u003cbr>\n用途：Hinge Health 三角肌伸展文章的標題圖，示範伸展姿勢。\u003cbr>\n配色：white / navy\u003cbr>\n可套用公式：人物示範圖＋淺色背景\u003c/p>\n\u003cp dir=\"auto\">圖說：女性示範三角肌伸展，Hinge Health 文章標題圖，年份不詳。\u003c/p>\n\u003ch4 dir=\"auto\">放大一個細節：停留時間與手握位置\u003c/h4>\n\u003cp dir=\"auto\">站姿交叉手臂伸展在 Physitrack 的說明中，是另一手放在手肘上方、輕輕把手臂拉向胸前（\u003ca href=\"https://us.physitrack.com/home-exercise-video/posterior-deltoid-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.physitrack.com/home-exercise-video/posterior-deltoid-stretch\" target=\"_blank\">Physitrack\u003c/a>）。Fitwill 建議抓手肘上方，因為直接拉手肘關節會對關節造成壓力，並建議讓張力在 20 到 30 秒內放鬆，不要硬拉（\u003ca href=\"https://fitwill.app/exercise/8128/seated-cross-body-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://fitwill.app/exercise/8128/seated-cross-body-stretch/\" target=\"_blank\">Fitwill\u003c/a>）。門框伸展的停留時間，\u003ca href=\"https://targetshooting.ca/physical-training/stretching/doorway-front-deltoid-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://targetshooting.ca/physical-training/stretching/doorway-front-deltoid-stretch/\" target=\"_blank\">targetshooting.ca\u003c/a> 這類來源建議 10 到 15 秒；Motra 列出的組間休息是 10 到 30 秒。\u003c/p>\n\u003ch3 dir=\"auto\">限制與注意\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">近期有脫臼、旋轉肌袖修補或夾擠問題的人，做末端範圍的交叉伸展前，Fitwill 建議先找專業人員指導。Healthline 也提醒，做不到標準姿勢就不要硬撐。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">Hinge Health 在一處把坐姿交叉手臂寫成針對前束，與同文其他段落及多數來源（後束）矛盾，我判斷是筆誤，以後束為準。\u003c/p>\n\u003ch3 dir=\"auto\">待確認\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">\u003cstrong>影片：現有資料不足。\u003c/strong> 本次搜尋與嘗試讀取 YouTube 搜尋頁，都沒有取得任何可確認 \u003ccode>watch?v=\u003c/code> 影片 ID 的結果，Hinge Health 頁面也只寫「see videos below」而沒有連結。依規則我不憑印象填網址，所以每個伸展動作的 YouTube 影片都標為「查不到」，包括前束仍無已打開的影片。\u003cbr>\n\u003cstrong>圖片：\u003c/strong> 目前只有一張伸展示範圖（Hinge Health 標題圖），沒有各動作各自一張的圖，也沒有解剖標註圖的可驗證圖檔網址。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul class=\"contains-task-list\">\n\u003cli class=\"task-list-item\" dir=\"auto\">\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled=\"\">在 YouTube 手動搜尋「cross body shoulder stretch」「doorway anterior deltoid stretch」，打開確認後再補上 ``\u003c/li>\n\u003cli class=\"task-list-item\" dir=\"auto\">\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled=\"\">為每個伸展動作各找一張圖\u003c/li>\n\u003cli class=\"task-list-item\" dir=\"auto\">\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled=\"\">找一張可驗證的三角肌解剖圖（例如維基共享資源）\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-upper-limb-left/deltoid-muscle-left/19926\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-upper-limb-left/deltoid-muscle-left/19926\" target=\"_blank\">Elsevier 三角肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.radiopaedia.org/articles/deltoid-muscle?lang=us\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.radiopaedia.org/articles/deltoid-muscle?lang=us\" target=\"_blank\">Radiopaedia：Deltoid muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/the-deltoid-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/the-deltoid-muscle\" target=\"_blank\">Kenhub：The deltoid muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/deltoid-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/resources/articles/deltoid-stretch\" target=\"_blank\">Hinge Health：7 best deltoid stretches\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://us.physitrack.com/home-exercise-video/posterior-deltoid-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.physitrack.com/home-exercise-video/posterior-deltoid-stretch\" target=\"_blank\">Physitrack：Posterior deltoid stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://fitwill.app/exercise/8128/seated-cross-body-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://fitwill.app/exercise/8128/seated-cross-body-stretch/\" target=\"_blank\">Fitwill：seated cross body stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://targetshooting.ca/physical-training/stretching/doorway-front-deltoid-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://targetshooting.ca/physical-training/stretching/doorway-front-deltoid-stretch/\" target=\"_blank\">targetshooting.ca：Doorway Front Deltoid Stretch\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=cmE9YvjJVZk\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=cmE9YvjJVZk\" target=\"_blank\">▶ https://www.youtube.com/watch?v=cmE9YvjJVZk\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=OvOSGeU55C0\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=OvOSGeU55C0\" target=\"_blank\">▶ https://www.youtube.com/watch?v=OvOSGeU55C0\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=fCVIDYlRnDw\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=fCVIDYlRnDw\" target=\"_blank\">▶ https://www.youtube.com/watch?v=fCVIDYlRnDw\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://www.topendsports.com/cdn-cgi/image/format=auto,width=260,height=296,quality=60,fit=scale-down/global/images/medicine_images_shoulder-posterior.gif\" alt=\"站姿交叉手臂伸展示意圖（Posterior Shoulder Stretch，Top End Sports，年份未標示）\">\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://content.healthwise.net/resources/15.0/en-us/media/medical/hw/aco5771_460x300.jpg\" alt=\"前肩門框伸展示意圖（Anterior shoulder stretch doorway，Columbia Doctors／Healthwise，年份未標示）\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理。補入後束與前束伸展、一張可用圖片、兩部已開啟的 YouTube 頁。圖片與影片缺口列於待確認問題。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：新增已打開的睡姿伸展影片（Mike Reinold）、睡姿與交叉伸展效果的爭議、Kaiser 前肩門框伸展；前束影片與圖片仍缺。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：首次整理。補入後束與前束伸展、一張可用圖片、兩部已開啟的 YouTube 頁。；新增已打開的睡姿伸展影片（Mike Reinold）、睡姿與交叉伸展效果的爭議、Kaiser 前肩門框伸展。；補入前束單側門框伸展的圖片與停留時間（Columbia Doctors、Back Muscle Solutions）；前束影片仍未找到可打開的頁面。\u003c/li>\n\u003c/ul>"},{"id":"06669028-aa25-4aed-a0d1-62d174248e17","parentId":null,"x":1758,"y":-21,"collapsed":false,"status":"completed","title":"腰大肌","summary":"腰大肌起於 T12–L5 一帶，止於股骨小轉子，受 L1–L3 神經支配，主要屈髖；常見伸展有半跪、Thomas 位、側彎弓箭步，影片已核對標題。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">腰大肌與髂肌合稱髂腰肌，共同止於小轉子。來源對起點的椎體節段寫法不一（T12–L4 或 T12–L5），所以「T12–L5」宜視為範圍而非定論。伸展時要讓髖部伸直、骨盆後傾，才會拉到腰大肌而不是只靠腰椎代償。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖\u003c/h3>\n\u003cp dir=\"auto\">想像你側躺在解剖台旁，沿著腰椎兩側往下看：這條肌肉從腰椎旁出發，越過骨盆邊緣，鑽到腹股溝韌帶下方，最後抓在大腿骨內側上方的小突起上。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003cth>來源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>腰椎橫突與椎體、椎間盤；深層為 L1–L5 橫突，淺層為 T12–L4 及鄰近椎間盤（Wikipedia）；Radiopaedia 寫 T12–L5\u003c/td>\n\u003ctd>Wikipedia、Radiopaedia\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>股骨小轉子，與髂肌合為髂腰肌\u003c/td>\n\u003ctd>Wikipedia、Elsevier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>腰神經叢，L1–L3 前支\u003c/td>\n\u003ctd>Wikipedia、Kenhub\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>屈髖；單側收縮使軀幹側彎；雙側收縮使軀幹自仰躺抬起；另有髖外旋與微弱內收\u003c/td>\n\u003ctd>Wikipedia、Kenhub\u003c/td le-edges\" fill=\"none\" stroke=\"var(--pele-series-4,#e45756)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,66 -93.81,66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,10 -197.56,10\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,66 -197.56,66\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-161.56,66C-179.56,66 -179.56,122 -197.56,122\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-127.69,66)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">動作\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-231.44,10)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">屈髖\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-247.32,66)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">軀幹側彎\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-279.07,122)\">\u003crect x=\"-81.5\" y=\"-24\" width=\"163\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髖外旋與微弱內收\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">腰大肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Psoas_major_muscle11.png/1280px-Psoas_major_muscle11.png\" alt=\"腰大肌位置（紅色）。Psoas major muscle11，維基共享資源\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>腰大肌位置（紅色）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Psoas_major_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Psoas_major_muscle\u003c/a>\u003cbr>\n用途：維基共享資源的腰大肌位置示意圖，以紅色標出腰大肌。\u003cbr>\n配色：red / white\u003cbr>\n可套用公式：腰椎旁起點 → 越過骨盆 → 小轉子\u003c/p>\n\u003cp dir=\"auto\">圖說：腰大肌位置示意（紅色），圖檔 Psoas_major_muscle11.png，來源為維基共享資源，見 \u003ca href=\"https://en.wikipedia.org/wiki/Psoas_major_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Psoas_major_muscle\" target=\"_blank\">Wikipedia 腰大肌條目\u003c/a>。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">本次只查證腰大肌。髂肌、腰小肌與其他髖部肌肉的解剖與伸展，現有資料不足，未寫入。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">影片的處理方式：我用 WebFetch 打開了下列三個網址，頁面只回傳標題，沒有頻道名稱與動作內容。所以下面只能確認「標題與網址存在」，我沒有看過影片內容。圖片是該影片的 YouTube 預設縮圖，不是另外找的示範圖。\u003c/p>\n\u003ch4 dir=\"auto\">1. 半跪髖屈肌伸展\u003c/h4>\n\u003cp dir=\"auto\">一膝跪地、另一腳在前，軀幹直立，輕微骨盆後傾並壓低肋骨，避免腰椎過度反弓，再往前移到髖前側有拉伸感，維持 20–30 秒（診所影片說明，經搜尋摘要轉述）。Mike Reinold 的文章建議不要彎曲膝蓋，讓它維持單關節伸展，以聚焦腰大肌而非股直肌。膝蓋不舒服時可墊毛巾（NYP 衛教單張）。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=cvSWCoH-HXc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=cvSWCoH-HXc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=cvSWCoH-HXc\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">標題為「Half Kneeling Hip Flexor Stretch」，頻道與內容未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">2. 仰臥 Thomas 位伸展\u003c/h4>\n\u003cp dir=\"auto\">躺在床緣，對側膝蓋抱向胸口，保持骨盆貼穩以減少下背代償，再輕輕讓垂在外的腿朝地板方向下壓，形成髖伸直。建議 2–4 次、每次 15–30 秒（影片描述的搜尋摘要，非臨床文獻）。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 243 448\" width=\"243\" height=\"448\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,56L121.25,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,104L117.89,96L124.61,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,152L121.25,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,200L117.89,192L124.61,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,248L121.25,289\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,296L117.89,288L124.61,288Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,344L121.25,385\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,392L117.89,384L124.61,384Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,32)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">躺在床緣\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,128)\">\u003crect x=\"-81.5\" y=\"-24\" width=\"163\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">對側膝蓋抱向胸口\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,224)\">\u003crect x=\"-105.32\" y=\"-24\" width=\"210.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">骨盆貼穩，減少下背代償\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,320)\">\u003crect x=\"-113.25\" y=\"-24\" width=\"226.51\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">垂在外的腿朝地板方向下壓\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,416)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">形成髖伸直\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=jbYWnm8W5wk\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=jbYWnm8W5wk\" target=\"_blank\">▶ https://www.youtube.com/watch?v=jbYWnm8W5wk\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">標題為「Thomas / Hip Flexor Stretch」，頻道與內容未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">3. 跪姿弓箭步加側彎\u003c/h4>\n\u003cp dir=\"auto\">側彎的目的是進一步拉長腰大肌；一則來源說明，傾斜軀幹會把腰椎拉離脊柱方向（原文被截斷，細節不全）。診所手冊也建議同側手臂上舉、向遠離伸展側微傾，並夾緊臀部以輔助。Olympic PT 的版本再加入旋轉，因經典版本只作用在髖部那一段。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=lBJV4rz0DrI\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=lBJV4rz0DrI\" target=\"_blank\">▶ https://www.youtube.com/watch?v=lBJV4rz0DrI\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">標題為「How To: Kneeling Lunge with Side Bend [Flexopedia Entry 29]」，頻道與內容未能確認。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">側彎或旋轉版本是否比基本半跪式更能拉長腰大肌，目前只有教練與診所的說法，沒找到對照研究。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Psoas_major_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Psoas_major_muscle\" target=\"_blank\">Wikipedia：Psoas major muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://radiopaedia.org/articles/10102\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://radiopaedia.org/articles/10102\" target=\"_blank\">Radiopaedia：Psoas major\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/psoas-major/22089\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/psoas-major/22089\" target=\"_blank\">Elsevier 解剖資源\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/psoas-major-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/psoas-major-muscle\" target=\"_blank\">Kenhub：Psoas major muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.mikereinold.com/2014/03/true-hip-flexor-stretch.html\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.mikereinold.com/2014/03/true-hip-flexor-stretch.html\" target=\"_blank\">Mike Reinold：The True Hip Flexor Stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://health.clevelandclinic.org/psoas-stretch-guide-for-psoas-release\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://health.clevelandclinic.org/psoas-stretch-guide-for-psoas-release\" target=\"_blank\">Cleveland Clinic：Psoas stretch guide\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nyp.org/healthlibrary/symptoms/document/hw208017\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nyp.org/healthlibrary/symptoms/document/hw208017\" target=\"_blank\">NYP：Hip flexor stretch (kneeling)\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://us.physitrack.com/home-exercise-video/hip-flexor-stretch-%2528thomas-test-position%2529\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.physitrack.com/home-exercise-video/hip-flexor-stretch-%2528thomas-test-position%2529\" target=\"_blank\">Physitrack：Thomas test 位伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">YouTube：\u003ca href=\"https://www.youtube.com/watch?v=cvSWCoH-HXc\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=cvSWCoH-HXc\" target=\"_blank\">cvSWCoH-HXc\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=jbYWnm8W5wk\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=jbYWnm8W5wk\" target=\"_blank\">jbYWnm8W5wk\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=lBJV4rz0DrI\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=lBJV4rz0DrI\" target=\"_blank\">lBJV4rz0DrI\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=1KBNyAVARzc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=1KBNyAVARzc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=1KBNyAVARzc\u003c/a>\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-25：首次整理。建立解剖摘要、半跪姿伸展與一部已開啟的影片。\u003c/li>\n\u003c/ul>"},{"id":"f3f58cfd-ee2e-4c2d-963c-296407da3e2c","parentId":null,"x":1758,"y":1014,"collapsed":false,"status":"completed","title":"股直肌","summary":"股直肌是唯一跨髖與膝的股四頭肌，起於髂前下棘與髖臼上緣；伸展需髖伸直、膝彎曲並維持骨盆後傾。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">\u003cmark>股直肌\u003c/mark>有兩個起點、跨兩個關節，所以只彎膝或只伸髖都拉不到底；要同時做到髖伸直、膝屈曲，再用骨盆後傾避免腰椎代償。這是依來源整理的判斷，不同來源對止點的寫法略有出入。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖結構\u003c/h3>\n\u003cp dir=\"auto\">想像你側躺在診療床上，醫師沿著大腿前側往上摸，會停在骨盆前方一個小突起：髂前下棘（AIIS）。股直肌的直頭就從這裡出發，反折頭則起於髖臼上外側的邊緣，兩頭在起點下方不遠處合成共同肌腱（\u003ca href=\"https://radiopaedia.org/articles/44281\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://radiopaedia.org/articles/44281\" target=\"_blank\">Radiopaedia\u003c/a>、\u003ca href=\"https://Www.wikipedia.org/wiki/Rectus_femoris\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://Www.wikipedia.org/wiki/Rectus_femoris\" target=\"_blank\">Wikipedia\u003c/a>）。\u003c/p>\n\u003cp dir=\"auto\">這個細節值得放大：止點各家寫法不同。Elsevier 寫經股四頭肌腱與髕韌帶到脛骨粗隆；Radiopaedia 寫股四頭肌腱；華盛頓大學肌肉圖譜寫髕骨底並連到股四頭肌腱中央（\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/rectus-femoris-muscle/17868\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-lower-limb/rectus-femoris-muscle/17868\" target=\"_blank\">Elsevier\u003c/a>、\u003ca href=\"https://rad.washington.edu/muscle-atlas/rectus-femoris\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://rad.washington.edu/muscle-atlas/rectus-femoris\" target=\"_blank\">UW 圖譜\u003c/a>）。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>直頭：髂前下棘；反折頭：髖臼上緣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>髕骨底／股四頭肌腱，經髕韌帶至脛骨粗隆（來源說法不一）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>屈髖、伸膝\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>股神經，來源列 L2–L4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 754 252\" width=\"754\" height=\"252\" style=\"max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); --_fm: var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot
