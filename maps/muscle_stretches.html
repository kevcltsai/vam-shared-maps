.6\" text-anchor=\"middle\">University of Washington\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(437.38,52)\">\u003crect x=\"-74.75\" y=\"-24\" width=\"149.5\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下 6 節胸椎棘突\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(430.93,108)\">\u003crect x=\"-68.3\" y=\"-24\" width=\"136.6\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下 3–4 條肋骨\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-57.69,0C-83.69,0 -83.69,0 -109.69,0\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-235.11,0C-253.11,0 -253.11,-84 -271.11,-84\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-235.11,0C-253.11,0 -253.11,-28 -271.11,-28\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-235.11,0C-253.11,0 -253.11,28 -271.11,28\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-235.11,0C-253.11,0 -253.11,84 -271.11,84\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-172.4,0)\">\u003crect x=\"-62.71\" y=\"-24\" width=\"125.42\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">Radiopaedia\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-334.04,-84)\">\u003crect x=\"-62.93\" y=\"-24\" width=\"125.87\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">T7–T12 棘突\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-325.71,-28)\">\u003crect x=\"-54.6\" y=\"-24\" width=\"109.2\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髂嵴後 1/3\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-326.85,28)\">\u003crect x=\"-55.74\" y=\"-24\" width=\"111.48\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">第 9–12 肋\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-320.86,84)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛下角\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">背闊肌起點\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>肱骨結節間溝（二頭肌溝）底部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>胸背神經，臂神經叢後束，C6–C8，以 C7 為主\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>血供\u003c/td>\n\u003ctd>胸背動脈（肩胛下動脈分支）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>變異\u003c/td>\n\u003ctd>約 13% 的人，胸背神經也支配大圓肌（StatPearls 所述）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">使用者標註的「中下背外側」對應的正是這片肌肉在軀幹側後方最寬的部分。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">這一章回答：實際做起來是什麼樣子？以下動作取自 Healthline 的「10 Lat Stretches」，圖片是該頁的動圖。影片我用 WebFetch 實際開啟過頁面，但擷取內容只剩標題，看不到影片內容與頻道，所以只能確認「標題與動作名稱相符」，無法確認示範細節。\u003c/p>\n\u003ch4 dir=\"auto\">跪姿主動地板伸展\u003c/h4>\n\u003cp dir=\"auto\">跪下、臀部後坐，一側前臂貼地，另一手向外伸，停數秒、重複 10 次再換邊（Healthline）。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2019/06/Active-floor-stretch.gif\">\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=OJuUdIcQVBc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=OJuUdIcQVBc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=OJuUdIcQVBc\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">影片標題「Active Lat Stretch」；頻道與內容未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">健身球／椅子伸展\u003c/h4>\n\u003cp dir=\"auto\">四足跪姿，一手放球上拇指朝上，把球往前滾，每次停 20–30 秒，每側 2–3 次（Healthline）。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2019/06/Exercise-ball-stretch.gif\">\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=agv9iUJoz6w\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=agv9iUJoz6w\" target=\"_blank\">▶ https://www.youtube.com/watch?v=agv9iUJoz6w\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">影片標題「Kneeling Lat Stretch」，頻道顯示為 THIRSTgym.com（取自頁面標題）；跪姿而非球上版本，示範細節未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">兒童式（Balasana）\u003c/h4>\n\u003cp dir=\"auto\">從下犬式放下膝蓋，臀部後坐，額頭貼地，手指往前再往兩側走以加深（Healthline）。NASM 建議停留 1–2 分鐘；這與 Healthline 其他動作的秒數不同，來源之間沒有統一。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2019/06/childs-pose.gif\">\u003c/p>\n\u003cp dir=\"auto\">這個動作我沒有查到一部實際打開過、且確認是兒童式的 YouTube 影片。Brookbush Institute 有影片頁（\u003ca href=\"https://brookbushinstitute.com/videos/latissimus-dorsi-and-erector-spinae-static-stretch-childs-pose\" rel=\"noopener nofollow\" target=\"_blank\">連結\u003c/a>），但不是 YouTube，也未驗證。\u003c/p>\n\u003ch4 dir=\"auto\">動態伸展（雙臂過頭擺動）\u003c/h4>\n\u003cp dir=\"auto\">站姿雙臂伸直過頭擺動，標題為「Stretching Dynamic Lat Stretch」。我沒有取得對應的動作圖。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=tSstHfqtPHs\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=tSstHfqtPHs\" target=\"_blank\">▶ https://www.youtube.com/watch?v=tSstHfqtPHs\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">頻道與內容未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">門框伸展\u003c/h4>\n\u003cp dir=\"auto\">標題為「Doorway Stretch for your Lats (Latissimus Dorsi)」，是 YouTube Shorts（網址為 youtube.com/shorts/x97hAScVHHc）。沒有取得對應圖片，示範細節未能確認。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=x97hAScVHHc\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=x97hAScVHHc\" target=\"_blank\">▶ https://www.youtube.com/watch?v=x97hAScVHHc\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">其他動作\u003c/h4>\n\u003cp dir=\"auto\">Healthline 還列出泡棉滾筒（每側約 1 分鐘）、牆面下壓（最多 1 分鐘）、上舉式、鷹式、貓牛式、下犬式、上犬式；這幾個我沒有找到實際驗證過的影片。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">這一輪只處理背闊肌一塊肌肉。任務提到「每塊肌肉」，但本議題只有背闊肌，其他肌肉需要另開議題研究。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">證據與限制\u003c/h3>\n\u003cp dir=\"auto\">停留時間的依據來自 Kay 與 Blazevich 2012 年的系統性回顧（納入 106 篇研究，初篩 4559 篇）：短於 30 秒的靜態伸展沒有明顯降低最大肌力表現，30–45 秒也沒有顯著影響，超過 60 秒才可能出現顯著下降。另一份柔軟度文獻指出，關節活動度的最大變化出現在 15–30 秒之間，多數作者認為 10–30 秒足夠。\u003c/p>\n\u003cp dir=\"auto\">但這些是一般肌群、以「運動表現」為主的證據，不是背闊肌專屬，也不是長期柔軟度試驗。該回顧本身也提到有些研究設計不佳（30% 缺乏適當的信度統計）。我沒有取得 Pinto 等人 2014 年 30 秒對 60 秒的比較結果。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">待確認：背闊肌伸展對肩痛、背痛是否有專屬療效？有沒有針對過頭活動度的對照試驗？本次沒有找到可靠來源。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>Healthline：跪姿主動地板背闊肌伸展（動圖）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.healthline.com/health/lat-stretches\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.healthline.com/health/lat-stretches\u003c/a>\u003cbr>\n用途：跪姿臀部後坐、一手向外伸展的背闊肌伸展示範。\u003cbr>\n配色：white / teal\u003cbr>\n可套用公式：跪姿 + 臀部後坐 + 單手外伸\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>Healthline：健身球背闊肌伸展（動圖）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.healthline.com/health/lat-stretches\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.healthline.com/health/lat-stretches\u003c/a>\u003cbr>\n用途：四足跪姿、單手推球向前的伸展示範，每次 20–30 秒。\u003cbr>\n配色：white / teal\u003cbr>\n可套用公式：四足跪姿 + 推球前滾\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>Healthline：兒童式（動圖）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.healthline.com/health/lat-stretches\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.healthline.com/health/lat-stretches\u003c/a>\u003cbr>\n用途：兒童式，手指往前並往兩側走以加深背闊肌伸展。\u003cbr>\n配色：white / teal\u003cbr>\n可套用公式：臀部後坐 + 額頭貼地 + 手指側走\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK448120/\" rel=\"noopener nofollow\" target=\"_blank\">StatPearls：背闊肌解剖\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://rad.uw.edu/muscle-atlas/latissimus-dorsi\" rel=\"noopener nofollow\" target=\"_blank\">University of Washington 肌肉圖譜\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.radiopaedia.org/articles/latissimus-dorsi-muscle?lang=us\" rel=\"noopener nofollow\" target=\"_blank\">Radiopaedia：背闊肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/lat-stretches\" rel=\"noopener nofollow\" target=\"_blank\">Healthline：Lat Stretches（動作、秒數、動圖）\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nasm.org/resource-center/exercise-library/childs-pose\" rel=\"noopener nofollow\" target=\"_blank\">NASM：兒童式\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/21659901/\" rel=\"noopener nofollow\" target=\"_blank\">Kay &amp; Blazevich：急性靜態伸展與最大肌肉表現的系統性回顧\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">YouTube 影片：agv9iUJoz6w、OJuUdIcQVBc、tSstHfqtPHs、shorts/x97hAScVHHc（僅確認標題）\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=jXB-gTLFDp8\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=jXB-gTLFDp8\" target=\"_blank\">▶ https://www.youtube.com/watch?v=jXB-gTLFDp8\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=Ca6cJdBeB0s\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=Ca6cJdBeB0s\" target=\"_blank\">▶ https://www.youtube.com/watch?v=Ca6cJdBeB0s\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=jlTXSpJcKZY\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=jlTXSpJcKZY\" target=\"_blank\">▶ https://www.youtube.com/watch?v=jlTXSpJcKZY\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=xSPuhmL8cos\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=xSPuhmL8cos\" target=\"_blank\">▶ https://www.youtube.com/watch?v=xSPuhmL8cos\u003c/a>\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。修正原本「背闊肌＝伸展動作」的理解，改為肌肉解剖加伸展清單；補上 4 部已開啟的 YouTube 影片頁與 Healthline 動作圖。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上兒童式側伸的文字來源、停留時間證據（腿後肌試驗外推）與待確認清單；仍未找到兒童式側伸與提肩胛肌影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：重新開啟 4 部 YouTube 影片確認標題（低單槓與主動孤立伸展的標題已補正），整合 Detail 並精簡重複內容；兒童式側伸影片與頻道資訊仍未找到。\u003c/li>\n\u003c/ul>"},{"id":"99caad27-bc30-4e1a-bcf1-bd92a39f0b30","parentId":null,"x":-417,"y":683,"collapsed":false,"status":"completed","title":"豎脊肌","summary":"豎脊肌由髂肋肌、最長肌、棘肌三柱組成，受脊神經後支支配；伸展多為衛教建議，無專屬試驗，本次僅開啟過兩部影片。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">豎脊肌是脊柱後方由外往內排列的三條縱向肌柱：髂肋肌、最長肌、棘肌。三者合起來主要負責伸直（並旋轉）脊柱。\u003cmark>伸展動作的證據在本次資料中不足\u003c/mark>，以下只是衛教層級的做法，不是療效結論。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖：三柱各自的位置\u003c/h3>\n\u003cp dir=\"auto\">站在解剖圖前看背部深層，會看到髂肋肌最靠外、最長肌居中、棘肌貼著棘突。這個由外往內的順序，常用口訣「I Love Spine」記憶。整群肌肉的共同描述（\u003ca href=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" target=\"_blank\">Wikipedia\u003c/a>）：起點為 T9–T12 棘突與髂嵴內側斜面，止點為 T1–T2 與頸椎棘突，神經為脊神經後支，作用為伸直脊柱。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 498 140\" width=\"498\" height=\"140\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"mindmap\">\u003cg transform=\"translate(248.94,70)\">\u003cg class=\"pele-branch pele-section-0\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-1,#4c78a8)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M41.81,0C67.81,0 67.81,0 93.81,0\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(167.38,0)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髂肋肌（外側）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,-38 -93.81,-38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-167.38,-38)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">最長肌（中間）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,38 -93.81,38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-159.44,38)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">棘肌（內側）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">豎脊肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Gray389_-_Erector_spinae.png/330px-Gray389_-_Erector_spinae.png\" alt=\"Gray389 豎脊肌群，Henry Gray《Gray's Anatomy》，1918 年版圖，Wikimedia Commons\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>Gray389 豎脊肌群\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Erector_spinae_muscles\u003c/a>\u003cbr>\n用途：Gray's Anatomy（1918 年版）的豎脊肌群插圖，顯示三柱排列。\u003cbr>\n配色：beige / red / gray\u003cbr>\n可套用公式：外側髂肋肌、中間最長肌、內側棘肌，由外往內並列\u003c/p>\n\u003cp dir=\"auto\">上圖：Gray389〈Erector spinae〉，出自 Gray's Anatomy（1918 年版）；我只在 Wikipedia 頁面看到這個網址，沒有另外開啟圖檔本身確認。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>肌柱\u003c/th>\n\u003cth>部分\u003c/th>\n\u003cth>起點\u003c/th>\n\u003cth>止點\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>髂肋肌（外側）\u003c/td>\n\u003ctd>腰部\u003c/td>\n\u003ctd>薦骨、豎脊肌腱膜、髂嵴\u003c/td>\n\u003ctd>第 12 至 7 肋\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>胸部\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003ctd>下 6 肋至上 6 肋\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>頸部\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003ctd>上 6 肋至 C6–C4 橫突後結節\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最長肌（中間）\u003c/td>\n\u003ctd>胸部\u003c/td>\n\u003ctd>薦骨、腰椎棘突、最後胸椎橫突\u003c/td>\n\u003ctd>腰椎橫突、腱膜、肋骨、胸椎肋突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>頸部\u003c/td>\n\u003ctd>T6–T1 橫突\u003c/td>\n\u003ctd>C7–C2 橫突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>頭部\u003c/td>\n\u003ctd>T3–T1 橫突\u003c/td>\n\u003ctd>顳骨乳突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>棘肌（內側）\u003c/td>\n\u003ctd>胸部\u003c/td>\n\u003ctd>L3–T10 棘突\u003c/td>\n\u003ctd>T8–T2 棘突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>頸部\u003c/td>\n\u003ctd>T2–C6 棘突\u003c/td>\n\u003ctd>C4–C2 棘突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>頭部\u003c/td>\n\u003ctd>頸與上胸椎的不穩定肌束\u003c/td>\n\u003ctd>枕外隆凸\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">來源：Wikipedia（上表）。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">各來源的附著點與神經細分不一致。例如 NCBI 的搜尋摘要把髂肋肌頸部寫成「起於肋骨角、止於 C4–C6」，與上表方向相反；Kenhub 與 NCBI 對最長肌、棘肌受哪一支後支支配的說法也不同。NCBI 頁面因驗證機制我無法開啟，各柱個別的神經與作用，現有資料不足，需查標準解剖書。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">豎脊肌被拉長的動作，是脊柱前屈、整個背部圓起來。以下兩個動作各有一部我實際以工具打開、讀到標題的 YouTube 頁面；但頁面內容被截斷，無法確認影片是否仍可播放，也無法確認頻道名稱。\u003c/p>\n\u003ch4 dir=\"auto\">嬰兒式（Child's Pose）\u003c/h4>\n\u003cp dir=\"auto\">NASM 的步驟：四足跪姿，膝與髖同寬、手與肩同寬；臀部往腳跟坐回，手臂向前伸，額頭靠墊；停留 1–2 分鐘，專心呼吸（\u003ca href=\"https://www.nasm.org/resource-center/exercise-library/childs-pose\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nasm.org/resource-center/exercise-library/childs-pose\" target=\"_blank\">NASM\u003c/a>）。Harvard Health 的下背伸展指南則列 10–30 秒（\u003ca href=\"https://www.health.harvard.edu/pain/relieve-low-back-pain-with-stretching\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.health.harvard.edu/pain/relieve-low-back-pain-with-stretching\" target=\"_blank\">Harvard Health\u003c/a>）。各來源對主要伸展的是背闊肌或豎脊肌說法不一。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=_ZX_zTOBgp8\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=_ZX_zTOBgp8\" target=\"_blank\">▶ https://www.youtube.com/watch?v=_ZX_zTOBgp8\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">影片標題：「How to do a Child's Pose Stretch | Proper Form &amp; Technique | NASM」。圖片：NASM 頁面沒有列出圖檔，本次找不到可驗證的圖片網址。\u003c/p>\n\u003ch4 dir=\"auto\">單膝抱胸（Knee to Chest）\u003c/h4>\n\u003cp dir=\"auto\">仰臥，一膝拉向胸口、另一腳平放，停留 15–30 秒，每側重複 2–4 次；若會引發或加劇背痛或腿痛就不要做（\u003ca href=\"https://uofmhealth.org/health-library/sig44113\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://uofmhealth.org/health-library/sig44113\" target=\"_blank\">U-M Health\u003c/a>、\u003ca href=\"https://www.health.harvard.edu/pain/relieve-low-back-pain-with-stretching\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.health.harvard.edu/pain/relieve-low-back-pain-with-stretching\" target=\"_blank\">Harvard Health\u003c/a>）。\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=8kzfXDNq_P8\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=8kzfXDNq_P8\" target=\"_blank\">▶ https://www.youtube.com/watch?v=8kzfXDNq_P8\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">影片標題：「Knee to Chest Exercise」，由 Physio-pedia 引為 Collegiate Sports Medicine（Red Deer）的影片；頁面只讀到標題，頻道與可播放性未確認。圖片：本次找不到可驗證的圖片網址。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">其他常見動作（坐姿前屈、雙膝抱胸、貓牛式等）本次沒有查到可驗證的影片與圖片，故不列出，也不憑印象寫網址。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">證據與限制\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">本次搜尋的來源以衛教與運動網站為主，沒有找到針對豎脊肌的伸展對照試驗；現有結論沿用既有判斷：證據低至中等、屬衛教建議。\u003c/li>\n\u003cli dir=\"auto\">兩個伸展的停留時間因來源而異（10–30 秒、15–30 秒、1–2 分鐘），沒有證據顯示哪個較佳。\u003c/li>\n\u003cli dir=\"auto\">單一動作對哪一柱肌肉的拉伸，現有資料不足。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" target=\"_blank\">Wikipedia：Erector spinae muscles\u003c/a>（附 com/watch?v=HzkE6QlaDe0\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=HBdNHrt0A7Y\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=HBdNHrt0A7Y\" target=\"_blank\">▶ https://www.youtube.com/watch?v=HBdNHrt0A7Y\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=_LmIrbcutvI\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=_LmIrbcutvI\" target=\"_blank\">▶ https://www.youtube.com/watch?v=_LmIrbcutvI\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=fcnv4gyMzf8\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=fcnv4gyMzf8\" target=\"_blank\">▶ https://www.youtube.com/watch?v=fcnv4gyMzf8\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Gray389_-_Erector_spinae.png/1280px-Gray389_-_Erector_spinae.png\" alt=\"豎脊肌圖。Gray's Anatomy 插圖 Gray389，Henry Gray 著，收錄於 Wikimedia Commons。\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。補入解剖與功能、4 個伸展動作與各一部已開啟的影片頁；標明分支起止點來源不一，以及逐動作圖片未找到。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入起止點表、神經支配（脊神經後支）、伸展療效證據與肩胛提肌文字說明；肩胛提肌與背闊肌影片、逐柱神經分支仍未能確認。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：首次建立。補入解剖與功能、4 個伸展動作與各一部已開啟的影片頁。；補入起止點表、神經支配、伸展療效證據與肩胛提肌文字說明。；整合重複內容，補入 Harvard、HSS 的停留時間與停止條件；影片與逐柱神經分支仍未能確認。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：重新開啟膝碰胸與嬰兒式影片頁確認標題，補入 NASM 嬰兒式說明與再次搜尋結果（仍無專屬試驗）；合併重複的舊紀錄。\u003c/li>\n\u003c/ul>"},{"id":"3f44c43f-2a60-4ac6-afe6-73742d8295c5","parentId":null,"x":339,"y":885,"collapsed":false,"status":"completed","title":"臀中肌","summary":"臀中肌起於髂骨外面、止於大轉子，由臀上神經支配；Healthline列6種動作，影片僅核對標題與作者，療效證據不足。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">臀中肌的起止點與神經支配在多個來源一致，但脊髓節段說法不同（L4–S1 或 L5–S1）。伸展動作各來源有建議，現有資料不足以證明療效；YouTube 影片只用 oEmbed 確認標題與頻道，沒有看完內容。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">想像你坐在椅子上，把右腳踝橫放到左膝上，身體前傾，臀部外側有一條拉緊的線。那條線大致就是臀中肌所在的位置。這一頁先交代它的結構，再逐一看伸展動作與影片。\u003c/p>\n\u003ch3 dir=\"auto\">解剖結構\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003cstrong>起點\u003c/strong>：髂骨外面，位於前臀線與後臀線之間；Wikipedia 另提到臀筋膜（gluteal aponeurosis）。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>止點\u003c/strong>：股骨大轉子的外側面與上面。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>神經\u003c/strong>：臀上神經。脊髓節段各來源不同：有的寫 L4–S1，有的寫 L5–S1。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>作用\u003c/strong>：Physiopedia 摘錄寫它是髖外展的主要作動肌；前部纖維也協助屈曲與內旋。\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">使用者標註圖寫的是「臀中肌（髖側後方）」。我看不到那張圖。以起點在髂骨外面來看，臀中肌位於髖部外側偏後上方，標註位置與此相符，但無法確認圖上標的是哪一點。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 849 254\" width=\"849\" height=\"254\" style=\"max-width: 679px; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); 彎成約 90 度，放在手腕旁，另一腳往後伸直，身體前傾；每次 30 秒、每側 3 組\u003c/td>\n\u003ctd>查不到標題明確對應的影片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>坐姿臀部伸展\u003c/td>\n\u003ctd>坐椅上，一腳踝放在另一膝上，身體前傾；停 3–5 秒，每側 8–10 次，每天 3 回\u003c/td>\n\u003ctd>\u003ca href=\"https://www.youtube.com/watch?v=sgiZGZNjLNw\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=sgiZGZNjLNw\" target=\"_blank\">▶ https://www.youtube.com/watch?v=sgiZGZNjLNw\u003c/a>（〈Seated Glute Medius Stretch〉，Loretta Hogg）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仰臥屈膝伸展\u003c/td>\n\u003ctd>仰躺，抱一膝靠近胸口，輕微左右轉動；每腿 10 次，每天 3 回，停留時間未寫\u003c/td>\n\u003ctd>查不到標題明確對應的影片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>坐姿脊柱扭轉\u003c/td>\n\u003ctd>坐地伸腿，一腳跨過另一腿，上身朝彎膝側轉；停 5–10 秒，每側 10 次\u003c/td>\n\u003ctd>查不到標題明確對應的影片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跪姿側彎\u003c/td>\n\u003ctd>跪姿，一腿向側伸直，手臂弧形越過身體；停 5–10 秒，每側 5 次\u003c/td>\n\u003ctd>查不到標題明確對應的影片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>泡棉滾筒\u003c/td>\n\u003ctd>坐在滾筒上，腳踝放對側膝，朝要放鬆那側傾斜；每側滾 10 次\u003c/td>\n\u003ctd>查不到標題明確對應的影片\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/GRT-Pigeon-Pose.gif\" alt=\"鴿式\">\u003cbr>\n圖說：鴿式（Pigeon Pose），Healthline 動作圖，2025 年上傳，來源頁見〈來源〉。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/400x400_Stretches_for_Sciatica_Pain_Relief_Seated_Glute_Stretch.gif\" alt=\"坐姿臀部伸展\">\u003cbr>\n圖說：坐姿臀部伸展，Healthline，2025 年。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/400x400_9_Stretches_for_Sciatica_Pain_Relief_Knee_to_Opposite_Folder.gif\" alt=\"仰臥屈膝伸展\">\u003cbr>\n圖說：仰臥抱膝伸展，Healthline，2025 年。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/400x400_9_Stretches_for_Sciatica_Pain_Relief_Sitting_Spinal_Stretch.gif\" alt=\"坐姿脊柱扭轉\">\u003cbr>\n圖說：坐姿脊柱扭轉，Healthline，2025 年。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/GRT-2.11.KneelingSideBendStretch.gif\" alt=\"跪姿側彎\">\u003cbr>\n圖說：跪姿側彎，Healthline，2025 年。\u003c/p>\n\u003cp dir=\"auto\">另有三部影片只確認了標題與頻道，沒有逐一對照動作：〈Gluteus Medius and Minimus (Butt) Stretch〉（DrMojo TV，\u003ca href=\"https://www.youtube.com/watch?v=h3AqD40rwH0\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=h3AqD40rwH0\" target=\"_blank\">▶ https://www.youtube.com/watch?v=h3AqD40rwH0\u003c/a>）、〈Gluteus Medius Muscle Stretch〉（Doodle Bros，\u003ca href=\"https://www.youtube.com/watch?v=Uk8NJ4TFh7o\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=Uk8NJ4TFh7o\" target=\"_blank\">▶ https://www.youtube.com/watch?v=Uk8NJ4TFh7o\u003c/a>）、〈Self-Treatment for the Side Butt（Glute Medius Stretches &amp; Exercises）〉（Criticalbench，）。搜尋摘要稱 DrMojo TV 那部每側停 1–2 次呼吸，這是搜尋摘要，我沒有看影片確認。\u003c/p>\n\u003ch3 dir=\"auto\">證據與限制\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">Healthline 說伸展「可能有助」放鬆緊繃的髖部，並引用 Yuce 等人（2024）的肌電圖研究，內容是全髖關節置換術後針對臀中肌的伸展。這是我讀到的引用說明，沒有讀原論文，也看不到它支持疼痛改善。鴿式的引用是 Mears 等人（2018）。這些引用不等於療效證據。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">Healthline 與 Hinge Health 的建議，是由物理治療師撰寫或引述的文章，不是臨床試驗結果。\u003c/li>\n\u003cli dir=\"auto\">各來源的次數與時間不一致：Healthline 寫 3–10 秒或 30 秒，Yahoo 引述的建議是約 5–10 秒、約 10 次。\u003c/li>\n\u003cli dir=\"auto\">持續的臀部或髖部疼痛，Healthline 建議找醫師或物理治療師評估。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">待確認：脊髓節段是 L4–S1 還是 L5–S1；Physiopedia 原頁的起止點措辭；每部影片是否真的示範對應動作；是否有臨床試驗比較伸展與其他處置。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>Healthline 鴿式動作圖\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.healthline.com/health/gluteus-medius-stretch\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.healthline.com/health/gluteus-medius-stretch\u003c/a>\u003cbr>\n用途：鴿式伸展的動作示範 GIF（Healthline，2025 年）。\u003cbr>\n配色：white / gray\u003cbr>\n可套用公式：單腳彎在前、另一腳後伸、身體前傾\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>Healthline 坐姿臀部伸展圖\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.healthline.com/health/gluteus-medius-stretch\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.healthline.com/health/gluteus-medius-stretch\u003c/a>\u003cbr>\n用途：坐姿一腳跨膝、身體前傾的動作 GIF（Healthline，2025 年）。\u003cbr>\n配色：white / gray\u003cbr>\n可套用公式：坐姿腳踝放膝、軀幹前傾\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physio-pedia.com/Gluteus_Medius\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physio-pedia.com/Gluteus_Medius\" target=\"_blank\">Physiopedia：Gluteus Medius\u003c/a>（摘錄不完整）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.wikipedia.org/wiki/Gluteus_medius\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.wikipedia.org/wiki/Gluteus_medius\" target=\"_blank\">Wikipedia：Gluteus medius\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/gluteus-medius-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/gluteus-medius-stretch\" target=\"_blank\">Healthline：Gluteus medius stretch\u003c/a>（動作、次數、圖片）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.yahoo.com/lifestyle/physical-therapist-shares-5-best-155500923.html\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.yahoo.com/lifestyle/physical-therapist-shares-5-best-155500923.html\" target=\"_blank\">Yahoo：5 Best Stretches for Your Glute Medius\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/gluteus-medius-exercises/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/resources/articles/gluteus-medius-exercises/\" target=\"_blank\">Hinge Health：Gluteus medius exercises\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">YouTube：\u003ca href=\"https://www.youtube.com/watch?v=sgiZGZNjLNw\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=sgiZGZNjLNw\" target=\"_blank\">sgiZGZNjLNw\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=h3AqD40rwH0\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=h3AqD40rwH0\" target=\"_blank\">h3AqD40rwH0\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=Uk8NJ4TFh7o\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=Uk8NJ4TFh7o\" target=\"_blank\">Uk8NJ4TFh7o\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=_KZZENfyh2s\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=_KZZENfyh2s\" target=\"_blank\">_KZZENfyh2s\u003c/a>（只讀 oEmbed 標題與頻道）\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。搜尋並整理 4 個伸展動作、圖片與 3 部已開啟頁面的影片；影片內容未驗證。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入起止點與臀上神經支配（含神經根來源不一）、停留時間與療效證據的不足；解剖圖與影片內容仍未確認。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：重新打開三部影片頁，確認標題；頻道與動作細節仍未顯示，跪姿側彎仍無影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：建立；整理 4 個伸展動作、起止點與神經支配、療效證據不足。；再次打開三部影片頁，標題相符但頻道與動作仍未顯示；刪除重複的舊版備註與配色草稿；跪姿側彎仍無影片。\u003c/li>\n\u003c/ul>"},{"id":"cd505fb9-0a02-4911-a677-d3393fe46a7b","parentId":null,"x":-269,"y":885,"collapsed":false,"status":"completed","title":"下後鋸肌","summary":"下後鋸肌起於 T11–L2、止於第 9–12 肋，主要拉下肋骨；五種伸展僅有單一商業網站圖解，仍查不到可驗證的影片。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">下後鋸肌是一片薄而深的背部肌肉，\u003cmark>T11–L2 棘突到第 9–12 肋\u003c/mark>。常見說法是它把下肋往下拉、協助用力呼氣，但實際呼吸角色證據不足。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖\u003c/h3>\n\u003cp dir=\"auto\">這塊肌肉像背後一片斜向外上的薄板。以下依 \u003ca href=\"https://images.radiopaedia.org/articles/serratus-posterior-inferior-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://images.radiopaedia.org/articles/serratus-posterior-inferior-muscle\" target=\"_blank\">Radiopaedia\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/serratus-posterior-muscles\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/serratus-posterior-muscles\" target=\"_blank\">Kenhub\u003c/a>、\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/serratus-posterior-inferior-muscle/24596\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/serratus-posterior-inferior-muscle/24596\" target=\"_blank\">Elsevier\u003c/a> 等搜尋摘要整理（我只讀到搜尋摘要，未逐頁開啟全文）。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>T11–L2 棘突與棘上韌帶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>第 9–12 肋下緣，肋角外側\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>下胸神經腹側支（約 T9–T12，含肋間神經與肋下神經；各來源寫法略有出入）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>血液\u003c/td>\n\u003ctd>肋間動脈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>作用\u003c/td>\n\u003ctd>下拉下肋，協助用力呼氣\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Serratus_posterior.PNG/330px-Serratus_posterior.PNG\" alt=\"下後鋸肌示意圖，Wikimedia Commons，Serratus_posterior.PNG\">\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">以下五種來自同一個商業網站 \u003ca href=\"https://backmusclesolutions.com/blogs/the-ql-blawg/serratus-posterior-inferior-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://backmusclesolutions.com/blogs/the-ql-blawg/serratus-posterior-inferior-stretch\" target=\"_blank\">Back Muscle Solutions\u003c/a>，各自附該頁圖片；網站建議每次保持 15–30 秒、做 3–5 組。這是單一非學術來源，效果沒有獨立驗證。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>動作\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>圖片\u003c/th>\n\u003cth>YouTube\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>側躺過頭伸展\u003c/td>\n\u003ctd>側躺、背微拱，上方手臂伸過頭，15–30 秒\u003c/td>\n\u003ctd>\u003ca href=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_3_480x480.jpg?v=1741367217\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_3_480x480.jpg?v=1741367217\" target=\"_blank\">圖\u003c/a>\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>滾筒伸展\u003c/td>\n\u003ctd>跪姿嬰兒式，手伸到滾筒或球上向前滾，30 秒\u003c/td>\n\u003ctd>\u003ca href=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/lat_stretches_2_480x480.jpg?v=1724512482\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/lat_stretches_2_480x480.jpg?v=1724512482\" target=\"_blank\">圖\u003c/a>\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跪姿扭轉\u003c/td>\n\u003ctd>跪姿、身體略後傾，雙臂交叉於胸前後轉向一側，約 30 秒\u003c/td>\n\u003ctd>\u003ca href=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_1_480x480.jpg?v=1741367218\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_1_480x480.jpg?v=1741367218\" target=\"_blank\">圖\u003c/a>\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跪姿過頭伸展\u003c/td>\n\u003ctd>跪姿、雙臂交叉於胸前，抬向額頭，30 秒\u003c/td>\n\u003ctd>該頁圖片網址在擷取結果中有錯，未採用\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>站姿過頭伸展\u003c/td>\n\u003ctd>站在牆邊，另一手過頭，外側髖部向外推，15–30 秒\u003c/td>\n\u003ctd>\u003ca href=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_2_480x480.jpg?v=1741367218\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_2_480x480.jpg?v=1741367218\" target=\"_blank\">圖\u003c/a>\u003c/td>\n\u003ctd>查不到\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">\u003cstrong>站姿過頭伸展\u003c/strong>\u003cbr>\n\u003cimg src=\"https://cdn.shopify.com/s/files/1/0536/1244/5846/files/serratus_posterior_inferior_stretch_2_480x480.jpg?v=1741367218\" alt=\"站姿過頭伸展\">\u003cbr>\n來源：\u003ca href=\"https://backmusclesolutions.com/blogs/the-ql-blawg/serratus-posterior-inferior-stretch\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://backmusclesolutions.com/blogs/the-ql-blawg/serratus-posterior-inferior-stretch\u003c/a>\u003cbr>\n用途：商業網站的站姿側彎伸展示範圖。\u003cbr>\n配色：gray / white\u003cbr>\n可套用公式：真人示範加簡單背景\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">本次沒有成功開啟任何一部可確認是下後鋸肌伸展的 YouTube 影片，所以不寫影片網址。Back Muscle Solutions 頁面沒有嵌入影片，只有頻道連結；Wikipedia 該條目也沒有 YouTube 連結。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">不確定處\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">Physio-pedia 指出，因缺乏定論性證據，上、下後鋸肌在呼吸中的作用仍不清楚。另有搜尋結果提到 Richard Finn 的下後鋸肌影片與 Allison Denney（Rebel Massage）的教學，但我沒有取得網址或打開過，需要使用者自行到 YouTube 搜尋後再確認。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>下後鋸肌解剖示意圖\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Serratus_posterior_inferior_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Serratus_posterior_inferior_muscle\u003c/a>\u003cbr>\n用途：Wikipedia 條目主圖，顯示後鋸肌位置。\u003cbr>\n配色：red / white\u003cbr>\n可套用公式：解剖線稿加肌肉標色\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://images.radiopaedia.org/articles/serratus-posterior-inferior-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://images.radiopaedia.org/articles/serratus-posterior-inferior-muscle\" target=\"_blank\">Radiopaedia\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/serratus-posterior-muscles\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/serratus-posterior-muscles\" target=\"_blank\">Kenhub\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/serratus-posterior-inferior-muscle/24596\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/serratus-posterior-inferior-muscle/24596\" target=\"_blank\">Elsevier\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Serratus_posterior_inferior_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Serratus_posterior_inferior_muscle\" target=\"_blank\">Wikipedia\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://physio-pedia.com/Serratus_posterior\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://physio-pedia.com/Serratus_posterior\" target=\"_blank\">Physio-pedia\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://backmusclesolutions.com/blogs/the-ql-blawg/serratus-posterior-inferior-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://backmusclesolutions.com/blogs/the-ql-blawg/serratus-posterior-inferior-stretch\" target=\"_blank\">Back Muscle Solutions\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cimg src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Serratus_posterior_inferior_muscle_back3.png/330px-Serratus_posterior_inferior_muscle_back3.png\" alt=\"Serratus posterior inferior（紅色）從背面觀，Wikimedia Commons，擷取自英文維基百科條目\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理，補上位置、起止點、神經、作用、痠痛與伸展概況；YouTube 影片因無法驗證而未收錄。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上五種伸展的做法與圖片連結，並說明影片查證結果（無可驗證的免費伸展影片）。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：首次整理，補上位置、起止點、神經、作用、痠痛與伸展概況。；補上五種伸展的做法與圖片連結，並說明影片查證結果。；再查 YouTube 影片，仍無法打開驗證任何伸展影片；新增 ABMP 節目與 Tune Up Fitness（403）線索，影片欄標為未驗證。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：第三輪搜尋 YouTube 伸展影片仍無可驗證結果，PubMed 頁因 cookie 錯誤無法讀取；合併重複的舊紀錄，並註明其他肌肉議題未處理。\u003c/li>\n\u003c/ul>"},{"id":"e51fdea5-24d2-40f7-bb60-55dfc380ffc9","parentId":null,"x":35,"y":885,"collapsed":false,"status":"completed","title":"腹外斜肌","summary":"腹外斜肌起自第5–12肋外面，止於髂嵴前半、恥骨與白線；單側使軀幹向對側旋轉，雙側屈曲；伸展動作有來源，但影片與逐動作圖片未能查證。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">腹外斜肌是腹壁最外層的斜向肌肉。多數來源採「第5–12肋」說法，但 Radiopaedia 寫「下八根肋骨」，肋骨編號各來源略有出入。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">解剖構造\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003cth>來源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>第5–12肋外面（Radiopaedia 寫下八根肋骨外面）\u003c/td>\n\u003ctd>Kenhub、McGill、Radiopaedia\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>髂前上棘與髂嵴前半、恥骨嵴、恥骨結節、白線\u003c/td>\n\u003ctd>Elsevier、Radiopaedia\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>T7–T12 脊神經前支；Radiopaedia 另提肋下神經；Kenhub 提及髂腹下神經（L1）的感覺支配\u003c/td>\n\u003ctd>Kenhub、Radiopaedia\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>作用\u003c/td>\n\u003ctd>雙側收縮使軀幹屈曲、壓低肋骨助呼氣、維持腹內壓；單側收縮使軀幹向對側旋轉\u003c/td>\n\u003ctd>Kenhub\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 833 308\" width=\"833\" height=\"308\" style=\"max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); --_fm: var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace); font-style: normal; font-variant: normal; font-size-adjust: none; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: normal; font-stretch: normal; font-size: 16px; line-height: normal; letter-spacing: normal; word-spacing: normal; text-transform: none; direction: ltr; font-family: var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emo e=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">雙側收縮使軀幹屈曲\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-318.75,80)\">\u003crect x=\"-113.25\" y=\"-24\" width=\"226.51\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">單側收縮使軀幹向對側旋轉\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">腹外斜肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">「旋轉向對側」與前版「單側旋轉與側屈」略有不同。側屈作用在我查到的來源摘要中未獲確認，標為待確認。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">以下動作依據 Hinge Health 的文字說明。該頁面沒有逐動作圖片，也沒有 YouTube 連結。\u003c/p>\n\u003ch4 dir=\"auto\">站姿側彎（含手臂上伸）\u003c/h4>\n\u003cp dir=\"auto\">雙腳與肩同寬，一手沿腿滑向膝蓋，另一手越過頭頂向側邊延伸，正側方彎曲，深呼吸後換邊。Fitwill 建議每側停留 15–30 秒。圖片：未取得可靠的單一圖片網址。影片：未查到並實際開啟，故不附。\u003c/p>\n\u003ch4 dir=\"auto\">坐姿軀幹旋轉\u003c/h4>\n\u003cp dir=\"auto\">坐椅子，雙腳平放、雙臂交叉於胸前，由腰部帶動頭與胸轉向一側，下半身朝前，再換邊。圖片與影片：同上，未查到。\u003c/p>\n\u003ch4 dir=\"auto\">仰臥膝蓋擺動／仰臥旋轉伸展\u003c/h4>\n\u003cp dir=\"auto\">仰躺屈膝，雙膝併攏倒向一側再回中，換邊；或將一膝拉過身體，另一手向外伸展，上背貼地。圖片與影片：未查到。\u003c/p>\n\u003ch4 dir=\"auto\">開書式旋轉、穿針式\u003c/h4>\n\u003cp dir=\"auto\">側臥或四足跪姿，帶動胸腔旋轉。這兩項偏胸椎旋轉，對腹外斜肌的針對性來源未說明。圖片與影片：未查到。\u003c/p>\n\u003ch3 dir=\"auto\">痠痛與限制\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">前版寫「痠痛多為 DOMS 或拉傷」，本次未查到來源支持，視為待確認，不當作已查證事實。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003col>\n\u003cli dir=\"auto\">各伸展動作對應的實際開啟過的 YouTube 影片（本次搜尋未回傳任何 YouTube 連結，我不憑印象寫網址）。\u003c/li>\n\u003cli dir=\"auto\">腹外斜肌是否有明確的側屈作用。\u003c/li>\n\u003cli dir=\"auto\">第5–12肋與「下八根肋骨」的差異。\u003c/li>\n\u003c/ol>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">不同看法與限制\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cp dir=\"auto\">本次無新增內容。\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/external-abdominal-oblique-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/external-abdominal-oblique-muscle\" target=\"_blank\">Kenhub：外腹斜肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-abdomen/external-abdominal-oblique-muscle/21869\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-abdomen/external-abdominal-oblique-muscle/21869\" target=\"_blank\">Elsevier 解剖：外腹斜肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://radiopaedia.org/articles/45491\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://radiopaedia.org/articles/45491\" target=\"_blank\">Radiopaedia：外腹斜肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://audilab.bme.mcgill.ca/~funnell/sprojects3d/anatomy3d/Female_Pelvis/HTML/external_oblique_muscle_d.htm\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://audilab.bme.mcgill.ca/~funnell/sprojects3d/anatomy3d/Female_Pelvis/HTML/external_oblique_muscle_d.htm\" target=\"_blank\">McGill 解剖頁\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/oblique-stretches-back/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/resources/articles/oblique-stretches-back/\" target=\"_blank\">Hinge Health：腹斜肌伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://fitwill.app/exercise/8513/standing-side-bend-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://fitwill.app/exercise/8513/standing-side-bend-stretch/\" target=\"_blank\">Fitwill：站姿側彎\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.youtube.com/watch?v=BcHQwt9nNLM\" class=\"vam-video-link\" rel=\"noopener nofollow\" aria-label=\"https://www.youtube.com/watch?v=BcHQwt9nNLM\" target=\"_blank\">▶ https://www.youtube.com/watch?v=BcHQwt9nNLM\u003c/a>\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Illu_trunk_muscles.jpg/1280px-Illu_trunk_muscles.jpg\" alt=\"Muscles of the trunk，Illu_trunk_muscles.jpg，維基共享資源，作者與年份未查到\">\u003c/p>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理起止點、神經、動作與一部已開啟的影片；痠痛原因待補。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：首次整理起止點、神經、動作與一部影片。；補上痠痛成因（DOMS 與拉傷，來自搜尋摘要）與伸展圖文、影片連結。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：重新開啟維基與影片頁核對起止點、神經與動作；整合腹內斜肌筆記 1；說明每個動作各附影片目前做不到。\u003c/li>\n\u003cli dir=\"auto\">2026-11-25：重新核對影片（仍只有標題）並補入 Hinge Health 的正側方彎與靠牆版本提示；搜尋未找到新的可開啟影片，其餘議題尚未研究。\u003c/li>\n\u003c/ul>"},{"id":"ceb64408-98de-4b7c-aee9-f516b56e7ebe","parentId":null,"x":643,"y":885,"collapsed":false,"status":"completed","title":"腹內斜肌","summary":"腹內斜肌起自胸腰筋膜、髂嵴、腹股溝韌帶，同側旋轉與側屈、雙側壓縮腹腔；解剖已有來源，但伸展動作的實際 YouTube 影片本次未能開啟查證。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">腹內斜肌是腹壁側方、位於腹外斜肌深層的肌肉。單側收縮使軀幹往同側旋轉與側屈，雙側收縮則壓縮腹腔、屈曲軀幹並協助用力吐氣。本次查到的伸展動作都以「斜肌」泛稱，沒有來源證明哪個動作專門伸展腹內斜肌。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">想像你側躺在瑜伽墊上，一手向上、向後打開，胸口轉向天花板。這時被拉長的，是從髂嵴一路連到肋骨下緣的那片斜向纖維。下面先交代這片肌肉長什麼樣子，再看各個伸展動作。\u003c/p>\n\u003ch3 dir=\"auto\">解剖構造\u003c/h3>\n\u003cp dir=\"auto\">各來源對起止點大致一致：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>胸腰筋膜、髂嵴、腹股溝韌帶（Elsevier、Kenhub、Radiopaedia 列法略有差異）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>第 10–12 肋下緣、白線、恥骨區（經聯合腱）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>下位肋間神經、髂腹下神經、髂腹股溝神經\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>單側動作\u003c/td>\n\u003ctd>同側旋轉、同側側屈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>雙側動作\u003c/td>\n\u003ctd>屈曲軀幹、壓縮腹腔、協助用力吐氣\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">神經節段各來源不同：Radiopaedia 寫 T7–T12；Kenhub 與 Wikipedia 寫 T7–T11 加肋下神經 T12，Wikipedia 另列髂腹下與髂腹股溝神經（L1）。Wikipedia 稱它與對側腹外斜肌合作，所以被稱為「同側旋轉肌」。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 769 326\" width=\"769\" height=\"326\" style=\"max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); --_fm: var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace); font-style: normal; font-variant: normal; font-size-adjust: none; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: normal; font-stretch: normal; font-size: 16px; line-height: normal; letter-spacing: normal; word-spacing: normal; text-transform: none; direction: ltr; font-family: var(-
