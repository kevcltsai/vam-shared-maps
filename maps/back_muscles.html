n\u003cp dir=\"auto\">棘下肌位於肩胛骨後方的棘下窩，是四條旋轉肌袖肌肉之一，主要做肩關節外旋並穩定肩關節。常見的伸展是橫胸伸展與睡姿伸展；\u003cmark>橫胸伸展\u003c/mark>對內旋角度的改善證據較明確，睡姿伸展則不一致，兩者都沒有直接針對「棘下肌痠痛」的試驗。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">「肩胛骨後方」的位置與解剖資料相符。這是合理的伸展對象，但痠痛是否真的來自棘下肌，現有資料不足以判斷。\u003c/li>\n\u003cli dir=\"auto\">橫胸伸展的證據較強。McClure 等人 2007 年（《JOSPT》37(3):108-114）把 54 人隨機分組、做 4 週：橫胸組內旋角度增加約 20.0°±12.9°，顯著高於對照組的 5.9°±9.4°（p = 0.009）。\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/17388357/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/17388357/\" target=\"_blank\">McClure 2007 摘要整理\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">睡姿伸展的證據不一致。該試驗睡姿組增加 12.4°±10.4°，與對照組（p = 0.586）及橫胸組（p = 0.148）都沒有顯著差異；作者認為樣本小可能是原因。\u003c/li>\n\u003cli dir=\"auto\">這些結果測的是活動角度，不是痠痛。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">解剖與功能\u003c/h3>\n\u003cp dir=\"auto\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Infraspinatus.png\" alt=\"棘下肌示意圖（Infraspinatus.png，Engusz 上傳、Arcadian 更新，2007，Wikimedia Commons，GFDL／CC BY-SA 3.0）\">\u003c/p>\n\u003cp dir=\"auto\">圖片來源頁：\u003ca href=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" target=\"_blank\">Wikimedia Commons\u003c/a>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>肩胛骨棘下窩，部分纖維來自覆蓋它的棘下筋膜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>肱骨大結節中間面，部分資料加註肩關節囊\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>手臂外旋、穩定盂肱關節\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>肩胛上神經（C5–C6）；有資料提到可能另有腋神經分支\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>血供\u003c/td>\n\u003ctd>肩胛上動脈與旋肩胛動脈\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">各來源在這些重點上大致一致，差異主要在措辭，例如棘下窩是寫「內側四分之三」還是整個窩。來源：\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK513255/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK513255/\" target=\"_blank\">StatPearls\u003c/a>、\u003ca href=\"https://www.physio-pedia.com/Infraspinatus?lang=en\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physio-pedia.com/Infraspinatus?lang=en\" target=\"_blank\">Physio-pedia\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/infraspinatus-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/infraspinatus-muscle\" target=\"_blank\">Kenhub\u003c/a>。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">影片查證範圍：下列 YouTube 頁面只取得標題與搜尋摘要，頻道、示範者與動作細節未逐一核實。\u003c/p>\n\u003ch4 dir=\"auto\">停留時間與次數\u003c/h4>\n\u003cp dir=\"auto\">多個健身與運動訓練網頁建議每次停 30 秒、做 3–5 次；也有 20–30 秒、每側 2–3 次，或 30–60 秒的寫法。這是常見慣例，不是經研究確立的劑量。橫胸伸展時手臂維持在肩膀高度或以下；睡姿伸展時若前肩有感覺就該調整。\u003c/p>\n\u003ch4 dir=\"auto\">1. 橫胸伸展（cross-body）\u003c/h4>\n\u003cp dir=\"auto\">手臂橫過胸前，用另一手把它往身體方向帶。\u003ca href=\"https://theprehabguys.com/vimeo-video/sleeper-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://theprehabguys.com/vimeo-video/sleeper-stretch/\" target=\"_blank\">The Prehab Guys\u003c/a> 稱它能針對後側旋轉肌袖（棘下肌與小圓肌），並指出常被做錯；物理治療文獻也提到，這個動作不易固定肩胛骨。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">標題為「8 Easy Ways to Stretch Your Infraspinatus and Teres Minor」，搜尋摘要稱第一式是橫胸伸展。\u003c/p>\n\u003ch4 dir=\"auto\">2. 睡姿伸展（sleeper stretch）\u003c/h4>\n\u003cp dir=\"auto\">側躺、肩膀在下，用另一手把前臂往地面方向壓，使肩內旋。搜尋摘要稱此影片由 Dr. Colin 示範睡姿伸展與毛巾內旋伸展。來源：\u003ca href=\"https://www.healthline.com/health/sleeper-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/sleeper-stretch\" target=\"_blank\">Healthline\u003c/a>。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">3. 棘下肌自我伸展（通用）\u003c/h4>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">標題為「Infraspinatus Muscle Stretch」，搜尋摘要稱是物理治療取向的自我伸展說明；具體動作未核實。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">這次沒有找到可確認授權與內容的伸展動作圖，所以只放解剖圖。影片動作請先自行看過，再決定是否照做。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">限制與待確認\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">痠痛是否來自棘下肌，還是頸肩其他肌群或關節問題？現有資料不足。\u003c/li>\n\u003cli dir=\"auto\">伸展對「痠痛」的效果：已查到的試驗只測內旋角度，且 McClure 2007 的受試者來自一般人群、樣本小，不一定適用於過頭運動員。\u003c/li>\n\u003cli dir=\"auto\">較新的試驗（2025 年青少年棒球員，橫胸單做或合併睡姿伸展皆有效降低後肩緊繃）支持橫胸伸展，但我只看到搜尋摘要。\u003c/li>\n\u003cli dir=\"auto\">三部影片的實際動作、示範者資格與時間長度未核實。\u003c/li>\n\u003cli dir=\"auto\">疼痛持續、夜間痛或手臂麻木時，來源未提供處置建議，應由醫療人員評估。\u003c/li>\n\u003cli dir=\"auto\">先前要求補的提肩胛肌、背闊肌兒童式側伸影片不屬於棘下肌，本頁未處理。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>棘下肌解剖圖（Infraspinatus.png）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://commons.wikimedia.org/wiki/File:Infraspinatus.png\u003c/a>\u003cbr>\n用途：棘下肌位置示意圖，Wikimedia Commons，GFDL／CC BY-SA 3.0。\u003cbr>\n配色：red / white\u003cbr>\n可套用公式：肌肉標示紅色＋淺色骨骼背景\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK513255/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK513255/\" target=\"_blank\">StatPearls：棘下肌解剖\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physio-pedia.com/Infraspinatus?lang=en\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physio-pedia.com/Infraspinatus?lang=en\" target=\"_blank\">Physio-pedia：Infraspinatus\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/infraspinatus-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/infraspinatus-muscle\" target=\"_blank\">Kenhub：infraspinatus muscle\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/sleeper-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/sleeper-stretch\" target=\"_blank\">Healthline：sleeper stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://theprehabguys.com/vimeo-video/sleeper-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://theprehabguys.com/vimeo-video/sleeper-stretch/\" target=\"_blank\">The Prehab Guys：sleeper stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/17388357/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/17388357/\" target=\"_blank\">McClure 2007（PubMed）\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://chs.uky.edu/sites/default/files/2023-12/Oyama_2010_Effects%20of%20non-assisted%20posterior%20shoulder%20stretches%20on%20shoulder%20range%20of%20motion%20among%20collegiate%20baseball%20players.pdf\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://chs.uky.edu/sites/default/files/2023-12/Oyama_2010_Effects%20of%20non-assisted%20posterior%20shoulder%20stretches%20on%20shoulder%20range%20of%20motion%20among%20collegiate%20baseball%20players.pdf\" target=\"_blank\">Oyama 2010 大學棒球員後肩伸展\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/41141136/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/41141136/\" target=\"_blank\">Cross-Body Versus Combined Sleeper Stretch RCT（PubMed）\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://commons.wikimedia.org/wiki/File:Infraspinatus.png\" target=\"_blank\">Wikimedia Commons：Infraspinatus.png\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。補入解剖資料、兩種主要伸展與三部影片；影片內容與動作圖片仍待核實。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入 McClure 2007 具體數據、停留時間慣例與較新試驗；刪除重複的圖片備註；仍待核實影片內容與痠痛療效。\u003c/li>\n\u003c/ul>"},{"id":"e3cafd1e-f493-4b09-93fc-d6002971c3ca","parentId":null,"x":491,"y":845,"collapsed":false,"status":"completed","title":"背闊肌","summary":"背闊肌是起於下胸椎、腰背筋膜、髂嵴、止於肱骨的大肌；伸展約停 30 秒、以舒適為限，專屬療效證據不足。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">「背闊肌」是一塊肌肉，不是伸展動作；它從中下背外側包到上臂，所以下背外側的緊繃感可能與它有關，但現有資料無法確認個別痠痛一定來自這塊肌肉。伸展停在舒適範圍，不要拉到痛。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">停留時間約 30 秒是合理的起點。針對背闊肌的臨床試驗沒有查到；最接近的是腿後肌的隨機試驗，30 秒與 60 秒的效果沒有顯著差異（\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/8066111/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/8066111/\" target=\"_blank\">PubMed 1994\u003c/a>）。這是外推，不是背闊肌的直接證據。\u003c/li>\n\u003cli dir=\"auto\">實務建議並不一致。NASM 球式伸展寫 20–30 秒，Peloton 文章寫 30–60 秒，NASM 兒童式頁寫 1–2 分鐘。\u003c/li>\n\u003cli dir=\"auto\">筆記原本寫的「中下背外側緊繃的伸展動作」，描述的是痠痛位置，不是動作名稱。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">解剖與功能\u003c/h3>\n\u003cp dir=\"auto\">想像你把手臂高舉過頭，再慢慢往身體兩側下壓。這時從腰側、肋骨一路拉到腋下的那片寬大肌肉，就是背闊肌。\u003c/p>\n\u003cp dir=\"auto\">起點很寬：下胸椎棘突、腰背筋膜、髂嵴與下位肋骨，有些人還附著在肩胛骨下角。各來源寫法不一：有的列 T7–T12 與 L1–L5（經腰背筋膜），有的列到 T7–S5；肋骨則是第 9–12 肋或「下 3–4 根」。這個差異目前沒有定論。\u003c/p>\n\u003cp dir=\"auto\">肌腱螺旋繞過大圓肌，止於肱骨結節間溝底。肩關節動作是伸展、內收與內旋；神經支配是胸背神經（thoracodorsal nerve），脊髓節段 C6–C8，來自臂神經叢後束（\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/latissimus-dorsi-muscle/20795\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/latissimus-dorsi-muscle/20795\" target=\"_blank\">Elsevier\u003c/a>、\u003ca href=\"https://rad.washington.edu/muscle-atlas/latissimus-dorsi\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://rad.washington.edu/muscle-atlas/latissimus-dorsi\" target=\"_blank\">UW Muscle Atlas\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/latissimus-dorsi-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/latissimus-dorsi-muscle\" target=\"_blank\">Kenhub\u003c/a>、\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK537216/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK537216/\" target=\"_blank\">StatPearls\u003c/a>）。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 690 336\" width=\"690\" height=\"336\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emo =\"M-41.81,0C-67.81,0 -67.81,-80 -93.81,-80\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-209.19,-80C-227.19,-80 -227.19,-136 -245.19,-136\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-209.19,-80C-227.19,-80 -227.19,-80 -245.19,-80\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-209.19,-80C-227.19,-80 -227.19,-24 -245.19,-24\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-151.5,-80)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩關節動作\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-279.07,-136)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">伸展\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-279.07,-80)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">內收\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-279.07,-24)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">內旋\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-3\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-4,#e45756)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,80 -93.81,80\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-193.32,80C-211.32,80 -211.32,52 -229.32,52\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-193.32,80C-211.32,80 -211.32,108 -229.32,108\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-143.56,80)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">神經支配\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-279.07,52)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">胸背神經\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-272.86,108)\">\u003crect x=\"-43.54\" y=\"-24\" width=\"87.09\" height=\"48\" fill=\"var(--pele-series-4,#e45756)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-4,#e45756)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">C6–C8\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">背闊肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">與豎脊肌的關係：背闊肌經腰背筋膜附著於脊柱，而豎脊肌是脊柱兩側的伸直肌群，兩者位置相鄰（見 \u003csup class=\"footnote-ref\" id=\"fnref-1-b9fadfedf865e7fe\">\u003ca class=\"footnote-link\" href=\"#fn-1-b9fadfedf865e7fe\" rel=\"noopener nofollow\" target=\"_blank\">[1]\u003c/a>\u003c/sup>）。下背外側痠痛究竟來自哪一塊，現有資料不足以判斷。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">以下動作整理自 Healthline 等頁面。YouTube 影片本次沒有再開啟確認，原筆記已開啟的頁面只確認到標題。\u003c/p>\n\u003ch4 dir=\"auto\">1. 兒童式側伸（Child's Pose 側向）\u003c/h4>\n\u003cp dir=\"auto\">細節：雙手先往前走，再「走」到左右一側，髖部留在後方，伸展的是對側背闊肌。Hinge Health 的物理治療師文章列有「Child's Pose with Side Bend」，Athletico 稱之為「Lateral Child's Pose」，OrthoCarolina 的伸展手冊也有同一變化式（\u003ca href=\"https://www.hingehealth.com/gb/en/resources/articles/latissimus-dorsi-pain/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/gb/en/resources/articles/latissimus-dorsi-pain/\" target=\"_blank\">Hinge Health\u003c/a>、\u003ca href=\"https://athletico.com/?p=21314\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://athletico.com/?p=21314\" target=\"_blank\">Athletico\u003c/a>）。Connecticut Children's 的居家運動單建議每次停 20 秒、做 3 組。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 164 352\" width=\"164\" height=\"352\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M81.56,56L81.56,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M81.56,104L78.2,96L84.92,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M81.56,152L81.56,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M81.56,200L78.2,192L84.92,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M81.56,248L81.56,289\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M81.56,296L78.2,288L84.92,288Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,32)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">雙手先往前走\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,128)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">再走到左右一側\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,224)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髖部留在後方\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(81.56,320)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">伸展對側背闊肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2019/06/childs-pose.gif\" alt=\"兒童式｜Healthline\">\u003c/p>\n\u003cp dir=\"auto\">影片：本次搜尋沒有找到可打開確認的 YouTube 影片，所以不附，以免亂放。\u003c/p>\n\u003ch4 dir=\"auto\">2. 跪姿球（或椅子）伸展\u003c/h4>\n\u003cp dir=\"auto\">細節：右手放在球上、拇指朝上，把球往前滾，停 20–30 秒，每側 2–3 輪。NASM 的靜態版同樣是 20–30 秒。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 227 352\" width=\"227\" height=\"352\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M113.32,56L113.32,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M113.32,104L109.96,96L116.68,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M113.32,152L113.32,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M113.32,200L109.96,192L116.68,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M113.32,248L113.32,289\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M113.32,296L109.96,288L116.68,288Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(113.32,32)\">\u003crect x=\"-105.32\" y=\"-24\" width=\"210.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">右手放在球上、拇指朝上\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(113.32,128)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">把球往前滾\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(113.32,224)\">\u003crect x=\"-61.87\" y=\"-24\" width=\"123.74\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">停 20–30 秒\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(113.32,320)\">\u003crect x=\"-60.04\" y=\"-24\" width=\"120.09\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">每側 2–3 輪\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2019/06/Exercise-ball-stretch.gif\" alt=\"跪姿球伸展｜Healthline\">\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片標題為「Lat Stretch Exercise Demo」，只確認到是背闊肌伸展，不確定是否使用球。\u003c/p>\n\u003ch4 dir=\"auto\">3. 牆面背闊肌伸展\u003c/h4>\n\u003cp dir=\"auto\">細節：站在離牆約 2 英尺（約 60 公分）處，髖部後推、雙掌貼牆在髖高，Healthline 寫可停到 1 分鐘。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片標題為「Exercise Tips: Wall Lat Stretch」，頻道未確認。\u003c/p>\n\u003ch4 dir=\"auto\">4. 低單槓懸掛式伸展\u003c/h4>\n\u003cp dir=\"auto\">細節：只需要一根低單槓。我沒找到文字版步驟，只能依影片標題判斷是以單槓做背闊肌伸展。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">頁面標題帶有 Antranik 字樣，頻道由標題推斷。\u003c/p>\n\u003ch4 dir=\"auto\">5. 主動孤立伸展（Active Isolated Stretch）\u003c/h4>\n\u003cp dir=\"auto\">細節：Healthline 的主動地板伸展是跪姿、短暫停留重複 10 次再換邊；是否等同下列影片的做法，現有資料不足。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2019/06/Active-floor-stretch.gif\" alt=\"主動地板伸展｜Healthline\">\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch3 dir=\"auto\">限制與待確認\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">多個來源都說伸展只做到舒適範圍；有疼痛時應請醫師評估（\u003ca href=\"https://www.healthline.com/health/lat-stretches\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/lat-stretches\" target=\"_blank\">Healthline\u003c/a>、\u003ca href=\"https://www.medicalnewstoday.com/articles/321623.php\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.medicalnewstoday.com/articles/321623.php\" target=\"_blank\">Medical News Today\u003c/a>）。Healthline 建議肌肉溫熱時做，每週至少 3 次。「伸展能降低受傷風險」屬一般性宣稱，沒有查到臨床證據。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">待確認\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">兒童式側伸的 YouTube 影片：本次未找到，可到 Hinge Health 或 Athletico 頻道再找。\u003c/li>\n\u003cli dir=\"auto\">各影片的實際動作、停留時間與頻道：頁面文字被截斷，未核對。\u003c/li>\n\u003cli dir=\"auto\">提肩胛肌伸展：本次未查，現有資料不足。\u003c/li>\n\u003cli dir=\"auto\">起點的脊椎範圍與肋骨數：各來源不一致，尚未決定採哪一種。\u003c/li>\n\u003cli dir=\"auto\">背闊肌專屬的停留時間與療效試驗：未查到，目前只有腿後肌試驗的外推。\u003c/li>\n\u003cli dir=\"auto\">動作圖片：目前只有 Healthline 的 GIF，授權未逐一確認。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>兒童式（Healthline）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://www.healthline.com/health/lat-stretches\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.healthline.com/health/lat-stretches\u003c/a>\u003cbr>\n用途：兒童式動態圖，可延伸為雙手向側邊走的背闊肌伸展。\u003cbr>\n配色：white / gray\u003cbr>\n可套用公式：跪姿後坐＋雙手前伸再移向一側\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/lat-stretches\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/lat-stretches\" target=\"_blank\">Healthline：Lat stretches\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.medicalnewstoday.com/articles/321623.php\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.medicalnewstoday.com/articles/321623.php\" target=\"_blank\">Medical News Today\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nasm.org/resource-center/exercise-library/static-latissimus-dorsi-ball-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nasm.org/resource-center/exercise-library/static-latissimus-dorsi-ball-stretch\" target=\"_blank\">NASM：Static Latissimus Dorsi Ball Stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.connecticutchildrens.org/sites/default/files/2026-04/pdf_sportsmed_back-stretching-home-exercise-program.pdf\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.connecticutchildrens.org/sites/default/files/2026-04/pdf_sportsmed_back-stretching-home-exercise-program.pdf\" target=\"_blank\">Connecticut Children's 居家運動單 PDF\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/gb/en/resources/articles/latissimus-dorsi-pain/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/gb/en/resources/articles/latissimus-dorsi-pain/\" target=\"_blank\">Hinge Health：Latissimus dorsi pain\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://athletico.com/?p=21314\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://athletico.com/?p=21314\" target=\"_blank\">Athletico：Lateral Child's Pose\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/8066111/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/8066111/\" target=\"_blank\">PubMed：靜態伸展時間與腿後肌柔軟度（1994）\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/latissimus-dorsi-muscle/20795\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/latissimus-dorsi-muscle/20795\" target=\"_blank\">Elsevier\u003c/a>、\u003ca href=\"https://rad.washington.edu/muscle-atlas/latissimus-dorsi\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://rad.washington.edu/muscle-atlas/latissimus-dorsi\" target=\"_blank\">UW Muscle Atlas\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/latissimus-dorsi-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/latissimus-dorsi-muscle\" target=\"_blank\">Kenhub\u003c/a>、\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK537216/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK537216/\" target=\"_blank\">StatPearls\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">相鄰筆記：豎脊肌 \u003csup class=\"footnote-ref\" id=\"fnref-1-1-b9fadfedf865e7fe\">\u003ca class=\"footnote-link\" href=\"#fn-1-b9fadfedf865e7fe\" rel=\"noopener nofollow\" target=\"_blank\">[1-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003c/ul>\n\u003ch4 dir=\"auto\">先前研究的來源\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">搜尋結果列出但內容未逐項核對：\u003ca href=\"https://www.hingehealth.com/resources/articles/lat-stretches/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hingehealth.com/resources/articles/lat-stretches/\" target=\"_blank\">Hinge Health\u003c/a>、\u003ca href=\"https://brookbushinstitute.com/video/latissimus-dorsi-and-erector-spinae-static-stretch-childs-pose\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://brookbushinstitute.com/video/latissimus-dorsi-and-erector-spinae-static-stretch-childs-pose\" target=\"_blank\">Brookbush 兒童式影片頁\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。修正原本「背闊肌＝伸展動作」的理解，改為肌肉解剖加伸展清單；補上 4 部已開啟的 YouTube 影片頁與 Healthline 動作圖。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上兒童式側伸的文字來源、停留時間證據（腿後肌試驗外推）與待確認清單；仍未找到兒童式側伸與提肩胛肌影片。\u003c/li>\n\u003c/ul>\n\n\n\u003csection class=\"footnotes\">\u003chr>\u003col>\n\u003cli id=\"fn-1-b9fadfedf865e7fe\" dir=\"auto\">\u003cp>豎脊肌\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-b9fadfedf865e7fe\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-1-b9fadfedf865e7fe\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003c/ol>\u003c/section>"},{"id":"99caad27-bc30-4e1a-bcf1-bd92a39f0b30","parentId":null,"x":-117,"y":845,"collapsed":false,"status":"completed","title":"豎脊肌","summary":"豎脊肌是脊柱兩側的伸直肌群，受脊神經後支支配；伸展證據僅低至中等品質，肩胛提肌等影片仍未能開啟確認。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">豎脊肌（erector spinae）是沿脊柱兩側從骨盆延伸到顱底的肌群，主要功能是伸直脊柱，由脊神經後支支配。下背痠痛時，常見做法是用低強度的屈曲、旋轉類伸展放鬆它；\u003cmark>伸展的臨床證據僅為低至中等品質\u003c/mark>，且多針對腿後肌或坐骨神經滑動伸展，沒有直接針對豎脊肌的試驗。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">它的主要工作是伸直脊柱。雙側收縮使脊柱伸直，單側收縮造成側彎與旋轉。\u003csup class=\"footnote-ref\" id=\"fnref-1-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[1]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">伸展證據偏薄。2019 年 slump 伸展的系統性回顧認為，對疼痛的證據品質為極低到中等，對失能則為極低。\u003csup class=\"footnote-ref\" id=\"fnref-2-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-2-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[2]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">2024 年一篇腿後肌伸展的統合分析，疼痛的標準化平均差為 −0.72（95% 信賴區間 −1.35 至 −0.09），但 I² 為 89%，各試驗差異很大。\u003csup class=\"footnote-ref\" id=\"fnref-3-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-3-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[3]\u003c/a>\u003c/sup>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">解剖與功能\u003c/h3>\n\u003cp dir=\"auto\">想像你站在解剖圖前，背部皮膚與淺層肌肉都已掀開：脊柱兩側各有一條粗厚的縱向肌束，由骨盆一路爬到頭骨底部。這就是豎脊肌。它到底怎麼分工？\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Gray389_-_Erector_spinae.png/1280px-Gray389_-_Erector_spinae.png\" alt=\"豎脊肌圖。Gray's Anatomy 插圖 Gray389，Henry Gray 著，收錄於 Wikimedia Commons。\">\u003c/p>\n\u003cp dir=\"auto\">它分成三條柱：外側的髂肋肌（iliocostalis）、中間最大的最長肌（longissimus）、內側的棘肌（spinalis），英文記法是「I Love Spine」。\u003csup class=\"footnote-ref\" id=\"fnref-4-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-4-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[4]\u003c/a>\u003c/sup> 雙側同時收縮，使頭、頸與腰胸椎伸直；單側收縮，則造成側彎與同側旋轉。\u003csup class=\"footnote-ref\" id=\"fnref-1-1-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[1-1]\u003c/a>\u003c/sup>\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 498 140\" width=\"498\" height=\"140\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"mindmap\">\u003cg transform=\"translate(248.94,70)\">\u003cg class=\"pele-branch pele-section-0\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-1,#4c78a8)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M41.81,0C67.81,0 67.81,0 93.81,0\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(167.38,0)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">髂肋肌（外側）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,-38 -93.81,-38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-167.38,-38)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">最長肌（中間）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,38 -93.81,38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-159.44,38)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">棘肌（內側）\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">豎脊肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ch4 dir=\"auto\">起止點與神經支配\u003c/h4>\n\u003cp dir=\"auto\">Wikipedia 本次查到的資料如下，神經與血管只在整體層級列出：\u003csup class=\"footnote-ref\" id=\"fnref-1-2-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[1-2]\u003c/a>\u003c/sup>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>結構\u003c/th>\n\u003cth>起點\u003c/th>\n\u003cth>止點\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>整體\u003c/td>\n\u003ctd>T9–T12 棘突、髂嵴內側斜面、薦正中嵴、腰椎棘突、棘上韌帶、薦骨外側\u003c/td>\n\u003ctd>T1–T2 棘突與頸椎\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>髂肋肌\u003c/td>\n\u003ctd>薦骨、豎脊肌腱膜、髂嵴\u003c/td>\n\u003ctd>腰段：第 12 到 7 肋；胸段：下 6 肋到上 6 肋；頸段：上 6 肋到 C6–C4 橫突後結節\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最長肌（胸段）\u003c/td>\n\u003ctd>薦骨、腰椎棘突、最末胸椎橫突\u003c/td>\n\u003ctd>腰椎橫突、腱膜、肋骨與胸椎肋突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>棘肌（胸段）\u003c/td>\n\u003ctd>L3–T10 棘突\u003c/td>\n\u003ctd>T8–T2 棘突\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">神經支配為脊神經後支，血供列為薦外側動脈。\u003csup class=\"footnote-ref\" id=\"fnref-1-3-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[1-3]\u003c/a>\u003c/sup> 先前筆記提到腰段由背側支的外側與中間分支支配，這一點本次沒有在 Wikipedia 找到逐柱說明，NCBI StatPearls 頁面因驗證畫面無法讀取，所以逐柱神經分支仍需對照標準解剖書。\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-pencil\">\u003cpath d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\">\u003c/path>\u003cpath d=\"m15 5 4 4\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">舊版內容（改寫時未保留）\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">細節放大看一處：各分支的起止點，不同來源寫法不一。Wikipedia 資訊框列的起點較窄（T9–T12 棘突與髂嵴內側斜面），其他來源則寫成從項韌帶、腰胸頸椎後部、下 9 根肋骨、髂嵴到薦骨後方。這一點現有資料沒有定論，需對照標準解剖書。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">痠痛的伸展動作\u003c/h3>\n\u003cp dir=\"auto\">知道它負責「把背撐直」，伸展的邏輯就是讓它往反方向（屈曲、旋轉）輕輕拉長。以下四個動作的步驟來自 HSS 與 Healthline 的衛教頁。\u003c/p>\n\u003ch4 dir=\"auto\">1. 單膝（或雙膝）碰胸\u003c/h4>\n\u003cp dir=\"auto\">仰躺、膝蓋彎曲，把一側膝蓋拉向胸口。Healthline 建議停 30 秒到 1 分鐘；HSS 引用物理治療師建議停 30 秒、每天 2 次。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片頁標題為「Single Knee to Chest for Lower Back Pain」；頻道與講者資格頁面文字不完整，仍未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">2. 嬰兒式（Child's Pose）\u003c/h4>\n\u003cp dir=\"auto\">跪姿，大腳趾相碰、膝蓋與髖同寬，臀部坐回腳跟，雙手往前走，額頭放地。HSS 寫「停留到舒適為止」，沒有指定秒數。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片頁標題為「Child's Pose Stretch for Lower Back Pain Relief | Physiotherapist Guided Exercise」。\u003c/p>\n\u003ch4 dir=\"auto\">3. 躺姿軀幹旋轉\u003c/h4>\n\u003cp dir=\"auto\">仰躺、膝蓋彎曲，雙膝倒向一側，頭轉向相反手的方向。HSS 的說法是深呼吸、舒服就好。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片頁標題為「Exercise Tutorial: Supine Trunk Rotation」。\u003c/p>\n\u003ch4 dir=\"auto\">4. 貓牛式\u003c/h4>\n\u003cp dir=\"auto\">四足跪姿，交替把背拱起、骨盆後傾，再讓尾骨上抬、胸口前送，頸部不要用力。HSS 沒有指定次數。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片頁標題為「How to perform a cat cow stretch for back pain」。\u003c/p>\n\u003ch4 dir=\"auto\">肩胛提肌與兒童式側伸（缺影片）\u003c/h4>\n\u003cp dir=\"auto\">肩胛提肌伸展的文字說明可參考 Columbia Doctors：頭歪向一側後看向腋窩，停 15 到 30 秒。\u003csup class=\"footnote-ref\" id=\"fnref-5-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-5-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[5]\u003c/a>\u003c/sup> 本次搜尋只找到影片庫頁面（Physitrack、Brookbush Institute），沒有打開可確認的 YouTube 影片，所以不附影片。背闊肌的兒童式側伸本次沒有查到可用資料。\u003c/p>\n\u003ch3 dir=\"auto\">限制與待確認\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">Harvard Health 引述物理治療師 Christina Ruggeri：骨盆被拉動時，下背也會被牽動而可能疼痛。有一部貓牛式影片的搜尋摘要也說，有些人做這個動作反而會痛；會痛就停。疼痛劇烈、往腿部放射或沒有改善時，應找物理治療師評估（Cleveland Clinic）。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">停留時間：來源只有零散建議（30 秒到 1 分鐘、每天 2 次；肩胛提肌 15–30 秒），沒有統一標準。\u003c/li>\n\u003cli dir=\"auto\">療效：2021 年 Cochrane 回顧顯示，整體運動療法對慢性下背痛的疼痛改善證據為中等確定性（249 項試驗、24,486 人）；單獨伸展的證據較弱。\u003csup class=\"footnote-ref\" id=\"fnref-2-1-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-2-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[2-1]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-3-1-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-3-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[3-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">逐柱神經分支與標準解剖書的起止點：本次未能核對，現有資料不足。\u003c/li>\n\u003cli dir=\"auto\">肩胛提肌、背闊肌兒童式側伸的 YouTube 影片：本次未能開啟確認，未新增。\u003c/li>\n\u003cli dir=\"auto\">4 部影片的頻道與講者資格：頁面文字沒有顯示，未能確認。\u003c/li>\n\u003cli dir=\"auto\">逐動作的授權圖片：本次沒有找到。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-pencil\">\u003cpath d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\">\u003c/path>\u003cpath d=\"m15 5 4 4\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">舊版內容（改寫時未保留）\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">用途：Gray's Anatomy 插圖，顯示豎脊肌三條柱（髂肋肌、最長肌、棘肌）沿脊柱兩側排列，圖檔 625×1179 px。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>豎脊肌解剖圖（Gray389）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Erector_spinae_muscles\u003c/a>\u003cbr>\n用途：Gray's Anatomy 插圖，顯示豎脊肌三條柱沿脊柱兩側排列。\u003cbr>\n配色：beige / brown / white\u003cbr>\n可套用公式：解剖線稿圖 + 三柱分色標示 + 由骨盆到顱底的縱向視角\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">本地筆記：\u003csup class=\"footnote-ref\" id=\"fnref-4-1-20080da504d98179\">\u003ca class=\"footnote-link\" href=\"#fn-4-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">[4-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/34580864/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/34580864/\" target=\"_blank\">Exercise therapy for chronic low back pain — PubMed\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.physio-pedia.com/Erector_spinae\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physio-pedia.com/Erector_spinae\" target=\"_blank\">Erector Spinae — Physiopedia\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hss.edu/health-library/move-better/stretches-to-loosen-lower-back\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hss.edu/health-library/move-better/stretches-to-loosen-lower-back\" target=\"_blank\">HSS：Stretches to loosen lower back\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/lower-back-stretches%23tips\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.healthline.com/health/lower-back-stretches%23tips\" target=\"_blank\">Healthline：Lower back stretches\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://health.clevelandclinic.org/exercises-and-stretches-for-low-back-pain/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://health.clevelandclinic.org/exercises-and-stretches-for-low-back-pain/\" target=\"_blank\">Cleveland Clinic：Exercises and stretches for low back pain\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.health.harvard.edu/pain/relieve-low-back-pain-with-stretching\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.health.harvard.edu/pain/relieve-low-back-pain-with-stretching\" target=\"_blank\">Harvard Health：Relieve low back pain with stretching\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch4 dir=\"auto\">先前研究的來源\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://ncbi.nlm.nih.gov/books/NBK537074\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://ncbi.nlm.nih.gov/books/NBK537074\" target=\"_blank\">StatPearls／NCBI Bookshelf：豎脊肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hss.edu/health-library/move-better/exercises-for-lower-back-pain?hl=en-US\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.hss.edu/health-library/move-better/exercises-for-lower-back-pain?hl=en-US\" target=\"_blank\">HSS：Exercises for lower back pain\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。補入解剖與功能、4 個伸展動作與各一部已開啟的影片頁；標明分支起止點來源不一，以及逐動作圖片未找到。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入起止點表、神經支配（脊神經後支）、伸展療效證據與肩胛提肌文字說明；肩胛提肌與背闊肌影片、逐柱神經分支仍未能確認。\u003c/li>\n\u003c/ul>\n\n\n\u003csection class=\"footnotes\">\u003chr>\u003col>\n\u003cli id=\"fn-1-20080da504d98179\" dir=\"auto\">\u003cp>\u003ca href=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Erector_spinae_muscles\" target=\"_blank\">Erector spinae muscles — Wikipedia\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-2-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-3-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-2-20080da504d98179\" dir=\"auto\">\u003cp>\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/30590849/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/30590849/\" target=\"_blank\">Effectiveness of Slump Stretching on Low Back Pain — PubMed\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-3-20080da504d98179\" dir=\"auto\">\u003cp>\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/38876702/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/38876702/\" target=\"_blank\">Hamstring stretching meta-analysis 2024 — PubMed\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-4-20080da504d98179\" dir=\"auto\">\u003cp>豎脊肌\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-1-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-5-20080da504d98179\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.columbiadoctors.org/health-library/multimedia/levator-scapula-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.columbiadoctors.org/health-library/multimedia/levator-scapula-stretch/\" target=\"_blank\">Columbia Doctors：Levator scapula stretch\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-5-20080da504d98179\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003c/ol>\u003c/section>"},{"id":"3f44c43f-2a60-4ac6-afe6-73742d8295c5","parentId":null,"x":187,"y":845,"collapsed":false,"status":"completed","title":"臀中肌","summary":"臀中肌起於髂骨外面、止於大轉子，由臀上神經支配；伸展可緩解痠痛，但療效證據與影片內容仍待確認。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">臀中肌是臀部上外側的扇形肌，起於髂骨外面、止於股骨大轉子，由臀上神經支配。痠痛時可用坐姿交叉腿、仰臥抱膝、鴿式、跪姿側彎做低強度伸展，\u003cmark>伸展的療效沒有臨床試驗證據\u003c/mark>。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">痠痛來源：跑步、跳舞等重複髖部動作會過度使用該肌，久坐也是常見因素；肌肉疲累時可能變緊、痠（Healthline）。\u003c/li>\n\u003cli dir=\"auto\">外側髖肌群也參與姿勢與腰椎穩定，繃緊可能使骨盆略微傾斜，這可能是「髖側與下背連帶痠」的一種解釋，但來源只是描述，並未證明因果。\u003c/li>\n\u003cli dir=\"auto\">臀中肌力弱或神經受損時，臨床上會出現 Trendelenburg 徵象（單腳站立時對側骨盆下掉）。\u003c/li>\n\u003c/ul>\n\u003ch4 dir=\"auto\">解剖：起止點與神經支配\u003c/h4>\n\u003cp dir=\"auto\">本次網路查證（2026-11-24）：多數來源（StatPearls、Wikipedia、UW Muscle Atlas、Kenhub）一致寫成：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>髂骨外面（臀面），位於前、後臀線之間；部分來源加上臀肌腱膜與髂嵴後下部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>股骨大轉子（外側與上外側面，不同來源對骨面描述略異）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>臀上神經，神經根多寫 L4–S1，亦有來源寫 L5–S1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路徑\u003c/td>\n\u003ctd>神經經坐骨大孔、梨狀肌上方穿出骨盆\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">神經根節段（L4–S1 或 L5–S1）各來源不一，需對照標準解剖書。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003cp dir=\"auto\">下列步驟與次數出自 \u003ca href=\"https://www.healthline.com/health/gluteus-medius-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Healthline〈gluteus medius stretch〉\u003c/a>。影片只確認過頁面標題，頻道與動作細節頁面未顯示，因此不保證與步驟完全一致。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 674 140\" width=\"674\" height=\"140\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"mindmap\">\u003cg transform=\"translate(320.94,70)\">\u003cg class=\"pele-branch pele-section-0\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-1,#4c78a8)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M57.69,0C83.69,0 83.69,-38 109.69,-38\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M177.44,-38C195.44,-38 195.44,-38 213.44,-38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(143.56,-38)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">坐姿\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(279.07,-38)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">坐姿臀肌伸展\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M57.69,0C83.69,0 83.69,38 109.69,38\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M177.44,38C195.44,38 195.44,38 213.44,38\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(143.56,38)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">仰臥\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(279.07,38)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">仰臥抱膝伸展\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-57.69,0C-83.69,0 -83.69,0 -109.69,0\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-177.44,0C-195.44,0 -195.44,-28 -213.44,-28\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-177.44,0C-195.44,0 -195.44,28 -213.44,28\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-143.56,0)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">跪姿\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-247.32,-28)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">鴿式\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-263.19,28)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">跪姿側彎\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">臀中肌伸展\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ch4 dir=\"auto\">1. 坐姿臀肌伸展（最溫和）\u003c/h4>\n\u003cp dir=\"auto\">坐在椅子上，一腳踝跨在另一膝上，身體前傾到跨腿側臀部有伸展感。Healthline 建議每次停 3–5 秒，每側 8–10 次，一天最多 3 輪。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/400x400_Stretches_for_Sciatica_Pain_Relief_Seated_Glute_Stretch.gif\" alt=\"坐姿臀肌伸展（Healthline，2025）\">\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片標題：Seated Glute Medius Stretch。\u003c/p>\n\u003ch4 dir=\"auto\">2. 仰臥抱膝伸展\u003c/h4>\n\u003cp dir=\"auto\">仰躺，單膝拉向胸口，雙手抱住，可輕微左右轉動；每腿 10 次，一天最多 3 輪。Healthline 也把它列為鴿式傷膝或髖很緊時的替代動作。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/400x400_9_Stretches_for_Sciatica_Pain_Relief_Knee_to_Opposite_Folder.gif\" alt=\"仰臥抱膝（Healthline，2025）\">\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片標題：Gluteus Medius Muscle Stretch。是否為仰臥抱膝，頁面未顯示，現有資料不足。\u003c/p>\n\u003ch4 dir=\"auto\">3. 鴿式\u003c/h4>\n\u003cp dir=\"auto\">四足跪姿，一膝往前靠向同側手腕，另一腿向後伸直，上身前傾以前臂撐地，或直立坐起較輕鬆；停 30 秒，每側 3 次。膝蓋不適時改做仰臥版。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/GRT-Pigeon-Pose.gif\" alt=\"鴿式（Healthline，2025）\">\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">影片標題：Gluteus Medius and Minimus (Butt) Stretch。搜尋摘要說明它停留 1–2 個呼吸；是否為鴿式未能確認。\u003c/p>\n\u003ch4 dir=\"auto\">4. 跪姿側彎\u003c/h4>\n\u003cp dir=\"auto\">跪姿，一腿向側伸直，對側手臂上舉並向伸直腿側彎，停 5–10 秒，每側 5 次，一天最多 3 輪。沒有找到已開啟的對應影片。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://media.post.rvohealth.io/wp-content/uploads/2025/10/GRT-2.11.KneelingSideBendStretch.gif\" alt=\"跪姿側彎（Healthline，2025）\">\u003c/p>\n\u003ch3 dir=\"auto\">限制與提醒\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">靜態伸展前先暖身（散步或開合跳）。不要硬拉，避免疼痛。髖外側痠痛也可能是臀中肌肌腱病變，此時單靠伸展可能不夠。痠痛持續或影響日常活動，應就醫或找物理治療師。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">來源多為健康媒體文章，不是臨床研究；伸展對臀中肌痠痛的療效，現有資料不足。\u003c/li>\n\u003cli dir=\"auto\">停留時間只有 Healthline 的單一建議（3–5 秒至 30 秒，依動作而異），沒有統一標準。\u003c/li>\n\u003cli dir=\"auto\">搜尋到的 YouTube 影片中，pY2nIAEmJZk 與 dBQXWsdrnfo 是肌力訓練，未列為伸展。\u003c/li>\n\u003cli dir=\"auto\">使用者標註的「髖側後方」與臀中肌位置（臀部上外側）大致相近，但標註圖本身未能檢視。\u003c/li>\n\u003cli dir=\"auto\">本次未找到已確認授權的臀中肌解剖圖；Radiopaedia 提到 Gray's Anatomy 插圖 Gray434.png 屬公有領域，但未確認其內容，故不嵌入。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">各影片實際示範的動作、講者資格與頻道，是否能實際播放核對？\u003c/li>\n\u003cli dir=\"auto\">側躺髖外展等肌力訓練，對長期臀中肌痠痛是否比伸展更有效？\u003c/li>\n\u003cli dir=\"auto\">臀上神經根節段到底是 L4–S1 還是 L5–S1，標準解剖書如何寫？\u003c/li>\n\u003cli dir=\"auto\">Gray434.png 是否清楚顯示臀中肌，可用作解剖圖？\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.healthline.com/health/gluteus-medius-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Healthline：gluteus medius stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/gluteus-medius-pain/\" rel=\"noopener nofollow\" target=\"_blank\">Hinge Health：gluteus medius pain\u003c/a>（僅出現在搜尋結果）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://ncbi.nlm.nih.gov/books/NBK557509\" rel=\"noopener nofollow\" target=\"_blank\">StatPearls：Gluteus Medius\u003c/a>（起止點、神經）\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.wikipedia.org/wiki/Gluteus_medius\" rel=\"noopener nofollow\" target=\"_blank\">Wikipedia：Gluteus medius\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://rad.washington.edu/muscle-atlas/gluteus-medius\" rel=\"noopener nofollow\" target=\"_blank\">UW Muscle Atlas：Gluteus medius\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/gluteus-medius-and-minimus-muscles\" rel=\"noopener nofollow\" target=\"_blank\">Kenhub：gluteus medius and minimus\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.radiopaedia.org/cases/gluteal-and-posterior-thigh-muscles-grays-illustration?lang=us\" rel=\"noopener nofollow\" target=\"_blank\">Radiopaedia：Gray 臀與大腿後側肌插圖\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">YouTube：\u003ca href=\"https://www.youtube.com/watch?v=sgiZGZNjLNw\" rel=\"noopener nofollow\" target=\"_blank\">sgiZGZNjLNw\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=Uk8NJ4TFh7o\" rel=\"noopener nofollow\" target=\"_blank\">Uk8NJ4TFh7o\u003c/a>、\u003ca href=\"https://www.youtube.com/watch?v=h3AqD40rwH0\" rel=\"noopener nofollow\" target=\"_blank\">h3AqD40rwH0\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch4 dir=\"auto\">先前研究的來源\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">搜尋到的 YouTube 影片中，僅 \u003ca href=\"https://www.youtube.com/watch?v=pY2nIAEmJZk\" rel=\"noopener nofollow\" target=\"_blank\">pY2nIAEmJZk\u003c/a> 與 dBQXWsdrnfo 是肌力訓練，未列為伸展。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次建立。搜尋並整理 4 個伸展動作、圖片與 3 部已開啟頁面的影片；影片內容未驗證。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入起止點與臀上神經支配（含神經根來源不一）、停留時間與療效證據的不足；解剖圖與影片內容仍未確認。\u003c/li>\n\u003c/ul>"}],"images":[{"id":"img-b
