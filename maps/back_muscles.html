/* Annotated pictures: the rules for the picture, its bar and its anchors come from styles.css (under .vam-view). A picture is only looked at here: it takes no drag and lets a press pan the canvas like the empty space around it. */

/* Lines from anchors to their topic cards: the map's anchor line (accent colour, 2.25px: `.vam-relation[data-anchor-relation]` in styles.css), no name, no arrowhead. */

/* No picture in the file (images off, structure only, unreadable): a grey placeholder, not the accent frame the map draws around a picture it has. */
.vam-view .vam-canvas-image.is-annotated.is-missing { background: var(--background-secondary); border-color: var(--background-modifier-border-hover); box-shadow: none; }

<script type="application/json" id="vam-map">{"format":"vam-share","version":1,"title":"背部伸展","language":"zh-TW","exportedAt":"2026-11-24T05:11:08.812Z","source":{"vamVersion":"0.34.0","mapId":"71af2c84-88ab-4813-bc97-63fcd4003f23"},"viewport":{"x":197.65149863033002,"y":295.5121340837584,"zoom":0.694322877535605},"nodes":[{"id":"55aa73cd-fa9c-4ad8-9ec5-97d5614e060d","parentId":null,"x":491,"y":112,"collapsed":false,"status":"completed","title":"斜方肌","summary":"斜方肌分上中下三部，副神經為主要運動支配；伸展約30秒有單一試驗支持，但各動作療效證據仍有限。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">斜方肌是背部淺層肌肉，上部纖維抬高肩胛骨並協助頸部伸展，所以長時間聳肩、低頭時肩頸最容易痠。伸展保持 \u003cmark>30 秒\u003c/mark>目前只有一項隨機試驗支持，不能視為通用標準。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">上部纖維緊繃是肩頸痠的常見來源。理由：上部負責抬高肩帶，與提肩胛肌分擔同一個動作。\u003c/li>\n\u003cli dir=\"auto\">運動支配以副神經（第 XI 對腦神經）為主。理由：NCBI 與 Radiopaedia 都這樣寫。\u003csup class=\"footnote-ref\" id=\"fnref-1-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[1]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-2-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-2-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[2]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">伸展時間以 30 秒較有依據。理由：Mansoori 等人 2021 年在 100 位慢性肌筋膜疼痛者的試驗中，30 秒與 60 秒的疼痛改善優於 15 秒與未伸展組。\u003csup class=\"footnote-ref\" id=\"fnref-3-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-3-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[3]\u003c/a>\u003c/sup>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">想像肩頸痠痛時打開解剖圖，斜方肌像一張菱形披肩，從後腦鋪到胸椎中段。這一頁要回答的是：痠的是哪一塊，又該拉哪裡？\u003c/p>\n\u003ch3 dir=\"auto\">解剖與功能\u003c/h3>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Trapezius.png/1280px-Trapezius.png\" alt=\"斜方肌（紅色）位置示意，Wikipedia「Trapezius」條目圖，來源：Wikimedia Commons\">\u003c/p>\n\u003cp dir=\"auto\">此圖網址由頁面縮圖路徑推得，未直接開啟原檔。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>部位\u003c/th>\n\u003cth>主要作用\u003c/th>\n\u003cth>來源說法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>上部（降支）\u003c/td>\n\u003ctd>抬高、上旋肩胛骨，協助頸部伸展\u003c/td>\n\u003ctd>與提肩胛肌一起抬高肩帶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中部（橫支）\u003c/td>\n\u003ctd>內收肩胛骨\u003c/td>\n\u003ctd>起點有 C7–T3 與 T1–T4 兩種寫法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下部（升支）\u003c/td>\n\u003ctd>下壓肩胛骨，協助上旋\u003c/td>\n\u003ctd>多數寫 T4–T12；Radiopaedia 寫 T6–T12\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 dir=\"auto\">起止點與神經（本次補查）\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">起點：多數來源列為上項線內側 1/3、枕外隆凸、項韌帶，以及 C7 至 T12 棘突；Loyola 的教學頁只寫到 T12，沒有列 C7。\u003csup class=\"footnote-ref\" id=\"fnref-1-1-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[1-1]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-4-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-4-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[4]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">止點：鎖骨外側 1/3、肩峰與肩胛棘；Loyola 頁面依纖維細分，上部到鎖骨，下部到肩峰與肩胛棘。\u003csup class=\"footnote-ref\" id=\"fnref-4-1-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-4-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[4-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">運動支配：副神經。各來源對其頸神經根的來源寫法不同（C1–C5、C2–C3 等）。\u003csup class=\"footnote-ref\" id=\"fnref-1-2-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[1-2]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-4-2-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-4-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[4-2]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">C3、C4：NCBI 與 Wikipedia 說它們帶本體感覺與痛覺；Wikipedia 另把 C3、C4 列為運動與感覺，與其他來源矛盾。WashU 神經外科頁指出，副神經完全受損時上部功能可能因 C3、C4 直接分支而部分保留。\u003csup class=\"footnote-ref\" id=\"fnref-1-3-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[1-3]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-5-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-5-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[5]\u003c/a>\u003c/sup>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">目前判斷：C3、C4 以感覺為主、並可能對上部有輔助運動貢獻，但來源不一，列入待確認。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-mindmap\" viewBox=\"0 0 817 196\" width=\"817\" height=\"196\" style=\"max-width: 679px; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); --_fm: var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace); font-style: normal; font-variant: normal; font-size-adjust: none; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: normal; font-stretch: normal; font-size: 16px; line-height: normal; letter-spacing: normal; word-spacing: normal; text-transform: none; direction: ltr; font-family: var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif); touch-action: pan-y; margin-right: 42px;\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"mindmap\" tabindex=\"0\">\u003cg transform=\"translate(384.44,84)\">\u003cg class=\"pele-branch pele-section-0\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-1,#4c78a8)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M41.81,0C67.81,0 67.81,0 93.81,0\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M225.07,0C243.07,0 243.07,-28 261.07,-28\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M225.07,0C243.07,0 243.07,28 261.07,28\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(159.44,0)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">上部（降支）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(342.57,-28)\">\u003crect x=\"-81.5\" y=\"-24\" width=\"163\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">抬高、上旋肩胛骨\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(326.69,28)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-1,#4c78a8)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-1,#4c78a8)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">協助頸部伸展\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-1\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-2,#f58518)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,-52 -93.81,-52\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-225.07,-52C-243.07,-52 -243.07,-52 -261.07,-52\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-159.44,-52)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">中部（橫支）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-318.75,-52)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-2,#f58518)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-2,#f58518)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">內收肩胛骨\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-branch pele-section-2\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--pele-series-3,#54a24b)\" stroke-width=\"1.5\">\u003cpath class=\"pele-edge\" d=\"M-41.81,0C-67.81,0 -67.81,52 -93.81,52\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-225.07,52C-243.07,52 -243.07,24 -261.07,24\">\u003c/path>\u003cpath class=\"pele-edge\" d=\"M-225.07,52C-243.07,52 -243.07,80 -261.07,80\">\u003c/path>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-159.44,52)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下部（升支）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-318.75,24)\">\u003crect x=\"-57.69\" y=\"-24\" width=\"115.38\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下壓肩胛骨\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(-310.82,80)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--pele-series-3,#54a24b)\" fill-opacity=\"0.22\" stroke=\"var(--pele-series-3,#54a24b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">協助上旋\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"pele-node pele-shape-rect pele-root\" transform=\"translate(0,0)\">\u003crect x=\"-41.81\" y=\"-24\" width=\"83.63\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">斜方肌\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003ch3 dir=\"auto\">痠痛的伸展動作\u003c/h3>\n\u003cp dir=\"auto\">放大一個細節：各來源對耳朵靠肩膀的側彎都強調「輕輕」。Livestrong 提醒不要用力硬拉；The Healthy 寫 20 到 30 秒；影片說明寫至少 30 秒。唯一查到的對照試驗（Mansoori 等人，2021）顯示 30 秒與 60 秒優於 15 秒，作者結論 30 秒最佳。\u003csup class=\"footnote-ref\" id=\"fnref-3-1-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-3-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[3-1]\u003c/a>\u003c/sup> 這是單一試驗，對象是慢性肌筋膜疼痛，不是所有人的痠痛。\u003c/p>\n\u003ch4 dir=\"auto\">1. 上斜方肌側彎伸展\u003c/h4>\n\u003cp dir=\"auto\">坐姿或站姿，肩膀放鬆，頭向一側傾，耳朵靠向肩膀，兩側都做。一支影片說明可用同側手抓椅子下緣再側彎。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">（NUHS Physiotherapy「Upper Trapezius Stretch (both sides)」，頁面文字不足，逐步內容未確認。）\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">（Ask Doctor Jo「Upper Trapezius Stretch」，只確認標題與頻道。）\u003c/p>\n\u003ch4 dir=\"auto\">2. 提肩胛肌伸展\u003c/h4>\n\u003cp dir=\"auto\">肩膀向後下沉，下巴微收，頭轉向並看向對側腋下，用手輕壓。NWHSU 診所講義也以「看向對側肩膀」起手；Fitnessvolt 建議基本版停 30 到 60 秒。\u003csup class=\"footnote-ref\" id=\"fnref-6-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-6-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[6]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-7-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-7-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[7]\u003c/a>\u003c/sup>\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">（Ask Doctor Jo「Levator Scapula Stretch」，先前已開啟頁面。本次搜尋沒有找到可另外開啟的 YouTube 影片，所以沒有新增。）\u003c/p>\n\u003ch4 dir=\"auto\">3. 下巴內收\u003c/h4>\n\u003cp dir=\"auto\">Hinge Health 的物理治療師建議以下巴內收強化頸部前側肌群，可能減輕上斜方肌負擔。臨床試驗計畫書的基本版是：坐或站直、眼睛平視、做出「雙下巴」、一次 10 秒、10 次，不是通用處方。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">（「Chin Tuck for Physical Therapy」，頻道名稱未顯示。）\u003c/p>\n\u003ch4 dir=\"auto\">4. 門框胸肌伸展\u003c/h4>\n\u003cp dir=\"auto\">這個動作拉的是前側胸肌，不是斜方肌本身，只能視為姿勢輔助。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">（「How to Do a Doorway Pec Stretch Exercise | 90 Degrees Abduction | MedBridge」，頻道名稱未確認。）\u003c/p>\n\u003ch3 dir=\"auto\">限制與待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">影片多只確認到標題，沒有看到完整內容，也沒有查到比較各種伸展療效的臨床證據。疼痛持續、嚴重或限制活動時，Medical News Today 等來源建議找物理治療師或醫師。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">30 秒的結論來自單一試驗；彙整多項試驗的系統性回顧本次沒查到。同一團隊登錄了上斜方肌與提肩胛肌的 15、30、60 秒試驗，未找到已發表結果。\u003csup class=\"footnote-ref\" id=\"fnref-3-2-fb9f19543088be22\">\u003ca class=\"footnote-link\" href=\"#fn-3-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">[3-2]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">C3、C4 對斜方肌是感覺、運動，或兩者皆有？\u003c/li>\n\u003cli dir=\"auto\">起點寫到 C7 還是 T1、終點寫到 T12 還是 T6，各來源不一。\u003c/li>\n\u003cli dir=\"auto\">斜方肌中部與下部的痠痛，適合哪些伸展與肌力訓練？\u003c/li>\n\u003cli dir=\"auto\">提肩胛肌、背闊肌兒童式側伸：本次沒有實際開啟新的 YouTube 影片，所以沒有補上；影片頻道與講者資格仍未確認。\u003c/li>\n\u003cli dir=\"auto\">動作圖片：本次未找到可確認授權的逐動作圖片。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003cstrong>斜方肌位置（紅色）\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Trapezius\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Trapezius\u003c/a>\u003cbr>\n用途：維基百科斜方肌條目的解剖圖，以紅色標示背部淺層的斜方肌。圖檔網址由縮圖路徑推得，未直接開啟原檔。\u003cbr>\n配色：red / white / gray\u003cbr>\n可套用公式：解剖圖用單一紅色標出目標肌肉，其餘留灰白\u003c/p>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Trapezius\" rel=\"noopener nofollow\" target=\"_blank\">Wikipedia：Trapezius\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/trapezius-pain-exercises/\" rel=\"noopener nofollow\" target=\"_blank\">Hinge Health\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://livestrong.com/article/13729510-10-minute-stretches-tight-trapezius\" rel=\"noopener nofollow\" target=\"_blank\">Livestrong\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.thehealthy.com/?p=1168842\" rel=\"noopener nofollow\" target=\"_blank\">The Healthy\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.medicalnewstoday.com/articles/324251.php\" rel=\"noopener nofollow\" target=\"_blank\">Medical News Today\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理，補入解剖分部、四個伸展動作與已開啟的 YouTube 影片頁。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補入起止點與神經支配的來源差異、30 秒伸展的單一試驗證據；與先前結論不一致：先前寫「秒數沒有共識」，現查到單一試驗支持 30 秒，目前判斷仍屬證據有限；未新增影片。\u003c/li>\n\u003c/ul>\n\n\n\u003csection class=\"footnotes\">\u003chr>\u003col>\n\u003cli id=\"fn-1-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK518994/\" rel=\"noopener nofollow\" target=\"_blank\">NCBI StatPearls：斜方肌解剖\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-2-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-3-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-2-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://radiopaedia.org/articles/41023\" rel=\"noopener nofollow\" target=\"_blank\">Radiopaedia\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-3-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://medicaljournals.se/jrm/content/html/10.2340/16501977-2781\" rel=\"noopener nofollow\" target=\"_blank\">Mansoori 等人，J Rehabil Med 2021：伸展最佳時間\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-2-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-4-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.lumen.luc.edu/lumen/meded/grossanatomy/dissector/mml/trap.htm\" rel=\"noopener nofollow\" target=\"_blank\">Loyola Lumen 解剖教學頁\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-1-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-2-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-5-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://nervesurgery.wustl.edu/?p=9397\" rel=\"noopener nofollow\" target=\"_blank\">WashU 神經外科：副神經\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-5-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-6-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.nwhealth.edu/wp-content/uploads/2019/04/NWHSU-clinic-stretching-handout-levator.pdf\" rel=\"noopener nofollow\" target=\"_blank\">NWHSU 提肩胛肌伸展講義\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-6-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-7-fb9f19543088be22\" dir=\"auto\">\u003cp>\u003ca href=\"https://fitnessvolt.com/levator-scapulae-stretches/\" rel=\"noopener nofollow\" target=\"_blank\">Fitnessvolt：提肩胛肌伸展\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-7-fb9f19543088be22\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003c/ol>\u003c/section>"},{"id":"c810cba4-2ac7-4e2e-b058-0a551f98bf9e","parentId":null,"x":187,"y":71,"collapsed":false,"status":"completed","title":"頸夾肌","summary":"頸夾肌為後頸淺層伸肌，起於T3–T6棘突、止於C1–C3橫突；單獨伸展證據薄弱，搭配肌力訓練較有支持。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">夾肌（頭夾肌 capitis、頸夾肌 cervicis）是後頸淺層伸肌：雙側收縮使頭頸後仰，單側收縮使同側旋轉與側屈。伸展的原則是「前屈＋對側側屈＋對側旋轉」。\u003cmark>單獨伸展的臨床證據偏弱\u003c/mark>，搭配肌力訓練才有較好的支持。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">伸展方向與肌肉動作相反：單側收縮造成同側旋轉與側屈，所以要往對側拉。\u003c/li>\n\u003cli dir=\"auto\">證據偏弱：Cochrane 2015 更新指出，只做伸展或耐力運動，對頸痛與功能的效果似乎很小，且證據品質為低\u003csup class=\"footnote-ref\" id=\"fnref-1-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-1-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[1]\u003c/a>\u003c/sup>。\u003c/li>\n\u003cli dir=\"auto\">合併訓練較有利：2012 版回顧對慢性頸痛，頸與肩胛胸廓的伸展加肌力訓練有中等品質證據，疼痛合併效應量 SMD -0.35\u003csup class=\"footnote-ref\" id=\"fnref-1-1-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-1-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[1-1]\u003c/a>\u003c/sup>。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">背景與機制\u003c/h3>\n\u003cp dir=\"auto\">想像低頭滑手機一小時後，耳後到後頸繃緊。那條斜向外上走的肌肉就是夾肌。頭夾肌較寬、位置較高；頸夾肌較小、位置稍低。\u003c/p>\n\u003ch4 dir=\"auto\">頭夾肌\u003c/h4>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>多數來源的說法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>項韌帶與約 C7～T3 棘突（Loyola 寫 T1–3，AnatomyZone 寫 C7–T4）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>顳骨乳突與枕骨上項線外側\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>C2–C3 後支（Elsevier、Kenhub）；Loyola 寫 C3、C4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 dir=\"auto\">頸夾肌（本次補足）\u003c/h4>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>說法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>多數來源：T3–T6 棘突\u003csup class=\"footnote-ref\" id=\"fnref-2-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-2-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[2]\u003c/a>\u003c/sup>；有一則 StatPearls 條目寫 C4–T4 橫突，與多數不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>多數來源：C1–C3 橫突\u003csup class=\"footnote-ref\" id=\"fnref-2-1-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-2-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[2-1]\u003c/a>\u003c/sup>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>下頸神經後支；Loyola 列 C5、C6\u003csup class=\"footnote-ref\" id=\"fnref-2-2-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-2-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[2-2]\u003c/a>\u003c/sup>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動作\u003c/td>\n\u003ctd>雙側：伸頸；單側：同側旋轉與側屈\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 395 352\" width=\"395\" height=\"352\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M197.25,56L197.25,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M197.25,104L193.89,96L200.61,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M197.25,152L197.25,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M197.25,200L193.89,192L200.61,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M181.25,248C181.25,265.5 57.75,265.5 57.75,283L57.75,289\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M57.75,296L54.39,288L61.11,288Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M197.25,248L197.25,289\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M197.25,296L193.89,288L200.61,288Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M213.25,248C213.25,265.5 336.75,265.5 336.75,283L336.75,289\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M336.75,296L333.39,288L340.11,288Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(197.25,32)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">單側收縮\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(197.25,128)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">同側旋轉與側屈\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(197.25,224)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">伸展要反方向\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(57.75,320)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">頸部前屈\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(197.25,320)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">對側側屈\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(336.75,320)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">對側旋轉\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cdiv class=\"callout\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-pencil\">\u003cpath d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\">\u003c/path>\u003cpath d=\"m15 5 4 4\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">舊版內容（改寫時未保留）\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">來源：\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/splenius-capitis-muscle/24194\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/splenius-capitis-muscle/24194\" target=\"_blank\">Elsevier\u003c/a>、\u003ca href=\"https://www.kenhub.com/en/library/anatomy/splenius-capitis-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/splenius-capitis-muscle\" target=\"_blank\">Kenhub\u003c/a>、\u003ca href=\"https://www.meddean.luc.edu/lumen/meded/grossanatomy/dissector/mml/spca.htm\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.meddean.luc.edu/lumen/meded/grossanatomy/dissector/mml/spca.htm\" target=\"_blank\">Loyola\u003c/a>。各來源在脊椎節段與神經根上不一致，需要精確數值時應查標準解剖書。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">伸展動作\u003c/h3>\n\u003ch4 dir=\"auto\">動作一：側頸屈曲伸展\u003c/h4>\n\u003cp dir=\"auto\">站立、雙腳與髖同寬，一手放頭頂，把耳朵拉向同側肩。Rehab My Patient 建議每次停 10～30 秒，兩側各做\u003csup class=\"footnote-ref\" id=\"fnref-3-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-3-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[3]\u003c/a>\u003c/sup>。手輕放即可，不要下壓。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://www.rehabmypatient.com/media/uploads/articles/Splenius-capitis-exercises-2.jpg\" alt=\"側頸屈曲伸展示意圖（Rehab My Patient，頭夾肌運動頁面）\">\u003c/p>\n\u003cp dir=\"auto\">影片（標題「Splenius Capitis Muscle Stretch」）：\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">動作二：下巴內收加手輔助的屈曲／側屈\u003c/h4>\n\u003cp dir=\"auto\">標題為「Splenius Capitis and Cervicis Self Stretch Exercise - Using your hand」，約停 30 秒之說未在頁面驗證。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">動作三：斜方肌與頭夾肌合併伸展\u003c/h4>\n\u003cp dir=\"auto\">適合肩頸一起緊的人。標題為「Stretching the Trapezius (shoulder) and Splenius Capitis (back of the neck) Muscles」。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">補充：釋放與活動度與強化\u003c/h4>\n\u003cp dir=\"auto\">「Splenius Capitis Release and Mobilization」偏放鬆與活動，非單純伸展。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003cp dir=\"auto\">彈力帶頸後伸屬肌力訓練，與上述回顧中「伸展加強化較有利」的方向一致，但本次未查到夾肌專屬的劑量證據。\u003c/p>\n\u003cp dir=\"auto\">\u003cimg src=\"https://www.rehabmypatient.com/media/uploads/articles/Splenius-capitis-exercises-1.jpg\" alt=\"彈力帶頸後伸示意圖（Rehab My Patient，頭夾肌運動頁面）\">\u003c/p>\n\u003cdiv class=\"callout\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-pencil\">\u003cpath d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\">\u003c/path>\u003cpath d=\"m15 5 4 4\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">舊版內容（改寫時未保留）\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">因為單側收縮會同側旋轉、側屈，伸展就要反方向：低頭、頭轉向對側並側屈。來源（\u003ca href=\"https://learnmuscles.com/?p=20576\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://learnmuscles.com/?p=20576\" target=\"_blank\">Learn Muscles\u003c/a>、\u003ca href=\"https://www.nielasher.com/blogs/video-blog/stretching-for-pain-relief-and-rehabilitation-splenius-cervicis\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nielasher.com/blogs/video-blog/stretching-for-pain-relief-and-rehabilitation-splenius-cervicis\" target=\"_blank\">Niel Asher\u003c/a>）的描述大致如此，細節各家不同。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">限制與待確認\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">動作要慢、不要彈震；疼痛加劇就停止\u003csup class=\"footnote-ref\" id=\"fnref-4-58fcd51eb24fd6c8\">\u003ca class=\"footnote-link\" href=\"#fn-4-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">[4]\u003c/a>\u003c/sup>。手臂放射痛、頭痛、近期外傷或重度疼痛，應先就醫。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">待確認\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">四部影片的頻道與講者資歷、保持時間與次數仍未確認；本次也未新增提肩胛肌、背闊肌兒童式側伸的影片（這兩項不在目前頁面，且本次未實際開啟新影片，不宜編造影片 ID）。\u003c/li>\n\u003cli dir=\"auto\">頸夾肌起止點與神經根各來源不一致，精確數值請查標準解剖書。\u003c/li>\n\u003cli dir=\"auto\">夾肌專屬的伸展療效試驗未查到；Cochrane 結論針對一般頸痛運動。Cochrane 全文未逐頁核對。\u003c/li>\n\u003cli dir=\"auto\">圖片未逐一檢視內容，授權未確認。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-pencil\">\u003cpath d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\">\u003c/path>\u003cpath d=\"m15 5 4 4\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">舊版內容（改寫時未保留）\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">證據面：一篇 PMC 回顧指出，自我伸展可能在短期減輕頸痛；其中引用的試驗顯示，每週 5 次伸展對慢性頸痛的效果與每週 2 次手法治療相當（\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3435917/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3435917/\" target=\"_blank\">PMC3435917\u003c/a>）。此處是搜尋摘要轉述，我未開啟全文核對。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/splenius-capitis-muscle/24194\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.elsevier.com/resources/anatomy/muscular-system/muscles-of-back/splenius-capitis-muscle/24194\" target=\"_blank\">Elsevier 頭夾肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.kenhub.com/en/library/anatomy/splenius-capitis-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.kenhub.com/en/library/anatomy/splenius-capitis-muscle\" target=\"_blank\">Kenhub 頭夾肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.meddean.luc.edu/lumen/meded/grossanatomy/dissector/mml/spca.htm\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.meddean.luc.edu/lumen/meded/grossanatomy/dissector/mml/spca.htm\" target=\"_blank\">Loyola 頭夾肌\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.nielasher.com/blogs/video-blog/stretching-for-pain-relief-and-rehabilitation-splenius-cervicis\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nielasher.com/blogs/video-blog/stretching-for-pain-relief-and-rehabilitation-splenius-cervicis\" target=\"_blank\">Niel Asher\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://learnmuscles.com/?p=20576\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://learnmuscles.com/?p=20576\" target=\"_blank\">Learn Muscles\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3435917/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3435917/\" target=\"_blank\">PMC3435917\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch4 dir=\"auto\">先前研究的來源\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">頭夾肌較寬、位置較高；頸夾肌較小、位置稍低。Physiopedia 將夾肌歸在頸部後側伸肌群的淺層（\u003ca href=\"https://www.physio-pedia.com:443/Muscle_Performance_in_Neck_Pain\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physio-pedia.com:443/Muscle_Performance_in_Neck_Pain\" target=\"_blank\">Physiopedia\u003c/a>）。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理。補上解剖資料、四個伸展動作、四部已開啟的 YouTube 影片頁與兩張動作圖；標註來源間的不一致與未驗證處。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上頸夾肌起止點與神經支配（來源間有不一致處）、Cochrane 對單獨伸展證據較弱的結論；影片頻道與新增影片仍未解決。與先前結論不一致：先前引 PMC 回顧稱自我伸展可能短期減痛，Cochrane 則認為單獨伸展效果很小，目前判斷以 Cochrane 較強，並已列入待確認。\u003c/li>\n\u003c/ul>\n\n\n\u003csection class=\"footnotes\">\u003chr>\u003col>\n\u003cli id=\"fn-1-58fcd51eb24fd6c8\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.cochrane.org/evidence/CD004250_exercises-neck-pain\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.cochrane.org/evidence/CD004250_exercises-neck-pain\" target=\"_blank\">Cochrane：Exercises for mechanical neck disorders\u003c/a>；\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/22895940/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://pubmed.ncbi.nlm.nih.gov/22895940/\" target=\"_blank\">PubMed 22895940\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-1-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-2-58fcd51eb24fd6c8\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.meddean.luc.edu/lumen/meded/grossanatomy/dissector/mml/spce.htm\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.meddean.luc.edu/lumen/meded/grossanatomy/dissector/mml/spce.htm\" target=\"_blank\">Loyola：Splenius cervicis\u003c/a>；\u003ca href=\"https://radiopaedia.org/articles/splenius-cervicis-muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://radiopaedia.org/articles/splenius-cervicis-muscle\" target=\"_blank\">Radiopaedia\u003c/a>；\u003ca href=\"https://ncbi.nlm.nih.gov/books/NBK537074\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://ncbi.nlm.nih.gov/books/NBK537074\" target=\"_blank\">StatPearls／NCBI\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-1-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-2-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-3-58fcd51eb24fd6c8\" dir=\"auto\">\u003cp>\u003ca href=\"https://rehabmypatient.com/neck/splenius-capitis\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://rehabmypatient.com/neck/splenius-capitis\" target=\"_blank\">Rehab My Patient\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-4-58fcd51eb24fd6c8\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.nyp.org/healthlibrary/symptoms/document/sig54597\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.nyp.org/healthlibrary/symptoms/document/sig54597\" target=\"_blank\">NYP 頸部運動\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-58fcd51eb24fd6c8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003c/ol>\u003c/section>"},{"id":"0186336e-868f-4e41-a2c8-a2b4bbef9e8f","parentId":null,"x":-117,"y":71,"collapsed":false,"status":"completed","title":"提肩胛肌","summary":"提肩胛肌起於 C1–C4 橫突、止於肩胛骨內側緣上部，由 C3–C4 與肩胛背神經支配；坐姿轉頭低頭伸展停 30–60 秒，療效證據仍弱。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">提肩胛肌從上位頸椎連到肩胛骨上緣，負責上提肩胛；痠痛時常用溫和的坐姿伸展加姿勢調整。\u003cmark>解剖已查證，療效證據仍薄弱\u003c/mark>：本次來源多為衛教與健身頁面，不是嚴謹試驗。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">起點與止點：起於 C1–C4 橫突後結節，止於肩胛骨內側緣上部，範圍從上角到肩胛棘與內側緣交會處。\u003csup class=\"footnote-ref\" id=\"fnref-1-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-1-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[1]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-2-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-2-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[2]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">神經支配：頸神經 C3、C4 的 2–3 條分支，常再加肩胛背神經。\u003csup class=\"footnote-ref\" id=\"fnref-2-1-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-2-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[2-1]\u003c/a>\u003c/sup>\u003csup class=\"footnote-ref\" id=\"fnref-1-1-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-1-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[1-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">動作：上提肩胛骨，並使關節盂朝下旋轉（肩胛向下旋轉）。\u003csup class=\"footnote-ref\" id=\"fnref-2-2-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-2-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[2-2]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">圖中使用者標註的「頸側到肩胛上角」位置，與上述起止點相符。\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Levator_scapulae.png/1280px-Levator_scapulae.png\" alt=\"提肩胛肌位置圖：Levator scapulae.png，維基共享資源，來源頁見下方連結\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>提肩胛肌位置圖\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Levator_scapulae_muscle\u003c/a>\u003cbr>\n用途：連接上肢與脊柱的肌肉，提肩胛肌位於頸部；授權待至共享資源檔案頁確認。\u003cbr>\n配色：beige / red\u003cbr>\n可套用公式：解剖線稿 + 標示頸側到肩胛上角\u003c/p>\n\u003cp dir=\"auto\">圖說：連接上肢與脊柱的肌肉，提肩胛肌在右上方頸部。圖片授權請至共享資源檔案頁確認，來源頁：\u003ca href=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" target=\"_blank\">Wikipedia\u003c/a>。\u003c/p>\n\u003ch3 dir=\"auto\">伸展做法\u003c/h3>\n\u003ch4 dir=\"auto\">坐姿轉頭低頭伸展（Spine-health）\u003c/h4>\n\u003cp dir=\"auto\">坐直，右手伸到背後，抓住右側肩胛骨並往下壓（手臂難抬時可省略）。頭其他部位不動，向左轉約 45 度，下巴下收，直到右後頸感到伸展；想更深可用左手輕壓後腦。每次停 30–60 秒，換邊重複，一天做幾次，例如早晚各一次。\u003csup class=\"footnote-ref\" id=\"fnref-3-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-3-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[3]\u003c/a>\u003c/sup>\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 243 562\" width=\"243\" height=\"562\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,56L121.25,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,104L117.89,96L124.61,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,170L121.25,211\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,218L117.89,210L124.61,210Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,266L121.25,307\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,314L117.89,306L124.61,306Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,362L121.25,403\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,410L117.89,402L124.61,402Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M121.25,458L121.25,499\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M121.25,506L117.89,498L124.61,498Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,32)\">\u003crect x=\"-33.88\" y=\"-24\" width=\"67.75\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">坐直\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,137)\">\u003crect x=\"-113.25\" y=\"-33\" width=\"226.51\" height=\"66\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" text-anchor=\"middle\" xml:space=\"preserve\">\u003ctspan x=\"0\" y=\"-4.9\">右手到背後，抓右肩胛骨下\u003c/tspan>\u003ctspan x=\"0\" y=\"16.1\">壓\u003c/tspan>\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,242)\">\u003crect x=\"-79.6\" y=\"-24\" width=\"159.19\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">頭向左轉約 45 度\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,338)\">\u003crect x=\"-113.25\" y=\"-24\" width=\"226.51\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">下巴下收，右後頸有伸展感\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,434)\">\u003crect x=\"-69.75\" y=\"-24\" width=\"139.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">停 30 至 60 秒\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(121.25,530)\">\u003crect x=\"-49.75\" y=\"-24\" width=\"99.5\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">換邊重複\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003cimg src=\"https://res.cloudinary.com/da1molee1/image/upload/c_fill,g_center,h_439,w_780/q_auto:eco/exercise-backpain-levatorscapulae.png?_a=BAAAV6H8\" alt=\"提肩胛肌伸展示意圖：Spine-health\">\u003c/p>\n\u003cp dir=\"auto\">來源頁：\u003ca href=\"https://www.spine-health.com/wellness/exercise/easy-levator-scapulae-stretch-neck-pain\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.spine-health.com/wellness/exercise/easy-levator-scapulae-stretch-neck-pain\" target=\"_blank\">Spine-health\u003c/a>\u003c/p>\n\u003ch4 dir=\"auto\">其他做法\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">坐姿用對側手放頭頂，輕輕把頭帶向胸口（英國劍橋大學醫院衛教單）。\u003csup class=\"footnote-ref\" id=\"fnref-4-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-4-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[4]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">手與手肘舉起扶牆或門框，取代抓肩胛骨（Spine-health）。\u003csup class=\"footnote-ref\" id=\"fnref-3-1-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-3-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[3-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">另有靠牆版與水中版（Physitrack）；Brookbush Institute 有自家影片，並說明自我靜態伸展。\u003csup class=\"footnote-ref\" id=\"fnref-5-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-5-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[5]\u003c/a>\u003c/sup>\u003c/li>\n\u003cli dir=\"auto\">動作前先做約 6 秒的等長收縮再加深，是 McAtee 的促進式伸展做法（搜尋摘要，未核對原文）。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">限制與注意事項\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">頸部伸展不可做到疼痛或痠痛加劇；有來源建議先請物理治療師或醫師評估。\u003csup class=\"footnote-ref\" id=\"fnref-3-2-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-3-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[3-2]\u003c/a>\u003c/sup>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">Physio-pedia 提到處理方式包括姿勢建議、伸展、肌力訓練與徒手治療；「保持柔軟可降低頸痛復發」沒有強證據支持。\u003csup class=\"footnote-ref\" id=\"fnref-6-f6e9634035fd7fd3\">\u003ca class=\"footnote-link\" href=\"#fn-6-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">[6]\u003c/a>\u003c/sup> 本次搜尋沒有找到可打開的 YouTube 影片，所以不附影片。\u003c/p>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">肩胛背神經的神經根標示不一（C5，或 C4–C5）；2016 年一項屍體研究報告只由肩胛背神經支配的比例為 48%（搜尋摘要，未核對原文）。哪個說法較可靠？\u003c/li>\n\u003cli dir=\"auto\">停留時間 15–30 秒（Columbia Doctors、CommonSpirit）與 30–60 秒（Spine-health）不一致，有無比較試驗？\u003c/li>\n\u003cli dir=\"auto\">提肩胛肌伸展對頸肩痛的臨床試驗證據如何？\u003c/li>\n\u003cli dir=\"auto\">哪些物理治療師的 YouTube 影片可實際打開並核對內容？\u003c/li>\n\u003cli dir=\"auto\">提肩胛肌的肌力訓練動作有哪些？\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.columbiadoctors.org/health-library/multimedia/levator-scapula-stretch/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.columbiadoctors.org/health-library/multimedia/levator-scapula-stretch/\" target=\"_blank\">Columbia Doctors：Levator scapula stretch\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://brookbushinstitute.com/videos/levator-scapula-sa-static-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://brookbushinstitute.com/videos/levator-scapula-sa-static-stretch\" target=\"_blank\">Brookbush Institute：Levator scapula static stretch\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整理，查了衛教與物理治療頁面，未取得可驗證的 YouTube 影片。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上起止點、神經支配與動作並附圖；神經根標示不一已列入待確認；仍未取得可驗證的 YouTube 影片。\u003c/li>\n\u003c/ul>\n\n\n\u003csection class=\"footnotes\">\u003chr>\u003col>\n\u003cli id=\"fn-1-f6e9634035fd7fd3\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK537216/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.ncbi.nlm.nih.gov/books/NBK537216/\" target=\"_blank\">StatPearls：Levator Scapulae（NCBI Bookshelf）\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-1-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-2-f6e9634035fd7fd3\" dir=\"auto\">\u003cp>\u003ca href=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://en.wikipedia.org/wiki/Levator_scapulae_muscle\" target=\"_blank\">Wikipedia：Levator scapulae muscle\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-1-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-2-2-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-3-f6e9634035fd7fd3\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.spine-health.com/wellness/exercise/easy-levator-scapulae-stretch-neck-pain\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.spine-health.com/wellness/exercise/easy-levator-scapulae-stretch-neck-pain\" target=\"_blank\">Spine-health：Easy levator scapulae stretch\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-1-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-3-2-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-4-f6e9634035fd7fd3\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.cuh.nhs.uk/patient-information/neck-exercises-and-advice/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.cuh.nhs.uk/patient-information/neck-exercises-and-advice/\" target=\"_blank\">Cambridge University Hospitals：Neck exercises and advice\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-4-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-5-f6e9634035fd7fd3\" dir=\"auto\">\u003cp>\u003ca href=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" target=\"_blank\">Physitrack：Levator scapula stretch\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-5-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003cli id=\"fn-6-f6e9634035fd7fd3\" dir=\"auto\">\u003cp>\u003ca href=\"https://www.physio-pedia.com/Talk:Levator_Scapulae_Syndrome\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.physio-pedia.com/Talk:Levator_Scapulae_Syndrome\" target=\"_blank\">Physio-pedia：Levator Scapulae Syndrome\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-6-f6e9634035fd7fd3\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003c/ol>\u003c/section>"},{"id":"e7b10223-e9a2-4366-8af0-b39cd8fc48ee","parentId":null,"x":-377,"y":352,"collapsed":false,"status":"completed","title":"菱形肌","summary":"菱形肌連接 C7–T5 脊柱與肩胛骨內緣，由肩胛背神經支配；伸展可緩解肩胛間痠痛，但也要練肌力，療效證據仍不足。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">菱形肌（大、小兩塊）把肩胛骨往內上拉並貼緊胸壁。肩胛間痠痛常用「拉開肩胛骨」的伸展處理，但物理治療來源指出痠痛也可能來自\u003cmark>肌肉無力\u003c/mark>，需搭配肌力訓練。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">大菱形肌與小菱形肌的起點不同：大菱形肌起自 T2–T5 棘突，小菱形肌起自 C7–T1 棘突與項韌帶下緣。兩者都由肩胛背神經支配。\u003c/li>\n\u003cli dir=\"auto\">伸展的共同邏輯是讓肩胛骨離開脊柱，這是各衛教頁的共通做法，但沒有查到比較伸展與肌力訓練效果的試驗。\u003c/li>\n\u003cli dir=\"auto\">提肩胛肌與背闊肌兒童式側伸這兩個動作，本次沒有找到我能打開確認的 YouTube 影片，因此不附影片。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">解剖與功能\u003c/h3>\n\u003cp dir=\"auto\">兩塊肌肉的細節（2026-11-24 查證）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>大菱形肌\u003c/th>\n\u003cth>小菱形肌\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>起點\u003c/td>\n\u003ctd>T2–T5 棘突與棘上韌帶\u003c/td>\n\u003ctd>項韌帶下緣、C7–T1 棘突與其間棘上韌帶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>止點\u003c/td>\n\u003ctd>肩胛骨內側緣，約從肩胛棘高度到下角\u003c/td>\n\u003ctd>肩胛骨內側緣一小塊，約在肩胛棘高度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>神經\u003c/td>\n\u003ctd>肩胛背神經，來自 C5\u003c/td>\n\u003ctd>肩胛背神經（臂神經叢分支），多數纖維來自 C5，少部分來自 C4 或 C6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp dir=\"auto\">資料來自維基百科 \u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_major_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Rhomboid major\u003c/a> 與 \u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_minor_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Rhomboid minor\u003c/a>。大菱形肌的動作是使肩胛骨後縮、使關節盂向下旋轉，並把肩胛骨固定在胸壁；拮抗肌是前鋸肌。先前整合的合併頁（\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_muscles\" rel=\"noopener nofollow\" target=\"_blank\">Rhomboid muscles\u003c/a>）把起點寫成「項韌帶與 C7–T5」，與分開頁面一致，只是未區分大小。\u003c/p>\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"pele pele-flowchart\" viewBox=\"0 0 692 256\" width=\"692\" height=\"256\" style=\"max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,&quot;??&quot;, &quot;??&quot;, ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, &quot;Inter&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif)\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\">\u003cg class=\"pele-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\">\u003cg class=\"pele-edge\">\u003cpath d=\"M122.48,56C122.48,73.5 342.45,73.5 342.45,91L342.45,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M342.45,104L339.09,96L345.81,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M358.45,56L358.45,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M358.45,104L355.09,96L361.81,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M581.84,56C581.84,73.5 374.45,73.5 374.45,91L374.45,97\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M374.45,104L371.09,96L377.81,96Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M344.83,152C344.83,169.5 256.95,169.5 256.95,187L256.95,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M256.95,200L253.59,192L260.31,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003cg class=\"pele-edge\">\u003cpath d=\"M372.08,152C372.08,169.5 459.96,169.5 459.96,187L459.96,193\">\u003c/path>\u003cpath class=\"pele-marker\" d=\"M459.96,200L456.6,192L463.32,192Z\" fill=\"var(--_l)\" stroke=\"none\">\u003c/path>\u003c/g>\u003c/g>\u003cg class=\"pele-nodes\">\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(122.48,32)\">\u003crect x=\"-114.48\" y=\"-24\" width=\"228.97\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">小菱形肌：C7–T1 與項韌帶\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(358.45,128)\">\u003crect x=\"-65.63\" y=\"-24\" width=\"131.25\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛骨內側緣\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(358.45,32)\">\u003crect x=\"-81.49\" y=\"-24\" width=\"162.98\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">大菱形肌：T2–T5\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(581.84,32)\">\u003crect x=\"-101.89\" y=\"-24\" width=\"203.79\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">肩胛背神經（C5 為主）\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(256.95,224)\">\u003crect x=\"-89.44\" y=\"-24\" width=\"178.88\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">往內上拉並貼緊胸壁\u003c/text>\u003c/g>\u003cg class=\"pele-node pele-shape-rect\" transform=\"translate(459.96,224)\">\u003crect x=\"-73.56\" y=\"-24\" width=\"147.13\" height=\"48\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\">\u003c/rect>\u003ctext class=\"pele-label\" x=\"0\" y=\"5.6\" text-anchor=\"middle\">關節盂向下旋轉\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\n\u003cp dir=\"auto\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Rhomboidei.PNG/1280px-Rhomboidei.PNG\" alt=\"菱形肌與連接上肢與脊柱的肌肉，Rhomboidei.PNG，維基共享資源\">\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>菱形肌與連接上肢與脊柱的肌肉\u003c/strong>\u003cbr>\n來源：\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_muscles\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://en.wikipedia.org/wiki/Rhomboid_muscles\u003c/a>\u003cbr>\n用途：維基共享資源的菱形肌位置圖，授權需看 Commons 檔案頁。\u003cbr>\n配色：red / white\u003cbr>\n可套用公式：脊柱 C7–T5 → 肩胛骨內側緣\u003c/p>\n\u003cp dir=\"auto\">圖說：Rhomboidei，維基共享資源；個別圖檔授權需看其 Commons 檔案頁，本次未逐一核對。\u003c/p>\n\u003ch3 dir=\"auto\">伸展動作與影片\u003c/h3>\n\u003cp dir=\"auto\">\u003ca href=\"https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.Rhomboid-Muscle-Strain-Rehab-Exercises.zp4503\" rel=\"noopener nofollow\" target=\"_blank\">Kaiser Permanente\u003c/a> 的做法：坐或站，雙手在肩高十指交扣，下巴靠向胸口，往前伸直、圓背，想像把兩肩胛骨拉開，每次停留 15–30 秒，重複 2–4 次；疼痛就放輕。\u003c/p>\n\u003ch4 dir=\"auto\">動作一：門框伸展\u003c/h4>\n\u003cp dir=\"auto\">手握門框，身體往後退並稍微轉開，感覺肩胛骨之間被拉開（\u003ca href=\"https://theprehabguys.com/vimeo-video/rhomboid-doorway-stretch/\" rel=\"noopener nofollow\" target=\"_blank\">Prehab Guys\u003c/a>）。影片標題為「Rhomboid Doorway Stretch」，頻道未確認。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">動作二：雙手前伸的上背彎曲\u003c/h4>\n\u003cp dir=\"auto\">即上述 Kaiser 的十指交扣前伸。影片標題為「How to Stretch Rhomboids Correctly (Thoracic Flexion Drill)」，具體步驟是否相同未驗證。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">動作三：單側菱形肌伸展\u003c/h4>\n\u003cp dir=\"auto\">坐姿、十指交扣並轉動軀幹（\u003ca href=\"https://us.physitrack.com/home-exercise-video/unilateral-rhomboids-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Physitrack\u003c/a>）。影片標題為「Upper Back Release: One-Sided Rhomboid Stretch Guide」。\u003c/p>\n\u003cp dir=\"auto\">\u003c/p>\n\u003ch4 dir=\"auto\">動作四：提肩胛肌伸展（缺影片）\u003c/h4>\n\u003cp dir=\"auto\">搜尋找到 \u003ca href=\"https://us.physitrack.com/home-exercise-video/levator-scapula-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Physitrack\u003c/a> 的坐姿手放背後版本與 \u003ca href=\"https://www.nwhealth.edu/wp-content/uploads/2019/04/NWHSU-clinic-stretching-handout-levator.pdf\" rel=\"noopener nofollow\" target=\"_blank\">NWHSU 診所講義\u003c/a>；多個來源建議每側停留約 30–60 秒。本次沒有查到可打開的 YouTube 影片，所以不附。\u003c/p>\n\u003ch4 dir=\"auto\">動作五：背闊肌兒童式側伸（缺影片）\u003c/h4>\n\u003cp dir=\"auto\">\u003ca href=\"https://www.webmd.com/fitness-exercise/how-to-do-childs-pose\" rel=\"noopener nofollow\" target=\"_blank\">WebMD\u003c/a> 描述側伸版是把雙手走向右側，直到軀幹與右膝成一直線。另有 \u003ca href=\"https://library.theprehabguys.com/vimeo-video/childs-pose-sideways-reach/\" rel=\"noopener nofollow\" target=\"_blank\">Prehab Guys（Vimeo，1 分 22 秒）\u003c/a>與 \u003ca href=\"https://us.physitrack.com/home-exercise-video/child-pose-with-a-twist\" rel=\"noopener nofollow\" target=\"_blank\">Physitrack\u003c/a> 的示範，皆非 YouTube，故不嵌入。基本兒童式的步驟可參考豎脊肌筆記 \u003csup class=\"footnote-ref\" id=\"fnref-1-16305745c543dea8\">\u003ca class=\"footnote-link\" href=\"#fn-1-16305745c543dea8\" rel=\"noopener nofollow\" target=\"_blank\">[1]\u003c/a>\u003c/sup>。\u003c/p>\n\u003ch3 dir=\"auto\">限制與注意\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-alert-triangle\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">注意\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">\u003ca href=\"https://www.hingehealth.com/resources/articles/rhomboid-muscle-pain\" rel=\"noopener nofollow\" target=\"_blank\">Hinge Health\u003c/a> 的物理治療師指出，肩胛間痠痛可能來自肌肉無力；\u003ca href=\"https://www.healthline.com/health/rhomboid-muscle-pain\" rel=\"noopener nofollow\" target=\"_blank\">Healthline\u003c/a> 提供肩胛骨夾緊動作，每次停留至少 5 秒。\u003ca href=\"https://www.webmd.com/pain-management/what-to-know-about-rhomboid-muscle-pain\" rel=\"noopener nofollow\" target=\"_blank\">WebMD\u003c/a> 建議疼痛未改善時就醫或找物理治療師。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">待確認問題\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-help-circle\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">問題\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cul>\n\u003cli dir=\"auto\">伸展與肌力訓練對肩胛間痠痛的相對效果為何？目前沒有查到臨床試驗。\u003c/li>\n\u003cli dir=\"auto\">三部影片的頻道、講者資格與實際步驟為何？目前只確認標題。\u003c/li>\n\u003cli dir=\"auto\">提肩胛肌與背闊肌兒童式側伸有沒有可確認的 YouTube 示範影片？\u003c/li>\n\u003cli dir=\"auto\">大菱形肌止點下端是否到下角，各解剖書寫法是否一致？\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-pencil\">\u003cpath d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\">\u003c/path>\u003cpath d=\"m15 5 4 4\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">舊版內容（改寫時未保留）\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">來源：\u003ca href=\"https://www.youtube.com/watch?v=0LamiLdn1V0\" class=\"external-link\" rel=\"noopener nofollow\" target=\"_blank\">https://www.youtube.com/watch?v=0LamiLdn1V0\u003c/a>\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">來源\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_major_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Wikipedia：Rhomboid major\u003c/a>、\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_minor_muscle\" rel=\"noopener nofollow\" target=\"_blank\">Rhomboid minor\u003c/a>、\u003ca href=\"https://en.wikipedia.org/wiki/Rhomboid_muscles\" rel=\"noopener nofollow\" target=\"_blank\">Rhomboid muscles\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.Rhomboid-Muscle-Strain-Rehab-Exercises.zp4503\" rel=\"noopener nofollow\" target=\"_blank\">Kaiser Permanente\u003c/a>、\u003ca href=\"https://www.hingehealth.com/resources/articles/rhomboid-muscle-pain\" rel=\"noopener nofollow\" target=\"_blank\">Hinge Health\u003c/a>、\u003ca href=\"https://www.healthline.com/health/rhomboid-muscle-pain\" rel=\"noopener nofollow\" target=\"_blank\">Healthline\u003c/a>、\u003ca href=\"https://www.webmd.com/pain-management/what-to-know-about-rhomboid-muscle-pain\" rel=\"noopener nofollow\" target=\"_blank\">WebMD\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://theprehabguys.com/vimeo-video/rhomboid-doorway-stretch/\" rel=\"noopener nofollow\" target=\"_blank\">Prehab Guys\u003c/a>、\u003ca href=\"https://us.physitrack.com/home-exercise-video/unilateral-rhomboids-stretch\" rel=\"noopener nofollow\" target=\"_blank\">Physitrack\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">本地筆記：豎脊肌 \u003csup class=\"footnote-ref\" id=\"fnref-1-1-16305745c543dea8\">\u003ca class=\"footnote-link\" href=\"#fn-1-16305745c543dea8\" rel=\"noopener nofollow\" target=\"_blank\">[1-1]\u003c/a>\u003c/sup>\u003c/li>\n\u003c/ul>\n\u003ch4 dir=\"auto\">先前研究的來源\u003c/h4>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://img.youtube.com/vi/0LamiLdn1V0/hqdefault.jpg\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://img.youtube.com/vi/0LamiLdn1V0/hqdefault.jpg\" target=\"_blank\">Rhomboid Doorway Stretch 影片縮圖\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">2026-11-24：首次整合。補上解剖、三個伸展動作與影片、限制與待確認事項。\u003c/li>\n\u003cli dir=\"auto\">2026-11-24：補上大、小菱形肌各自起止點與神經支配，新增提肩胛肌與兒童式側伸說明；兩者沒有找到 YouTube 影片。\u003c/li>\n\u003c/ul>\n\n\n\u003csection class=\"footnotes\">\u003chr>\u003col>\n\u003cli id=\"fn-1-16305745c543dea8\" dir=\"auto\">\u003cp>豎脊肌\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-16305745c543dea8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003ca class=\"footnote-backref footnote-link\" href=\"#fnref-1-1-16305745c543dea8\" rel=\"noopener nofollow\" target=\"_blank\">↩︎\u003c/a>\u003c/p>\u003c/li>\n\u003c/ol>\u003c/section>"},{"id":"1cc3164f-bd45-45b8-9174-e371df460710","parentId":null,"x":751,"y":387,"collapsed":false,"status":"completed","title":"棘下肌","summary":"棘下肌是肩胛骨後方的旋轉肌袖肌肉，主管肩外旋；橫胸伸展對內旋角度的證據較睡姿伸展明確，但痠痛療效仍無直接證據。","ringHeight":159,"detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-clipboard-list\">\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">摘要\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\
