<style>/* Share viewer styles. Order: tokens and base (this part), the card, canvas and inspector rules extracted from styles.css, then the viewer-only parts below the marker. */
:root {
  color-scheme: light;
  --background-primary: #ffffff;
  --background-secondary: #f6f6f6;
  --background-modifier-border: #e0e0e0;

  --text-faint: #8a8a8a;
  --text-on-accent: #ffffff;
  --text-error: #d1243c;
  --interactive-accent: #8a5cf5;
  --text-accent: #6f42e0;
  --color-red: #e93147;
  --color-red-rgb: 233, 49, 71;
  --color-orange: #e9973f;
  --shadow-s: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-l: 0 8px 28px rgba(0, 0, 0, 0.16);
  --radius-s: 4px;
  --radius-m: 8px;
  --font-ui-smaller: 12px;
  --font-ui-small: 13px;
  --font-ui-medium: 15px;
  --input-height: 30px;
  --size-4-3: 12px;
  --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", Roboto, sans-serif;
  --font-monospace: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --background-primary: #1e1e1e;
    --background-secondary: #262626;
    --background-modifier-border: #363636;
    --background-modifier-border-hover: #4a4a4a;
    --background-modifier-border-focus: #a88bfa;
    --background-modifier-hover: rgba(255, 255, 255, 0.06);
    --background-modifier-active-hover: rgba(168, 139, 250, 0.2);
    --text-normal: #dadada;
    --text-muted: #b3b3b3;
    --text-faint: #8c8c8c;

    --color-red: #fb464c;
    --color-red-rgb: 251, 70, 76;
    --shadow-s: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
    --shadow-l: 0 8px 28px rgba(0, 0, 0, 0.5);

}
*, *::before, *::after { box-sizing: border-box; }

.vam-map-tools { top: 12px; left: 12px; flex-wrap: wrap; max-width: calc(100% - 24px); }

.vam-workspace { display: flex; flex: 1; min-height: 0; min-width: 0; position: relative; }

.vam-edge { fill: none; stroke: var(--interactive-accent); stroke-width: 2; opacity: 0.55; }
.vam-node { --vam-card-bg: var(--background-primary); position: absolute; box-sizing: border-box; width: 280px; padding: 12px 14px 14px; border: 1px solid var(--background-modifier-border); border-radius: 12px; background: var(--vam-card-bg); box-shadow: var(--shadow-s); cursor: grab; user-select: none; transition: border-color 160ms ease-out, box-shadow 160ms ease-out; }
.vam-node:hover { border-color: var(--background-modifier-border-hover); }
.vam-node > .vam-card-label { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; white-space: nowrap; border: 0; }
.vam-edge-convergence { stroke: var(--interactive-accent); stroke-dasharray: 5 5; opacity: .8; }
.vam-node:active { cursor: grabbing; }
.vam-node.is-selected { border-color: var(--interactive-accent); outline: 2px solid var(--interactive-accent); outline-offset: 2px; }
.vam-node:focus-visible { outline: 2px dashed var(--interactive-accent); outline-offset: 5px; }
.vam-node-header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.vam-node-header button { font-size: var(--font-ui-smaller); height: 24px; padding: 2px 8px; }
.vam-node-header > .vam-collapse-button { margin-left: auto; font-variant-numeric: tabular-nums; }
.vam-node > .vam-node-tools { position: absolute; right: 10px; bottom: calc(100% - 6px); z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--background-modifier-border); border-radius: 8px; background: var(--background-primary); box-shadow: var(--shadow-s); opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity 120ms ease-out, transform 120ms ease-out; width: max-content; }
.vam-node-tools button { font-size: var(--font-ui-smaller); height: 26px; padding: 2px 8px; }
.vam-node-tools > .vam-collapse-button { order: -1; }
.vam-status { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 0; font-size: var(--font-ui-smaller); color: var(--text-muted); white-space: nowrap; }
.vam-status::before { content: ""; display: inline-block; margin-right: 6px; vertical-align: 1px; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; background: var(--text-faint); }
.vam-status-idea::before { border: 1.5px solid var(--text-faint); background: transparent; }
.vam-status-running { color: var(--text-accent); }
.vam-status-running::before { background: var(--interactive-accent); animation: vam-pulse 1.4s ease-in-out infinite; }
.vam-status-completed::before { background: var(--interactive-accent); }

.vam-status-queued::before { border: 1.5px solid var(--interactive-accent); background: transparent; }
.vam-status-error { color: var(--color-red); }
.vam-status-error::before { background: var(--color-red); }
.vam-node-header button.vam-badge-new { border: 0; cursor: pointer; }
.vam-card-title { color: var(--text-normal); font-size: var(--font-ui-medium); font-weight: 650; line-height: 1.4; margin: 8px 0 4px; overflow-wrap: anywhere; }
.vam-card-summary { margin: 0; color: var(--text-muted); font-size: var(--font-ui-small); line-height: 1.55; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.vam-card-error { margin: 6px 0 0; color: var(--color-red); font-size: var(--font-ui-smaller); line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.vam-node:not([data-aim-kind])[data-status="idea"] { border-style: dashed; border-color: var(--background-modifier-border-hover); box-shadow: none; }
.vam-card-summary.is-preview { font-style: italic; color: var(--text-faint); }
.vam-card-preview-label { font-style: normal; font-weight: 600; margin-right: 6px; }
.vam-node:not([data-aim-kind])[data-status="idea"] .vam-card-summary { color: var(--text-faint); }
.vam-node:not([data-aim-kind])[data-status="running"] { border-color: var(--interactive-accent); }
.vam-node:not([data-aim-kind])[data-status="queued"] { --vam-card-bg: color-mix(in srgb, var(--interactive-accent) 7%, var(--background-primary)); border-style: dashed; border-color: color-mix(in srgb, var(--interactive-accent) 60%, transparent); }
.vam-node:not([data-aim-kind])[data-status="running"]::after { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--interactive-accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: vam-scan 1.6s ease-in-out infinite; }
.vam-node:not([data-aim-kind])[data-status="error"] { border-color: rgba(var(--color-red-rgb), 0.55); }
.vam-relevance-tag { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; font-size: var(--font-ui-smaller); line-height: 1.4; white-space: nowrap; }
.vam-relevance-tag-name { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; white-space: nowrap; }
.vam-relevance-tag > .vam-relevance-icon { display: inline-flex; flex: none; }
.vam-relevance-tag .svg-icon { width: 14px; height: 14px; }
.vam-relevance-tag[data-tier="core"] { color: var(--text-accent); }
.vam-relevance-tag[data-tier="support"] { color: var(--text-muted); }
.vam-relevance-tag[data-tier="side"] { color: var(--text-faint); }
.vam-node[data-relevance="side"] { opacity: .5; transition: border-color 160ms ease-out, box-shadow 160ms ease-out, opacity 160ms ease-out; }
.vam-node[data-relevance="side"]:hover, .vam-node[data-relevance="side"]:focus-within, .vam-node[data-relevance="side"].is-selected { opacity: 1; }
.vam-edge.vam-edge-side { opacity: .2; }
.theme-dark .vam-viewport { background-color: var(--background-primary); }
.theme-dark .vam-node { --vam-card-bg: var(--background-secondary); }
.vam-inspector { width: 300px; flex-shrink: 0; padding: 16px; overflow-y: auto; border-left: 1px solid var(--background-modifier-border); background: var(--background-primary); }
.vam-inspector-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.vam-inspector-heading strong { font-size: var(--font-ui-medium); }
.vam-node.is-readonly, .vam-node.is-readonly:active { cursor: pointer; }
.vam-sample-summary { color: var(--text-muted); line-height: 1.6; }
.vam-sample-detail { line-height: 1.6; }

  .vam-inspector { width: 260px; }

}

}
@keyframes vam-pulse { 50% { opacity: 0.35; } }

/* Viewer-only parts: the pieces Obsidian would otherwise provide. */
.vam-toolbar { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.vam-toolbar .vam-map-switcher { cursor: default; margin: 0; font-weight: 600; font-family: inherit; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.vam-toolbar .vam-map-switcher:hover { background: transparent; }
.vam-shared { font-size: var(--font-ui-smaller); color: var(--text-faint); }

.vam-install:hover { filter: brightness(1.08); }
.vam-goal { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 22em; padding: 0 6px; line-height: var(--input-height); font-size: var(--font-ui-small); color: var(--text-normal); }
.vam-goal-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.vam-map-tools[hidden] { display: none; }

.vam-node { touch-action: none; }

.vam-zoom-controls { overflow: visible; }

<script type="application/json" id="vam-map">{"format":"vam-share","version":1,"title":"料理的科學","goal":"第一次煎牛排","language":"zh-TW","exportedAt":"2026-10-23T05:08:13.549Z","source":{"vamVersion":"0.25.0","mapId":"cec54531-c62b-4f51-9f39-ea937ca752ce"},"viewport":{"x":117.08146051903032,"y":-594.1519812654874,"zoom":0.6039315827113991},"nodes":[{"id":"f9ec7cae-eeb8-4d35-833d-04214dc07841","parentId":null,"x":80,"y":1392,"collapsed":false,"status":"completed","title":"要如何煎出一個好吃的牛排","summary":"好牛排關鍵：厚切、提前乾醃、表面擦乾、鑄鐵鍋高溫快煎、插針測溫、提早離火並靜置。","detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv dir=\"auto\" class=\"callout-title\">\u003cdiv class=\"callout-icon\">\u003csvg class=\"svg-icon lucide-clipboard-list\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-width=\"2\" stroke=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\" height=\"24\" width=\"24\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect ry=\"1\" rx=\"1\" height=\"4\" width=\"8\" y=\"2\" x=\"8\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">Summary\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">\u003cmark>乾燥表面＋高溫＋精準測溫\u003c/mark>是煎好牛排的核心；調味與奶油淋煎是加分，不是成敗關鍵。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">先用鹽乾醃（至少 1 小時，可冷藏靜置最多 48 小時），讓表面乾燥、入味。\u003c/li>\n\u003cli dir=\"auto\">煎前再擦乾，用鑄鐵等厚重鍋具預熱到很熱，才能形成深褐色焦香外殼。\u003c/li>\n\u003cli dir=\"auto\">以溫度計判斷熟度，並提早約 5°F 離火，因為有餘溫續熟。\u003c/li>\n\u003cli dir=\"auto\">最後降溫加奶油、蒜、香草淋煎，離鍋靜置 5–10 分鐘。\u003c/li>\n\u003cli dir=\"auto\">厚切牛排可考慮先低溫烤箱（約 250°F）烤至低於目標約 15°F，再煎表面（反向煎封）。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">關鍵知識\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>熟度\u003c/th>\n\u003cth>離鍋溫度參考（°F）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>三分熟 Rare\u003c/td>\n\u003ctd>120–125\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>五分熟 Medium rare\u003c/td>\n\u003ctd>130–135\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>七分熟 Medium\u003c/td>\n\u003ctd>140–145\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003csvg id=\"m3de2540ce0a9a104\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" style=\"max-width: 995px;\" viewBox=\"95 -62.5 995 478.1000061035156\" role=\"graphics-document document\" aria-roledescription=\"timeline\">\u003cstyle>#m3de2540ce0a9a104{font-family:var(--font-mermaid);font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m3de2540ce0a9a104 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m3de2540ce0a9a104 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m3de2540ce0a9a104 .error-icon{fill:#552222;}#m3de2540ce0a9a104 .error-text{fill:#552222;stroke:#552222;}#m3de2540ce0a9a104 .edge-thickness-normal{stroke-width:1px;}#m3de2540ce0a9a104 .edge-thickness-thick{stroke-width:3.5px;}#m3de2540ce0a9a104 .edge-pattern-solid{stroke-dasharray:0;}#m3de2540ce0a9a104 .edge-thickness-invisible{stroke-width:0;fill:none;}#m3de2540ce0a9a104 .edge-pattern-dashed{stroke-dasharray:3;}#m3de2540ce0a9a104 .edge-pattern-dotted{stroke-dasharray:2;}#m3de2540ce0a9a104 .marker{fill:#333333;stroke:#333333;}#m3de2540ce0a9a104 .marker.cross{stroke:#333333;}#m3de2540ce0a9a104 svg{font-family:var(--font-mermaid);font-size:16px;}#m3de2540ce0a9a104 p{margin:0;}#m3de2540ce0a9a104 .edge{stroke-width:3;}#m3de2540ce0a9a104 .section--1 rect,#m3de2540ce0a9a104 .section--1 path,#m3de2540ce0a9a104 .secti taskWrapper\" transform=\"translate(600, 50)\">\u003cg class=\"timeline-node section-1\">\u003cg>\u003cpath id=\"node-undefined\" class=\"node-bkg node-undefined\" d=\"M0 62.8 v-57.8 q0,-5 5,-5 h180 q5,0 5,5 v62.8 H0 Z\">\u003c/path>\u003cline class=\"node-line-1\" x1=\"0\" y1=\"67.8\" x2=\"190\" y2=\"67.8\">\u003c/line>\u003c/g>\u003cg transform=\"translate(95, 10)\">\u003ctext dy=\"1em\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\">\u003ctspan x=\"0\" dy=\"1em\">七分熟   Medium\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003cg class=\"lineWrapper\">\u003cline x1=\"695\" y1=\"117.8\" x2=\"695\" y2=\"365.6\" stroke-width=\"2\" stroke=\"black\" marker-end=\"url(#m3de2540ce0a9a104-arrowhead)\" stroke-dasharray=\"5,5\">\u003c/line>\u003c/g>\u003cg class=\"eventWrapper\" transform=\"translate(600, 250)\">\u003cg class=\"timeline-node section-1\">\u003cg>\u003cpath id=\"node-undefined\" class=\"node-bkg node-undefined\" d=\"M0 45 v-40 q0,-5 5,-5 h180 q5,0 5,5 v45 H0 Z\">\u003c/path>\u003cline class=\"node-line-1\" x1=\"0\" y1=\"50\" x2=\"190\" y2=\"50\">\u003c/line>\u003c/g>\u003cg transform=\"translate(95, 10)\">\u003ctext dy=\"1em\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\">\u003ctspan x=\"0\" dy=\"1em\">140–145\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003ctext x=\"145\" font-size=\"4ex\" font-weight=\"bold\" y=\"20\">熟度與離鍋溫度（°F）\u003c/text>\u003cg class=\"lineWrapper\">\u003cline x1=\"150\" y1=\"167.8\" x2=\"1040\" y2=\"167.8\" stroke-width=\"4\" stroke=\"black\" marker-end=\"url(#m3de2540ce0a9a104-arrowhead)\">\u003c/line>\u003c/g>\u003c/svg>\n\u003cul>\n\u003cli dir=\"auto\">水分會阻礙褐變，所以要擦乾。\u003c/li>\n\u003cli dir=\"auto\">不沾鍋不適合高溫煎。\u003c/li>\n\u003cli dir=\"auto\">鹽量參考：每磅約 ¾–1 茶匙 Morton 粗鹽（單一來源）。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">證據與來源\u003c/h3>\n\u003cp dir=\"auto\">以上內容整合自一次搜尋結果摘要，包含：\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.splendidtable.org/story/the-rules-for-pan-seared-steak\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.splendidtable.org/story/the-rules-for-pan-seared-steak\" target=\"_blank\">The Splendid Table：煎牛排規則\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://www.fifteenspatulas.com/how-to-properly-sear-a-steak/\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.fifteenspatulas.com/how-to-properly-sear-a-steak/\" target=\"_blank\">Fifteen Spatulas：Pan Seared Steak\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://fountainavenuekitchen.com/print/reverse-sear-steak-with-easy-overnight-dry-brine-option\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://fountainavenuekitchen.com/print/reverse-sear-steak-with-easy-overnight-dry-brine-option\" target=\"_blank\">Fountain Avenue Kitchen：反向煎封與乾醃\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003ca href=\"https://louisiana.kitchenandculture.com/node/5950\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://louisiana.kitchenandculture.com/node/5950\" target=\"_blank\">Kenji 的煎牛排食譜\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">我只看到搜尋摘要，沒有逐頁讀完原文。\u003c/p>\n\u003ch3 dir=\"auto\">取捨與限制\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"warning\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv dir=\"auto\" class=\"callout-title\">\u003cdiv class=\"callout-icon\">\u003csvg class=\"svg-icon lucide-alert-triangle\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-width=\"2\" stroke=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\" height=\"24\" width=\"24\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\">\u003c/path>\u003cpath d=\"M12 9v4\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">Warning\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">各來源的時間與溫度不一致（例如每面 2–3 分鐘，對上每 15–30 秒翻面），請以溫度計為準，不要只靠時間。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">乾醃時間越長越乾、越入味，但需要預先規劃。\u003c/li>\n\u003cli dir=\"auto\">反向煎封較均勻，但步驟較多；薄切牛排不太需要。\u003c/li>\n\u003cli dir=\"auto\">本次沒有比較不同肉種（肋眼、菲力、沙朗）與油脂差異。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">待確認事項\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"question\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv dir=\"auto\" class=\"callout-title\">\u003cdiv class=\"callout-icon\">\u003csvg class=\"svg-icon lucide-help-circle\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-width=\"2\" stroke=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\" height=\"24\" width=\"24\" xmlns=\"http://www.w3.org/2000/svg\">\u003ccircle r=\"10\" cy=\"12\" cx=\"12\">\u003c/circle>\u003cpath d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\">\u003c/path>\u003cpath d=\"M12 17h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">Question\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">翻面一次與頻繁翻面哪個更好？不同厚度的建議火力與時間為何？各部位的最佳熟度？現有資料不足。\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3 dir=\"auto\">更新紀錄\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">首次建立：整合乾醃、煎法、測溫、靜置與反向煎封的基本要點。\u003c/li>\n\u003c/ul>"},{"id":"8d29af53-36e7-4985-b622-4b567e635a37","parentId":"f9ec7cae-eeb8-4d35-833d-04214dc07841","x":440,"y":80,"collapsed":false,"status":"completed","title":"肉品選擇與前處理","summary":"煎牛排宜選嫩部位、油花均勻且厚度足夠的冷藏肉，解凍後擦乾並依時間鹽漬。","tier":"core","detailHtml":"\u003ch3 dir=\"auto\">AI 任務結果 · 2026/9/12 下午1:23:38\u003c/h3>\n\u003cp dir=\"auto\">\u003cstrong>任務：\u003c/strong> 研究「肉品選擇與前處理」並更新目前理解，列出來源與不確定處。\u003c/p>\n\u003ch2 dir=\"auto\">更新後理解\u003c/h2>\n\u003cp dir=\"auto\">肉品本身決定了牛排的嫩度、牛脂風味與可操作空間；前處理的核心則是\u003cstrong>安全解凍、降低表面水分、讓鹽調味與肉的特性相配\u003c/strong>。若目標是以煎製做出外殼焦香、中心仍能保有粉紅熟度的牛排，優先選購適合乾熱烹調的嫩部位，並避免過薄。\u003c/p>\n\u003ch3 dir=\"auto\">1. 肉品選擇\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">\u003cstrong>部位依目標選擇：\u003c/strong>\n\u003cul>\n\u003cli dir=\"auto\">想要濃郁牛脂香、較高容錯：選\u003cstrong>肋眼（Ribeye）\u003c/strong>，其油花通常較多。\u003c/li>\n\u003cli dir=\"auto\">想兼具牛肉味、嫩度與較好控制：選\u003cstrong>紐約客／沙朗（Strip）\u003c/strong>。\u003c/li>\n\u003cli dir=\"auto\">想要最嫩、風味較細緻：選\u003cstrong>菲力（Tenderloin）\u003c/strong>；因脂肪較少，可在完成後搭配奶油或醬汁補足豐潤感。\u003c/li>\n\u003cli dir=\"auto\">預算取向可選\u003cstrong>上蓋肉／Top Sirloin、Flat Iron\u003c/strong>；較瘦或纖維明顯的部位，宜避免煎得過熟，切片時逆紋切。產業資料亦將肋眼描述為油花豐富、Strip 與 Top Sirloin 定位為適合煎烤的選項。 \u003ca href=\"https://www.beefitswhatsfordinner.com/Media/BIWFD/Docs/simplesteakswaps.pdf\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.beefitswhatsfordinner.com/Media/BIWFD/Docs/simplesteakswaps.pdf\" target=\"_blank\">Beef. It’s What’s For Dinner：部位替代指南\u003c/a>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>看油花，不只看等級：\u003c/strong>肌內脂肪（油花）通常有助於多汁與風味；以 USDA 分級為例，Prime 的油花多於 Choice，Choice 多於 Select。不過分級是整體屠體指標，同一等級、不同部位與個別肉排仍會有差異，購買時應直接比較切面油花是否細緻、分布均勻。 \u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/meat-catfish/beef-farm-table\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/meat-catfish/beef-farm-table\" target=\"_blank\">USDA FSIS：Beef From Farm to Table\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>厚度是煎製成功的關鍵規格：\u003c/strong>建議約 \u003cstrong>3–4 公分（1¼–1½ 吋）以上\u003c/strong>。厚肉能先建立焦香外殼，再保留中心的中偏生熟度；薄肉的中心升溫很快，較難同時達成深色外殼與粉嫩內部。厚度也必須納入後續火力與翻面策略，而非只按時間操作。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>新鮮與包裝：\u003c/strong>選摸起來冰涼、包裝完整、無大量滲液或異味的肉。若冷凍，原包裝外再加冷凍專用包材可減少冷凍燒；表面灰褐、皮革狀斑點是空氣接觸造成的品質劣化訊號。 \u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety\" target=\"_blank\">USDA FSIS：冷凍與食品安全\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>讀標示：\u003c/strong>留意是否為「調理／注射增嫩（enhanced）」肉。這類產品常含水、鹽與磷酸鹽，可能較多汁，但既有鹽分；後續鹽漬應顯著減量，避免過鹹。 \u003ca href=\"https://www.beefresearch.org/resources/product-quality/fact-sheets/marinating-of-beef-for-enhancement\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.beefresearch.org/resources/product-quality/fact-sheets/marinating-of-beef-for-enhancement\" target=\"_blank\">Beef Research：Marinating of Beef for Enhancement\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">2. 前處理流程\u003c/h3>\n\u003col>\n\u003cli dir=\"auto\">\u003cstrong>安全解凍：\u003c/strong>首選冷藏解凍；牛排通常可在約一天內解凍。冷水解凍須維持密封、每 30 分鐘換水，完成後立即烹調；微波解凍也應立即烹調。不要放室溫解凍。 \u003ca href=\"https://ask.fsis.usda.gov/article/How-long-does-it-take-for-beef-to-thaw\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://ask.fsis.usda.gov/article/How-long-does-it-take-for-beef-to-thaw\" target=\"_blank\">USDA FSIS：牛肉解凍時間與方法\u003c/a>\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>擦到表面乾燥：\u003c/strong>烹煮前以廚房紙巾徹底吸乾表面與邊緣；這是建立褐變外殼的直接前提。解凍時的肉汁應以盤子承接，並避免接觸即食食物。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>鹽漬按可等待時間決定：\u003c/strong>\n\u003cul>\n\u003cli dir=\"auto\">\u003cstrong>時間充裕：\u003c/strong>可在冷藏中以鹽乾醃，置於架上、不覆蓋，讓鹽調味並使表面更乾。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>時間很短：\u003c/strong>在下鍋前才加鹽，比「剛鹽完便等待一小段時間」更可預測；後者可能使表面出水，反而不利煎香。\u003c/li>\n\u003cli dir=\"auto\">若肉品已調理、醃製或有高鈉飲食需求，應減鹽或改以胡椒、香草與完成後醬汁調味。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>胡椒與其他香料：\u003c/strong>鹽可提前；易焦的香料、糖、蒜末與新鮮香草不宜在高溫煎製前厚敷，宜在後段或完成後使用。\u003c/li>\n\u003cli dir=\"auto\">\u003cstrong>回溫不必久放：\u003c/strong>可在備料期間短暫離開冷藏以減少表面冰冷與濕氣，但「長時間室溫回溫」並非必要，也不應以此取代冷藏保存。生鮮肉在室溫累積超過 2 小時（炎熱環境為 1 小時）有食安風險。 \u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/meat/ground-beef-and-food-safety\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/meat/ground-beef-and-food-safety\" target=\"_blank\">USDA FSIS：牛肉處理原則\u003c/a>\u003c/li>\n\u003c/ol>\n\u003ch3 dir=\"auto\">建議的採買與準備決策\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情境\u003c/th>\n\u003cth>優先選擇\u003c/th>\n\u003cth>前處理重點\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>第一次煎、想穩定成功\u003c/td>\n\u003ctd>3–4 公分厚的肋眼或紐約客\u003c/td>\n\u003ctd>冷藏解凍、擦乾、提早鹽漬或臨煎才鹽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>偏好低脂與細嫩\u003c/td>\n\u003ctd>菲力\u003c/td>\n\u003ctd>勿過熟；完成後以奶油／醬汁補足風味\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>預算有限\u003c/td>\n\u003ctd>上蓋肉、Flat Iron\u003c/td>\n\u003ctd>選油花較佳者；控制在偏生至中等熟度，逆紋切\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已買調理／注射肉\u003c/td>\n\u003ctd>依原部位烹調\u003c/td>\n\u003ctd>先讀鈉與成分標示，減少額外鹽漬\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>冷凍庫存\u003c/td>\n\u003ctd>真空或妥善包裝肉排\u003c/td>\n\u003ctd>提前冷藏解凍；完全擦乾後才煎\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 dir=\"auto\">不確定處與限制\u003c/h3>\n\u003cul>\n\u003cli dir=\"auto\">「最佳」部位與油花量取決於預算、偏好的牛脂感、飲食限制及目標熟度；油花多不必然符合每個人的口感或健康需求。\u003c/li>\n\u003cli dir=\"auto\">肉品名稱、分級、飼養方式與可得部位會因台灣通路、產地與進口規格而異；USDA 等級可作理解油花的參考，但不等同於所有市場的唯一品質標準。\u003c/li>\n\u003cli dir=\"auto\">乾鹽漬的精確鹽量與時間需依肉排厚度、鹽粒大小、是否已調理及個人口味調整；上述原則優先於單一固定數字。\u003c/li>\n\u003cli dir=\"auto\">食安最低內溫與追求的牛排熟度可能衝突。USDA 對整塊牛排／烤肉的最低建議為中心 \u003cstrong>62.8°C（145°F）\u003c/strong>後靜置；若採較低熟度，需理解風險受肉品來源、保存與處理衛生影響。 \u003ca href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/meat-catfish/beef-farm-table\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/meat-catfish/beef-farm-table\" target=\"_blank\">USDA FSIS：Beef From Farm to Table\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">對母議題的貢獻\u003c/h3>\n\u003cp dir=\"auto\">建立穩定的起點，避免因肉品條件或表面水分而難以上色、受熱不均。\u003c/p>"},{"id":"26ef697e-dc87-48f8-9d41-6b77db73d675","parentId":"f9ec7cae-eeb8-4d35-833d-04214dc07841","x":440,"y":976.875,"collapsed":false,"status":"completed","title":"鍋具、油脂與預熱","summary":"用厚重鑄鐵或碳鋼鍋、高煙點油，預熱至油面閃動或微冒煙再下肉，並避免擠鍋。","tier":"core","detailHtml":"\u003ch3 dir=\"auto\">核心結論\u003c/h3>\n\u003cdiv class=\"callout\" data-callout=\"summary\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv dir=\"auto\" class=\"callout-title\">\u003cdiv class=\"callout-icon\">\u003csvg class=\"svg-icon lucide-clipboard-list\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-width=\"2\" stroke=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\" height=\"24\" width=\"24\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect ry=\"1\" rx=\"1\" height=\"4\" width=\"8\" y=\"2\" x=\"8\">\u003c/rect>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\">\u003c/path>\u003cpath d=\"M12 11h4\">\u003c/path>\u003cpath d=\"M12 16h4\">\u003c/path>\u003cpath d=\"M8 11h.01\">\u003c/path>\u003cpath d=\"M8 16h.01\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">Summary\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">煎牛排的關鍵是「鍋要夠熱、鍋要夠重、油要耐高溫」。厚重的\u003cmark>鑄鐵或碳鋼鍋\u003c/mark>先預熱，再加高煙點油，以油面閃動或微冒煙為下肉訊號，可兼顧梅納反應與減少沾鍋、焦苦。\u003c/p>\n\u003c/div>\u003c/div>\n\u003cul>\n\u003cli dir=\"auto\">鍋具首選鑄鐵或厚碳鋼：蓄熱多，冷肉下鍋後溫度掉得少，較易形成外殼。\u003c/li>\n\u003cli dir=\"auto\">預熱要充分：多數來源建議中大火加熱約 5 分鐘，目標約 400–450°F（約 205–230°C）。\u003c/li>\n\u003cli dir=\"auto\">油要在鍋熱後才加，選高煙點油，奶油留到最後。\u003c/li>\n\u003cli dir=\"auto\">鍋面不要擠滿，否則降溫後肉會出水、變成蒸煮。\u003c/li>\n\u003c/ul>\n\u003ch3 dir=\"auto\">關鍵知識\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>項目\u003c/th>\n\u003cth>建議\u003c/th>\n\u003cth>備註\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>鑄鐵\u003c/td>\n\u003ctd>蓄熱最佳，適合厚切牛排\u003c/td>\n\u003ctd>重、需保養\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>碳鋼\u003c/td>\n\u003ctd>較輕、好操作，厚款蓄熱佳\u003c/td>\n\u003ctd>擦乾防鏽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不鏽鋼（三層）\u003c/td>\n\u003ctd>升溫快但降溫也快\u003c/td>\n\u003ctd>未充分預熱易沾鍋\u003c/td>\n\u003c/tr>\n
